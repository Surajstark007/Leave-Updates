/* ═══ DATE PARSER ═══ */
function parseD(s){if(!s)return[];const r=[];s.split(",").map(x=>x.trim()).forEach(p=>{
  const rm=p.match(/(\d{4}-\d{2}-\d{2})\s*(?:to|-)\s*(\d{4}-\d{2}-\d{2})/);
  if(rm){let d=new Date(rm[1]);const e=new Date(rm[2]);while(d<=e){r.push(new Date(d));d.setDate(d.getDate()+1)}return}
  const im=p.match(/(\d{4}-\d{2}-\d{2})/);if(im){r.push(new Date(im[1]));return}
  const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const lr=p.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d+)\s*[-\u2013to]+\s*(\d+)/i);
  if(lr){const m=M[lr[1].toLowerCase().slice(0,3)];if(m!==undefined)for(let d=+lr[2];d<=+lr[3];d++)r.push(new Date(2026,m,d));return}
  const ld=p.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d+)/i);
  if(ld){const m=M[ld[1].toLowerCase().slice(0,3)];if(m!==undefined)r.push(new Date(2026,m,+ld[2]));return}
  const nr=p.match(/(\d+)\s*[-\u2013]\s*(\d+)/),mc=p.match(/(Nov|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Dec|Thanksgiving)/i);
  if(nr&&mc){let mn=mc[1].toLowerCase();if(mn==="thanksgiving")mn="nov";const m=M[mn.slice(0,3)];if(m!==undefined)for(let d=+nr[1];d<=+nr[2];d++)r.push(new Date(2026,m,d))}
});return r}
function filterF(s){if(!s)return"";return s.split(",").map(x=>x.trim()).filter(p=>{const d=parseD(p);if(!d.length)return/Jun|Jul|Aug|Sep|Oct|Nov|Dec|Thanksgiving/i.test(p);return d.some(x=>x>=TODAY)}).join(", ")}
function countF(s){return s?parseD(s).filter(d=>d>=TODAY).length:0}
function exProj(b){if(!b)return[];return b.split("\n").map(l=>{const m=l.match(/^(.+?)\s*[-\u2013:]/);return m?m[1].trim():l.trim()}).filter(Boolean)}

/* ═══ LOGIN SCREEN ═══ */
function LoginScreen({onLogin}){
  const [step,setStep]=useState("email");
  const [email,setEmail]=useState("");
  const [name,setName]=useState("");
  const [err,setErr]=useState("");

  const checkEmail=async()=>{
    if(!email.includes("@")){setErr("Enter a valid email");return}
    setLoading(true);setErr("");
    const user=await checkUser(email);
    if(user){
      await logActivity(email,user.name,"login");
      setLoading(false);
      onLogin(email,user.name);
    }else{
      setLoading(false);
      setStep("name");
    }
  };
  const register=async()=>{
    if(name.trim().length<2){setErr("Enter your full name");return}

  };

  return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f172a,#1e293b,#0f172a)",fontFamily:F}},

                h("button",{onClick:()=>setEditItem(r),style:{padding:5,borderRadius:6,border:"1px solid rgba(148,163,184,.1)",background:"rgba(99,102,241,.08)",color:"#a5b4fc",display:"flex"}},h(Ic.Edit)),
                h("button",{onClick:()=>setDeleteId(r.id),style:{padding:5,borderRadius:6,border:"1px solid rgba(248,113,113,.15)",background:"rgba(248,113,113,.06)",color:"#f87171",display:"flex"}},h(Ic.Trash)))))})))),
        !processed.length&&h("div",{style:{padding:40,textAlign:"center",color:"#475569"}},h("p",{style:{fontSize:14}},"No matching records"))),
      h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:8,padding:"0 2px"}},h("span",{style:{fontSize:10,color:"#475569"}},"Showing "+processed.length+" of "+data.length),h("span",{style:{fontSize:10,color:"#475569"}},"Today: "+TS))),

        h("button",{onClick:handleDelete,style:{padding:"9px 20px",background:"linear-gradient(135deg,#ef4444,#dc2626)",border:"none",borderRadius:9,color:"#fff",fontSize:13,fontWeight:600,fontFamily:F}},"Delete"))))
