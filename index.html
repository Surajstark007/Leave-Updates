async function upsertLeave(entry,addedBy){
  const existing=await fetch(SB_URL+'/rest/v1/lt_leaves?name=ilike.'+encodeURIComponent(entry.name)+'&deleted=eq.false&limit=1',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  const existingData=await existing.json();

  // Try with half_days first; if that fails (column may not exist), retry without it
  const tryUpsert=async(withHalfDays)=>{
    const payload={
      type:entry.type,
      dates:JSON.stringify(entry.dates),
      backup:entry.backup,
      updated_at:new Date().toISOString(),
      added_by:addedBy,
      ...(withHalfDays?{half_days:JSON.stringify(entry.halfDays||{})}:{})
    };
    if(existingData&&existingData.length>0){
      const r=await fetch(SB_URL+'/rest/v1/lt_leaves?id=eq.'+existingData[0].id,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(!r.ok){const txt=await r.text();throw new Error(txt)}
      return r.json();
    }else{
      const r=await fetch(SB_URL+'/rest/v1/lt_leaves',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({name:entry.name,...payload})});
      if(!r.ok){const txt=await r.text();throw new Error(txt)}
      return r.json();
    }
  };

  try{
    return await tryUpsert(true);
  }catch(e1){
    // If it failed due to unknown column half_days, retry without it
    if(e1.message.includes('half_days')||e1.message.includes('column')){
      console.warn('half_days column missing, retrying without it');
      return await tryUpsert(false);
    }
    throw e1;
  }
}

async function upsertProjectEntry(entry){
  // entry: {id?, name, date, project, next_call, backup, agenda}
  try{
    if(entry.id){
      const r=await fetch(SB_URL+'/rest/v1/lt_projects?id=eq.'+entry.id,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({date:entry.date,project:entry.project,next_call:entry.next_call||'',backup:entry.backup||'',agenda:entry.agenda||'',updated_at:new Date().toISOString()})});
      if(!r.ok)throw new Error('patch failed');
      return r.json();
    }else{
      const r=await fetch(SB_URL+'/rest/v1/lt_projects',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({name:entry.name,date:entry.date,project:entry.project,next_call:entry.next_call||'',backup:entry.backup||'',agenda:entry.agenda||''})});
      if(!r.ok)throw new Error('insert failed');
      return r.json();
    }
  }catch(e){
    // Fallback: store locally with temp id
    const cache=JSON.parse(localStorage.getItem('cx_lt_proj_cache')||'[]');
    const tempId='local_'+Date.now();
    if(entry.id){const idx=cache.findIndex(x=>x.id===entry.id);if(idx>=0)cache[idx]={...cache[idx],...entry};else cache.push({...entry})}
    else cache.push({...entry,id:tempId,deleted:false,created_at:new Date().toISOString()});
    localStorage.setItem('cx_lt_proj_cache',JSON.stringify(cache));
    return[{...entry,id:tempId}];
  }
}

// Sync leave-linked project entries into lt_projects master table
// Called after every leave save so the Projects & Agenda view is always complete
async function syncLeaveProjectsToMaster(userName,backupStr){
  if(!backupStr||!backupStr.trim())return;
  const entries=parseProjectEntries(backupStr,false); // skip __NO_CALLS__
  if(entries.length===0)return;
  // Delete old leave-linked entries for this user first (source='leave_sync')
  try{
    await fetch(SB_URL+'/rest/v1/lt_projects?name=ilike.'+encodeURIComponent(userName)+'&source=eq.leave_sync',{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify({deleted:true,updated_at:new Date().toISOString()})
    });
  }catch(e){console.warn('syncLeaveProjects delete failed:',e.message)}
  // Insert fresh entries
  for(const e of entries){
    try{
      await fetch(SB_URL+'/rest/v1/lt_projects',{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
        body:JSON.stringify({
          name:userName,
          date:e.date||'',
          project:e.project||'',
          next_call:'',
          backup:e.persons.join(', ')||'',
          agenda:e.agenda||'',
          source:'leave_sync'
        })
      });
    }catch(e2){console.warn('syncLeaveProjects insert failed:',e2.message)}
  }
}
function mergeCanvasAndUserLeaves(canvasMembers,userLeaves){
  const merged=[...canvasMembers];const deletedNames=new Set();
  for(const ul of userLeaves){
    if(ul.deleted){deletedNames.add(ul.name.toLowerCase());continue}
    let dates=[];
    try{dates=typeof ul.dates==='string'?JSON.parse(ul.dates):ul.dates||[]}catch{dates=[]}
    let halfDays={};
    try{halfDays=typeof ul.half_days==='string'?JSON.parse(ul.half_days):ul.half_days||{}}catch{halfDays={}}
    // Keep all user-saved dates — do NOT filter by isFuture here.
    // The view filters handle display (upcoming/today/week/all).
    // Filtering here causes data to vanish after the leave date passes.
    const validDates=dates.filter(d=>d&&d.match(/^\d{4}-\d{2}-\d{2}$/));
    const idx=merged.findIndex(m=>m.name.toLowerCase()===ul.name.toLowerCase());
    if(idx>=0){
      // Merge dates: keep canvas dates (already future-filtered on canvas side) + all user dates
      const mergedDates=new Set([...merged[idx].dates,...validDates]);
      merged[idx]={
        ...merged[idx],
        dates:[...mergedDates].sort(),
        backup:ul.backup||merged[idx].backup,
        type:ul.type||merged[idx].type,
        halfDays:{...(merged[idx].halfDays||{}),...halfDays}
      };
    }else{
      merged.push({name:ul.name,dates:validDates.sort(),backup:ul.backup||'',type:ul.type||'PTO',raw:'',halfDays});
    }
  }
  return merged.filter(m=>!deletedNames.has(m.name.toLowerCase()));
}

function buildCsvContent(members){
  const csvEscape=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['Employee Name','Leave Type','Leave Date Range','Total Leave Days','Leave Dates (all)','Project Date','Project Name','Backup Owner(s)','Agenda / Notes']];
  for(const m of members){
    const hd=m.halfDays||{};
    const ranges=groupConsecutiveDates(m.dates);
    const dateRangeStr=ranges.map(r=>r.start===r.end?fmtDateWithHalf(r.start,hd):fmtDateWithHalf(r.start,hd)+' – '+fmtDateWithHalf(r.end,hd)).join(' | ');
    const allDates=m.dates.map(d=>fmtDateWithHalf(d,hd)).join(', ');
    const totalDays=countLeaveDays(m.dates,hd);
    const projects=parseProjectEntries(m.backup||'');
    if(projects.length===0){
      rows.push([m.name,m.type,dateRangeStr,totalDays,allDates,'','','','']);
    } else {
      projects.forEach((p,pi)=>{
        rows.push([
          pi===0?m.name:'',pi===0?m.type:'',pi===0?dateRangeStr:'',pi===0?totalDays:'',pi===0?allDates:'',
          p.date?fmtDateWithHalf(p.date,hd):'',p.project||'',p.persons.join(', ')||'',p.agenda||''
        ]);
      });
    }
  }
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}

function downloadCsv(content,filename){
  const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

// ─── PROJECTS & AGENDA MODAL (standalone work tracker + leave-linked team view) ───
function ProjectsAgendaModal({members,userName,allNames,onClose}){
  const[activeTab,setActiveTab]=useState('mine');
  const[projEntries,setProjEntries]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  // Edit state for "My Entries" tab
  const blankEntry=()=>({id:null,date:todayStr(),project:'',next_call:'',backup:'',agenda:'',showPicker:false,pickerQ:'',_dirty:false});
  const[draftEntries,setDraftEntries]=useState([blankEntry()]);
  const[saveMsg,setSaveMsg]=useState('');
  // Team view filters
  const[search,setSearch]=useState('');
  const[memberFilter,setMemberFilter]=useState('');
  const[dateFilter,setDateFilter]=useState('');
  const generatedAt=new Date().toLocaleString();

  // Load all standalone project entries on mount
  useEffect(()=>{
    fetchProjectEntries().then(data=>{
      setProjEntries(data||[]);
      // Pre-populate My Entries with manual (non-leave_sync) entries for current user
      const mine=(data||[]).filter(e=>e.name&&e.name.toLowerCase()===userName.toLowerCase()&&e.source!=='leave_sync'&&!e.deleted);
      setDraftEntries(mine.length>0?mine.map(e=>({...e,showPicker:false,pickerQ:'',_dirty:false})):[blankEntry()]);
      setLoading(false);
    });
  },[userName]);

  const myEntries=draftEntries;
  const updateDraft=(idx,field,val)=>setDraftEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val,_dirty:true}:x));
  const addDraftRow=()=>setDraftEntries(e=>[...e,blankEntry()]);
  const removeDraftRow=async(idx)=>{
    const entry=draftEntries[idx];
    if(entry.id&&!String(entry.id).startsWith('local_')){
      await deleteProjectEntry(entry.id);
      setProjEntries(p=>p.filter(x=>x.id!==entry.id));
    }
    setDraftEntries(e=>e.filter((_,i)=>i!==idx));
  };

  const addPersonToDraft=(idx,person)=>setDraftEntries(e=>e.map((x,i)=>{
    if(i!==idx)return x;
    const existing=(x.backup||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(existing.includes(person))return{...x,showPicker:false,pickerQ:''};
    return{...x,backup:[...existing,person].join(', '),showPicker:false,pickerQ:'',_dirty:true};
  }));
  const removePersonFromDraft=(idx,person)=>setDraftEntries(e=>e.map((x,i)=>{
    if(i!==idx)return x;
    const persons=(x.backup||'').split(',').map(s=>s.trim()).filter(p=>p&&p!==person);
    return{...x,backup:persons.join(', '),_dirty:true};
  }));

  const handleSaveAll=async()=>{
    const toSave=draftEntries.filter(e=>e.project.trim());
    if(toSave.length===0){setSaveMsg('Add at least one project name to save.');return}
    setSaving(true);setSaveMsg('');
    try{
      const saved=[];
      for(const e of toSave){
        const result=await upsertProjectEntry({...e,name:userName});
        if(result&&result[0])saved.push({...result[0],showPicker:false,pickerQ:'',_dirty:false});
        else saved.push({...e,_dirty:false});
      }
      // Refresh from server
      const fresh=await fetchProjectEntries();
      setProjEntries(fresh||[]);
      const mine=(fresh||[]).filter(e=>e.name&&e.name.toLowerCase()===userName.toLowerCase());
      setDraftEntries(mine.length>0?mine.map(e=>({...e,showPicker:false,pickerQ:'',_dirty:false})):[blankEntry()]);
      setSaveMsg('✓ Saved successfully');
      setTimeout(()=>setSaveMsg(''),3000);
    }catch(err){setSaveMsg('Save failed — changes stored locally')}
    setSaving(false);
  };

  // Merge: lt_projects entries (both standalone + leave_sync) for team view
  // Deduplicate: if an entry exists in both lt_projects AND in the backup string, prefer lt_projects version
  const allTeamEntries=useMemo(()=>{
    const rows=[];
    const seenKeys=new Set(); // member+date+project dedup
    // First: all lt_projects entries (standalone + leave_sync)
    projEntries.forEach(e=>{
      if(e.deleted)return;
      const src=e.source==='leave_sync'?'leave_sync':'standalone';
      const key=(e.name||'').toLowerCase()+'|'+(e.date||'')+'|'+(e.project||'').toLowerCase();
      seenKeys.add(key);
      rows.push({
        member:e.name||'',source:src,type:'—',rangeStr:'',
        date:e.date||'',project:e.project||'',
        next_call:e.next_call||'',
        backup:e.backup?e.backup.split(',').map(s=>s.trim()).filter(Boolean):[],
        agenda:e.agenda||'',isNoCalls:false,noProjects:false
      });
    });
    // Second: Leave-linked entries from backup strings not already in lt_projects
    members.forEach(m=>{
      const projs=parseProjectEntries(m.backup||'',true);
      const ranges=groupConsecutiveDates(m.dates);
      const rangeStr=ranges.map(r=>r.start===r.end?fmtDate(r.start):fmtDate(r.start)+' – '+fmtDate(r.end)).join(', ');
      if(projs.length===0){
        rows.push({member:m.name,source:'leave',type:m.type,rangeStr,date:'',project:'',next_call:'',backup:[],agenda:'',isNoCalls:false,noProjects:true});
      }else{
        projs.forEach(p=>{
          const key=m.name.toLowerCase()+'|'+(p.date||'')+'|'+(p.project||'').toLowerCase();
          if(!seenKeys.has(key)){
            rows.push({member:m.name,source:'leave',type:m.type,rangeStr,date:p.date,project:p.project,next_call:'',backup:p.persons,agenda:p.agenda,isNoCalls:p.isNoCalls,noProjects:false});
          }
        });
      }
    });
    return rows.sort((a,b)=>a.date>b.date?1:a.date<b.date?-1:a.member.localeCompare(b.member));
  },[projEntries,members]);

  const uniqueMembers=[...new Set(allTeamEntries.map(e=>e.member).filter(Boolean))].sort();
  const uniqueDates=[...new Set(allTeamEntries.map(e=>e.date).filter(Boolean))].sort();

  const filteredTeam=useMemo(()=>{
    let r=allTeamEntries;
    if(memberFilter)r=r.filter(e=>e.member===memberFilter);
    if(dateFilter)r=r.filter(e=>e.date===dateFilter);
    if(search.trim()){const q=search.toLowerCase();r=r.filter(e=>e.member.toLowerCase().includes(q)||e.project.toLowerCase().includes(q)||(e.backup||[]).join(' ').toLowerCase().includes(q)||e.agenda.toLowerCase().includes(q))}
    return r;
  },[allTeamEntries,memberFilter,dateFilter,search]);

  const handleCsv=()=>{
    const esc=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s};
    const rows=[['Source','Employee','Leave Type','Leave Range','Date','Project','Next Call','Backup Owner(s)','Agenda / Notes']];
    filteredTeam.forEach(e=>{
      rows.push([e.source==='standalone'?'Standalone':'Leave-linked',e.member,e.type||'',e.rangeStr||'',e.date?fmtDate(e.date):'',e.isNoCalls?'No customer calls':e.project||'',e.next_call||'',(e.backup||[]).join(', ')||'',e.agenda||'']);
    });
    const csv=rows.map(r=>r.map(esc).join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='cx-projects-agenda-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
  };

  const handlePdf=()=>{
    const rows=filteredTeam.map(e=>`<tr>
      <td style="font-size:10px;color:#888">${e.source==='standalone'?'🗂️':'📅'}</td>
      <td style="font-weight:600">${e.member||'—'}</td>
      <td style="font-family:monospace;font-size:11px;white-space:nowrap;color:#e8590c">${e.date?fmtDate(e.date):'—'}</td>
      <td style="font-weight:500;color:${e.isNoCalls?'#0c8599':'inherit'}">${e.isNoCalls?'📵 No calls':e.project||'—'}</td>
      <td style="font-size:11px;color:#0c8599">${e.next_call||'—'}</td>
      <td>${(e.backup||[]).join(', ')||'—'}</td>
      <td style="color:#6b5344">${e.agenda||'—'}</td>
    </tr>`).join('');
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Projects & Agenda — CX Leave Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;padding:32px 36px;color:#2c1810;font-size:13px;line-height:1.6}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:14px;border-bottom:3px solid #e8590c}
h1{font-size:20px;font-weight:700}.meta{font-size:11px;color:#9a8576;margin-top:3px}
.print-btn{padding:7px 14px;background:#e8590c;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;background:#f7f3ee;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#9a8576;border-bottom:2px solid #e0d5c7;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #e0d5c7;vertical-align:top;font-size:12px}
.footer{margin-top:24px;font-size:10px;color:#9a8576;border-top:1px solid #e0d5c7;padding-top:10px;display:flex;justify-content:space-between}
@media print{.print-btn{display:none}}</style></head><body>
<div class="header"><div><h1>📋 Projects &amp; Agenda</h1><div class="meta">CX Leave Tracker · ${generatedAt}</div></div>
<button class="print-btn" onclick="window.print()">Print / Save PDF</button></div>
<table><thead><tr><th></th><th>Employee</th><th>Date</th><th>Project</th><th>Next Call</th><th>Backup Owner</th><th>Agenda / Notes</th></tr></thead>
<tbody>${rows}</tbody></table>
<div class="footer"><span>CX Leave Tracker · Projects &amp; Agenda</span><span>${generatedAt}</span></div>
</body></html>`);
    w.document.close();
  };

  const subLbl={fontSize:11,color:'var(--text3)',marginBottom:3,display:'block'};
  const tbc={PTO:'badge-pto',Sick:'badge-sick',Mixed:'badge-mixed','Business Travel':'badge-bt',Other:'badge-other'};
  const unsaved=draftEntries.some(e=>e._dirty&&e.project.trim());

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:940,width:'96%',maxHeight:'92vh'}}>
    {/* Header */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,gap:12,flexWrap:'wrap'}}>
      <div>
        <h3 style={{fontSize:18,fontWeight:700,display:'flex',alignItems:'center',gap:8}}><Icon name="clipboard" size={18}/> Projects &amp; Agenda</h3>
        <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>Log your customer calls, projects and agendas — independent of leave</div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        {activeTab==='team'&&<>
          <button className="btn btn-sm btn-secondary" onClick={handleCsv}><Icon name="csv" size={13}/> CSV</button>

// ─── IMPORT LEAVE MODAL (CSV / Excel) ───
function ImportLeaveModal({onClose,onImport,userName}){
  const[step,setStep]=useState('upload');
  const[parseErr,setParseErr]=useState('');
  const[parsed,setParsed]=useState(null);
  const[importing,setImporting]=useState(false);
  const[importLog,setImportLog]=useState([]);
  const[dragOver,setDragOver]=useState(false);
  const fileRef=useRef(null);

  const downloadTemplate=()=>{
    const cols=['Date (YYYY-MM-DD)','Leave Type (PTO/Sick/Mixed/Business Travel)','Half Day (full/first/second)','Project Name','Backup Person(s) (comma separated)','Agenda / Notes'];
    const rows=[cols,['2025-06-10','PTO','full','Shield Roofing','Sundeep, Balaje','Review Q2 pipeline and hand off open tickets'],['2025-06-11','PTO','full','Acme Corp','Kari','Weekly sync — Kari to cover'],['2025-06-12','PTO','first','','','No customer calls']];
    const csv=rows.map(r=>r.map(v=>{const s=String(v);return s.includes(',')||s.includes('"')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='cx-leave-import-template.csv';
    document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
  };

  const parseCsvText=(text)=>{
    // Normalize line endings and split
    const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    // Find first non-empty line as header
    const nonEmpty=lines.map((l,i)=>({l,i})).filter(x=>x.l.trim());
    if(nonEmpty.length<2)return{error:'File is empty or has no data rows'};
    const parseRow=(line)=>{
      const cells=[];let cur='';let inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++}else inQ=!inQ}
        else if(c===','&&!inQ){cells.push(cur.trim());cur=''}
        else cur+=c;
      }
      cells.push(cur.trim());return cells;
    };
    // Try comma first; if only 1 column try tab, then semicolon
    const headerLine=nonEmpty[0].l;
    let sep=',';
    if(parseRow(headerLine).length<2){
      if(headerLine.includes('\t'))sep='\t';
      else if(headerLine.includes(';'))sep=';';
    }
    const parseRowSep=(line)=>{
      if(sep===',')return parseRow(line);
      return line.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
    };
    const rawHeader=parseRowSep(nonEmpty[0].l);
    // Normalize header keys: lowercase, strip non-alphanumeric, keep for fuzzy matching
    const header=rawHeader.map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
    const rows=[];
    for(let i=1;i<nonEmpty.length;i++){
      const cells=parseRowSep(nonEmpty[i].l);
      if(cells.every(c=>!c.trim()))continue;
      const row={};
      header.forEach((h,j)=>{row[h]=(cells[j]||'').trim()});
      // Also store with original header for fallback
      rawHeader.forEach((h,j)=>{row['_raw_'+h.toLowerCase()]=(cells[j]||'').trim()});
      row['_cells']=cells; // positional fallback
      rows.push(row);
    }
    return{header,rawHeader,rows};
  };

  // Convert Excel date serial number to YYYY-MM-DD
  const excelSerialToDate=(serial)=>{
    if(!serial||isNaN(serial))return null;
    const n=Number(serial);
    if(n<1000||n>100000)return null; // not a plausible serial
    // Excel epoch: Jan 1 1900 = 1, with the 1900 leap year bug
    const d=new Date(Date.UTC(1900,0,1)+(n-2)*86400*1000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  };

  // Parse a date string in any common format → YYYY-MM-DD or null
  const parseAnyDate=(raw)=>{
    if(!raw||!raw.trim())return null;
    const s=raw.trim();
    // YYYY-MM-DD or YYYY/MM/DD
    let m=s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})$/);
    if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    // DD-MM-YYYY or DD/MM/YYYY (European)
    m=s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
    if(m){
      // Disambiguate: if first part >12 it must be day
      const a=parseInt(m[1]),b=parseInt(m[2]);
      if(a>12)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); // DD/MM/YYYY
      // Assume DD/MM/YYYY (common in India/UK)
      return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    }
    // MM/DD/YYYY (US)
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
    // DD-Mon-YYYY or DD Mon YYYY (e.g. 10-Jun-2025)
    const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    m=s.match(/^(\d{1,2})[-\s]([a-zA-Z]{3,})[-\s](\d{2,4})$/);
    if(m){const mn=months[m[2].toLowerCase().slice(0,3)];const yr=m[3].length===2?'20'+m[3]:m[3];if(mn)return yr+'-'+mn+'-'+m[1].padStart(2,'0')}
    // Excel serial number
    if(/^\d{5}$/.test(s))return excelSerialToDate(parseInt(s));
    // ISO with time: 2025-06-10T...
    m=s.match(/^(\d{4}-\d{2}-\d{2})T/);
    if(m)return m[1];
    return null;
  };

  // Find the date column index — try header matching first, then scan first row for date-like values
  const findDateColumnIdx=(header,rawHeader,firstRow)=>{
    // Priority: header contains 'date'
    const byName=header.findIndex(h=>h.includes('date'));
    if(byName>=0)return byName;
    // Try raw header
    const byRaw=rawHeader.findIndex(h=>h.toLowerCase().includes('date'));
    if(byRaw>=0)return byRaw;
    // Scan first data row for a parseable date value
    if(firstRow&&firstRow._cells){
      for(let i=0;i<firstRow._cells.length;i++){
        if(parseAnyDate(firstRow._cells[i]))return i;
      }
    }
    return 0; // fallback: assume first column
  };

  const normaliseRows=(rows,rawHeader,header)=>{
    const dates=[];const halfDays={};const entries=[];let type='PTO';
    const typeMap={'pto':'PTO','sick':'Sick','mixed':'Mixed','businesstravel':'Business Travel','bt':'Business Travel','business':'Business Travel'};

    const dateColIdx=findDateColumnIdx(header,rawHeader,rows[0]);
    const skipped=[];

    rows.forEach(row=>{
      // Get raw date value — try mapped key first, then positional
      const dateKey=header[dateColIdx]||'';
      const rawDate=row[dateKey]||row['dateyyyyymmdd']||row['date']||row['leavedate']||row['_cells']?.[dateColIdx]||'';
      const dateStr=parseAnyDate(rawDate);
      if(!dateStr){if(rawDate)skipped.push(rawDate);return}
      if(!dates.includes(dateStr))dates.push(dateStr);

      // Leave type — check multiple possible header keys
      const rawType=(row['leavetypepto']||row['leavetype']||row['type']||row['leave']||'').trim().toLowerCase().replace(/[^a-z]/g,'');
      if(rawType&&typeMap[rawType])type=typeMap[rawType];

      // Half day
      const rawHalf=(row['halfdayfull']||row['halfday']||row['half']||row['halfdayfullhalf']||'').trim().toLowerCase();
      if(rawHalf==='first'||rawHalf==='1st'||rawHalf==='am'||rawHalf==='firsthalf')halfDays[dateStr]='first';
      else if(rawHalf==='second'||rawHalf==='2nd'||rawHalf==='pm'||rawHalf==='secondhalf')halfDays[dateStr]='second';

      // Project
      const project=(row['projectname']||row['project']||row['customer']||row['customername']||'').trim();
      const backupRaw=(row['backuppersons']||row['backup']||row['backuppersonscommaseparated']||row['backupowner']||row['dri']||row['backupresource']||'').trim();
      const agenda=(row['agendanotes']||row['agenda']||row['notes']||row['note']||row['handoffnotes']||'').trim();
      const persons=backupRaw?backupRaw.split(/[,;]+/).map(s=>s.trim()).filter(Boolean):[];
      const isNoCalls=!project&&!persons.length&&(agenda.toLowerCase().includes('no customer call')||agenda.toLowerCase().includes('no call'));
      entries.push({date:dateStr,project,persons,agenda,isNoCalls});
    });

    dates.sort();
    return{dates,type,halfDays,entries,rowCount:rows.length,skipped};
  };

  const handleFile=async(file)=>{
    if(!file)return;setParseErr('');
    const ext=file.name.split('.').pop().toLowerCase();
    try{
      let text='';
      if(ext==='csv'||ext==='txt'){
        // Try UTF-8 first, fall back to latin1 for Excel-exported CSVs
        text=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'UTF-8')});
        // Strip UTF-8 BOM if present
        if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      }else if(ext==='xlsx'||ext==='xls'){
        if(!window.XLSX){
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});
        }
        const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsArrayBuffer(file)});
        const wb=window.XLSX.read(buf,{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        // Use sheet_to_csv with dateNF to get ISO dates, not serial numbers
        text=window.XLSX.utils.sheet_to_csv(ws,{dateNF:'yyyy-mm-dd'});
      }else{setParseErr('Unsupported file type. Use .csv, .xlsx, or .xls');return}

      const{error,rows,rawHeader,header}=parseCsvText(text);
      if(error){setParseErr(error);return}
      if(!rows||rows.length===0){setParseErr('File has a header row but no data rows');return}

      const result=normaliseRows(rows,rawHeader||[],header||[]);
      if(result.dates.length===0){
        // Give helpful diagnostics
        const sample=rows[0]?JSON.stringify(rows[0]._cells||rows[0]).slice(0,200):'(no rows)';
        const skippedNote=result.skipped.length>0?` Values seen in date column: ${result.skipped.slice(0,4).join(', ')}.`:'';
        setParseErr(`No valid dates found.${skippedNote} First row values: ${sample}. Supported formats: YYYY-MM-DD, DD/MM/YYYY, DD-Mon-YYYY.`);
        return;
      }
      // Warn if some rows were skipped
      if(result.skipped.length>0){
        console.warn('Skipped date values:',result.skipped);
      }
      setParsed(result);setStep('preview');
    }catch(e){setParseErr('Could not read file: '+e.message)}
  };

  const confirmImport=async()=>{
    if(!parsed)return;
    setImporting(true);setStep('importing');setImportLog([]);
    const backupStr=parsed.entries.filter(e=>e.project||e.persons.length>0||e.isNoCalls).map(e=>{
      if(e.isNoCalls)return'['+e.date+'] __NO_CALLS__';

function getAutoReplyText(name,dates){
  const sorted=[...dates].sort();const ranges=groupConsecutiveDates(sorted);
  const latestRange=ranges[ranges.length-1];const returnDay=getNextWorkingDay(latestRange.end);
  const returnStr=returnDay.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
  let dateDesc='';
  if(ranges.length===1){const r=ranges[0];if(r.start===r.end)dateDesc='on '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});else dateDesc='from '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})+' to '+new Date(r.end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})}
  else{const first=new Date(ranges[0].start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});const last=new Date(ranges[ranges.length-1].end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});dateDesc='from '+first+' to '+last}
  return`Hello,\n\nThank you for your email. I am out of office ${dateDesc} and will be back on ${returnStr}.\n\nI have limited access to my mail and will respond to your email as soon as possible upon my return.\n\nThank you for your understanding.\n\nBest regards,\n${name}`;
}

// ─── ADD/EDIT LEAVE MODAL ───
// dayStatus tracks per-weekday state: 'pending' | 'no_calls' | 'has_projects'
// noCalls: Set of dateStr that have "No customer calls" checked
function AddLeaveModal({onClose,onSave,existingNames,editData,userName,allUserData}){
  const[name]=useState(editData?editData.name:(userName||''));
  const[type,setType]=useState(editData?editData.type:'PTO');
  const[dates,setDates]=useState(editData?[...editData.dates]:[]);
  // halfDays: {dateStr: 'first'|'second'|'full'}  — only stored for non-full days
  const[halfDays,setHalfDays]=useState(()=>editData&&editData.halfDays?{...editData.halfDays}:{});
  const[rangeStart,setRangeStart]=useState('');
  const[rangeEnd,setRangeEnd]=useState('');
  const[dateInput,setDateInput]=useState('');
  const[rangeErr,setRangeErr]=useState('');
  const[tab,setTab]=useState('dates');
  const[saveErr,setSaveErr]=useState('');
  const[editFilter,setEditFilter]=useState({date:'',project:''});

  const setHalfDay=(dateStr,val)=>setHalfDays(hd=>{
    const n={...hd};
    if(val==='full'||!val)delete n[dateStr];
    else n[dateStr]=val;
    return n;
  });

  // noCalls: set of dateStrs where user says no customer calls
  const[noCalls,setNoCalls]=useState(()=>{
    // On edit, restore from backup entries tagged __NO_CALLS__
    if(!editData?.backup)return new Set();
    const s=new Set();
    editData.backup.split('\n').forEach(line=>{
      const m=line.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*__NO_CALLS__/);
      if(m)s.add(m[1]);
    });
    return s;
  });

  // Load previous entries from editData, filtering out __NO_CALLS__ sentinels
  const parseInitialEntries=()=>{
    if(!editData?.backup)return[];
    return parseProjectEntries(editData.backup)
      .filter(p=>p.project!=='__NO_CALLS__')
      .map(p=>({...p,newPerson:'',showPicker:false,pickerQ:''}));
  };
  const[entries,setEntries]=useState(parseInitialEntries);

  // previousEntries: all historical entries for this user across all saved data
  // so user can reuse/edit old project info for new leave dates
  const previousEntries=useMemo(()=>{
    if(!allUserData)return[];
    const myRecord=allUserData.find(m=>m.name.toLowerCase()===name.toLowerCase());
    if(!myRecord?.backup)return[];
    return parseProjectEntries(myRecord.backup).filter(p=>p.project&&p.project!=='__NO_CALLS__');
  },[allUserData,name]);

  const weekdays=useMemo(()=>dates.filter(isWeekday).sort(),[dates]);

  // ── Validation: each weekday must have either noCalls OR ≥1 project entry ──
  const dayStatus=useMemo(()=>{
    const s={};
    weekdays.forEach(d=>{
      if(noCalls.has(d)){s[d]='no_calls';return}
      const hasProject=entries.some(e=>e.date===d&&(e.project.trim()||e.persons.length>0));
      s[d]=hasProject?'has_projects':'pending';
    });
    return s;
  },[weekdays,noCalls,entries]);

  const allDaysDone=weekdays.length===0||weekdays.every(d=>dayStatus[d]!=='pending');
  const pendingDays=weekdays.filter(d=>dayStatus[d]==='pending');

  const toggleNoCalls=(dateStr)=>{
    setNoCalls(prev=>{
      const n=new Set(prev);
      if(n.has(dateStr)){n.delete(dateStr)}
      else{
        n.add(dateStr);
        setEntries(e=>e.filter(en=>en.date!==dateStr));
        // Auto-advance: find next pending weekday and focus it
        setTimeout(()=>{
          const nextPending=weekdays.find(d=>d>dateStr&&!n.has(d)&&!entries.some(e=>e.date===d&&(e.project.trim()||e.persons.length>0)));
          if(nextPending)setEditFilter(f=>({...f,date:nextPending}));
        },50);
      }
      return n;
    });
  };

  // ── Date range validation ──
  const handleRangeStartChange=v=>{
    setRangeStart(v);setRangeErr('');
    if(rangeEnd&&v&&rangeEnd<v){setRangeEnd('');setRangeErr('End date was before start — please re-select')}
  };
  const handleRangeEndChange=v=>{
    setRangeEnd(v);setRangeErr('');
    if(rangeStart&&v&&v<rangeStart){setRangeErr('End date must be on or after start date');setRangeEnd('')}
  };
  const applyRange=()=>{
    if(!rangeStart||!rangeEnd){setRangeErr('Select both start and end dates');return}
    if(rangeEnd<rangeStart){setRangeErr('End date must be on or after start date');return}
    const allInRange=expandDateRange(rangeStart,rangeEnd);
    const newDates=new Set(dates);allInRange.forEach(d=>newDates.add(d));
    setDates([...newDates].sort());setRangeStart('');setRangeEnd('');setRangeErr('');
  };
  const rangePreviewDays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?expandDateRange(rangeStart,rangeEnd).length:0;
  const rangePreviewWeekdays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?getWeekdaysInRange(rangeStart,rangeEnd).length:0;

  // ── Entry management ──
  const updateEntry=(idx,field,val)=>setEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val}:x));
  const removeEntry=idx=>setEntries(e=>e.filter((_,i)=>i!==idx));
  const addPersonToEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx)return x;if(x.persons.includes(person))return x;return{...x,persons:[...x.persons,person],showPicker:false,pickerQ:''}}))};
  const removePersonFromEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>i===idx?{...x,persons:x.persons.filter(p=>p!==person)}:x))};
  const addNewPersonToEntry=(idx)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx||!x.newPerson.trim())return x;const np=x.newPerson.trim();if(x.persons.includes(np))return{...x,newPerson:''};return{...x,persons:[...x.persons,np],newPerson:''}}))};

  const addEntryForDay=(dateStr)=>{
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setEntries(e=>[...e,{date:dateStr,project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  };
  // Copy a previous entry into a specific day (pre-fill)
  const copyPrevEntryToDay=(dateStr,prev)=>{
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setEntries(e=>[...e,{date:dateStr,project:prev.project,persons:[...prev.persons],newPerson:'',agenda:prev.agenda||'',showPicker:false,pickerQ:''}]);
  };
  const addBlankEntry=()=>setEntries(e=>[...e,{date:'',project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  const deleteDateEntry=(dateStr)=>{
    setDates(ds=>ds.filter(d=>d!==dateStr));
    setEntries(e=>e.filter(en=>en.date!==dateStr));
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setHalfDays(hd=>{const n={...hd};delete n[dateStr];return n});
  };

  const filteredEntries=useMemo(()=>{
    let e=entries;
    if(editFilter.date)e=e.filter(x=>x.date===editFilter.date);
    if(editFilter.project)e=e.filter(x=>x.project.toLowerCase().includes(editFilter.project.toLowerCase()));
    return e;
  },[entries,editFilter]);

  // ── Build backup string — includes __NO_CALLS__ sentinels ──
  const buildFinalBackup=()=>{
    const lines=[];
    // No-calls sentinels (sorted)
    [...noCalls].sort().forEach(d=>lines.push('['+d+'] __NO_CALLS__'));
    // Regular project entries
    entries.filter(e=>e.project||e.persons.length>0).forEach(e=>{
      let s='';
      if(e.date)s+='['+e.date+'] ';
      if(e.project){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
      else if(e.persons.length>0)s+=e.persons.join(', ');
      if(e.agenda)s+=' | Agenda: '+e.agenda;
      lines.push(s);
    });
    return lines.join('\n');
  };

  // ── Save with validation ──
  const handleSave=()=>{
    if(!name.trim())return;
    setSaveErr('');
    if(weekdays.length>0&&!allDaysDone){
      const missing=pendingDays.map(fmtDate).join(', ');
      setSaveErr('Each weekday needs project info or "No customer calls": '+missing);
      setTab('projects');
      return;
    }
    onSave({name:name.trim(),type,dates,backup:buildFinalBackup(),halfDays});
  };

  const lbl={fontSize:12,color:'var(--text2)',marginBottom:4,display:'block',fontWeight:500};
  const subLbl={fontSize:11,color:'var(--text3)',marginBottom:3,display:'block'};

  const projectTabStatus=weekdays.length===0?'ok':allDaysDone?'ok':'warn';

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:660}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <h3 style={{fontSize:17,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3>
      <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
    </div>

    {editData&&<div style={{fontSize:12,color:'var(--text2)',marginBottom:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>Editing leave for <strong>{editData.name}</strong> — you can also edit previous project agenda below.</div>}
    <div style={{marginBottom:14,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',fontSize:14,fontWeight:600}}>{name||userName||'You'}</div>

    <label style={lbl}>Leave Type</label>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
      {['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(<button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'var(--accent-light)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>{t}</button>))}
    </div>

    {/* Tab switcher with completion status */}
    <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)',marginBottom:14}}>
      {[
        {k:'dates',label:'📅 Leave Dates',badge:dates.length>0?dates.length:null,color:'var(--accent)'},
        {k:'projects',label:'📋 Projects & Backup',badge:weekdays.length>0?(allDaysDone?'✓':pendingDays.length+' pending'):null,color:allDaysDone?'var(--green)':'var(--amber)'}
      ].map(t=>(
        <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:'6px 10px',borderRadius:6,fontSize:12.5,fontWeight:500,border:'none',background:tab===t.k?'var(--accent)':'transparent',color:tab===t.k?'#fff':'var(--text2)',cursor:'pointer',transition:'all .15s',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
          {t.label}
          {t.badge!==null&&<span style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:999,background:tab===t.k?'rgba(255,255,255,.25)':t.color,color:tab===t.k?'#fff':'#fff',minWidth:18,textAlign:'center'}}>{t.badge}</span>}
        </button>
      ))}
    </div>

    {/* ══ TAB: DATES ══ */}
    {tab==='dates'&&<div>
      <div style={{marginBottom:10,padding:'12px',background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)'}}>
        <label style={{...lbl,marginBottom:8}}>Add Date Range</label>
        <div style={{display:'flex',gap:6,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>Start date</div>
            <input type="date" className={'input'+(rangeErr&&!rangeStart?' input-error':'')} value={rangeStart} onChange={e=>handleRangeStartChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:22,color:'var(--text3)',fontSize:13,flexShrink:0}}>→</div>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>End date{rangeStart&&<span style={{color:'var(--accent)'}}> (≥ {fmtDate(rangeStart)})</span>}</div>
            <input type="date" className={'input'+(rangeErr?' input-error':'')} value={rangeEnd} min={rangeStart||undefined} onChange={e=>handleRangeEndChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:20,flexShrink:0}}><button className="btn btn-sm btn-primary" onClick={applyRange} disabled={!rangeStart||!rangeEnd}>Add</button></div>
        </div>
        {rangeErr&&<div className="date-validation-hint">⚠ {rangeErr}</div>}

        <input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)}

        <button className="btn btn-sm btn-secondary" onClick={()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}>+ Single</button>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:11.5,color:'var(--text2)',fontWeight:500}}>{dates.length} date{dates.length!==1?'s':''} · {weekdays.length} weekday{weekdays.length!==1?'s':''} · <span style={{color:'var(--accent)'}}>{countLeaveDays(dates,halfDays)} leave day{countLeaveDays(dates,halfDays)!==1?'s':''}</span></span>
        {dates.length>0&&<button className="btn btn-sm btn-danger" onClick={()=>{setDates([]);setEntries([]);setNoCalls(new Set());setHalfDays({})}} style={{fontSize:10,padding:'2px 8px'}}>Clear all</button>}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10,minHeight:24}}>
        {dates.length===0?<span style={{fontSize:12,color:'var(--text3)',fontStyle:'italic'}}>No dates added yet</span>:dates.map(d=>{
          const hd=halfDays[d];
          return(<span key={d} className={'chip '+(isToday(d)?'chip-today':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10.5,gap:3}}>
            {fmtDate(d)}
            {!isWeekday(d)&&<span style={{fontSize:9,opacity:.6}}> wknd</span>}
            {hd&&hd!=='full'&&<span style={{fontSize:9.5,background:'rgba(255,255,255,.3)',borderRadius:4,padding:'0 4px',marginLeft:2,fontFamily:'sans-serif'}}>{hd==='first'?'AM':'PM'}</span>}
            <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>deleteDateEntry(d)}>×</span>
          </span>);

      </div>

      {/* Half-day picker — shown when there are weekday dates */}
      {weekdays.length>0&&<div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 12px',marginBottom:10}}>

        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {weekdays.map(d=>{
            const hd=halfDays[d]||'full';
            return(<div key={d} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 8px',background:'var(--surface)',borderRadius:7,border:'1px solid var(--border)'}}>
              <span style={{fontSize:11.5,fontFamily:"'JetBrains Mono',monospace",color:'var(--accent)',minWidth:58,flexShrink:0}}>{fmtDate(d)}</span>
              <span style={{fontSize:11,color:'var(--text3)',flex:1}}>{new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'})}</span>
              <div style={{display:'flex',gap:4}}>
                {['full','first','second'].map(v=>(

                    borderColor:hd===v?'var(--accent)':'var(--border)',
                    background:hd===v?'var(--accent)':'transparent',
                    color:hd===v?'#fff':'var(--text2)'}}>
                    {v==='full'?'Full':v==='first'?'½ AM':'½ PM'}

              </div>
            </div>);

        </div>
        {Object.values(halfDays).some(v=>v&&v!=='full')&&<div style={{fontSize:11,color:'var(--amber)',marginTop:8}}>
          ⚠ Half-days count as 0.5 days each. Total: <strong>{countLeaveDays(dates,halfDays)} leave days</strong>
        </div>}
      </div>}

      {weekdays.length>0&&<div style={{display:'flex',alignItems:'center',gap:6,fontSize:11}}>
        <span style={{color:'var(--green)'}}>✓ {weekdays.length} weekday{weekdays.length!==1?'s':''} selected</span>
        <button className="btn btn-sm btn-secondary" onClick={()=>setTab('projects')} style={{fontSize:11,padding:'2px 10px',marginLeft:4}}>Go to Projects →</button>
      </div>}
    </div>}

    {/* ══ TAB: PROJECTS ══ */}
    {tab==='projects'&&<div>
      {weekdays.length===0&&<div style={{padding:16,background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',textAlign:'center',marginBottom:12}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:4}}>No weekdays selected yet</div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:10}}>Add leave dates first, then assign projects per day.</div>
        <button className="btn btn-sm btn-secondary" onClick={()=>setTab('dates')}>← Go to Dates</button>
      </div>}

      {weekdays.length>0&&<div>
        {/* Mandatory-fill notice */}

          <span style={{fontSize:15,flexShrink:0}}>⚠</span>
          <div><strong>Required for all weekdays:</strong> Add at least one project entry, or check "No customer calls on this date" for each day before saving.</div>
        </div>}
        {allDaysDone&&<div style={{padding:'8px 12px',background:'var(--green-bg)',border:'1px solid rgba(43,138,62,.25)',borderRadius:8,marginBottom:12,fontSize:12,color:'var(--green)',display:'flex',alignItems:'center',gap:6}}>
          ✓ All {weekdays.length} weekday{weekdays.length!==1?'s':''} accounted for — ready to save.
        </div>}

        {/* Filter bar */}
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <select className="input" value={editFilter.date} onChange={e=>setEditFilter(f=>({...f,date:e.target.value}))} style={{flex:1,fontSize:12,padding:'5px 28px 5px 10px'}}>
            <option value="">All dates</option>
            {weekdays.map(d=><option key={d} value={d}>{fmtDate(d)} {dayStatus[d]==='no_calls'?'(no calls)':dayStatus[d]==='has_projects'?'✓':'⚠'}</option>)}
          </select>
          <input className="input" placeholder="Filter by project..." value={editFilter.project} onChange={e=>setEditFilter(f=>({...f,project:e.target.value}))} style={{flex:1,fontSize:12}}/>
          {(editFilter.date||editFilter.project)&&<button className="btn btn-sm btn-secondary" onClick={()=>setEditFilter({date:'',project:''})} style={{fontSize:11}}>Clear</button>}
        </div>

        {/* Previous entries reuse panel (shown when there's historical data and this is a new leave) */}
        {previousEntries.length>0&&!editFilter.date&&!editFilter.project&&<div style={{marginBottom:12,padding:'10px 12px',background:'var(--indigo-bg)',border:'1px solid rgba(92,71,224,.18)',borderRadius:10}}>
          <div style={{fontSize:11.5,fontWeight:600,color:'var(--indigo)',marginBottom:8}}>📂 Your previous project entries — click to reuse on a date</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {previousEntries.slice(0,8).map((p,pi)=>(
              <div key={pi} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'5px 10px',fontSize:11.5,cursor:'default',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontWeight:500,color:'var(--text)'}}>{p.project}</span>
                {p.persons.length>0&&<span style={{color:'var(--text3)'}}>→ {p.persons.join(', ')}</span>}
                {weekdays.filter(d=>dayStatus[d]==='pending').length>0&&<select
                  onChange={e=>{if(e.target.value){copyPrevEntryToDay(e.target.value,p);e.target.value=''}}}
                  style={{fontSize:10,padding:'2px 4px',borderRadius:5,border:'1px solid var(--border)',background:'var(--accent)',color:'#fff',cursor:'pointer'}}
                >
                  <option value="">+ Add to day</option>
                  {weekdays.filter(d=>dayStatus[d]==='pending').map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}
                </select>}
              </div>
            ))}
          </div>
        </div>}

        {/* One card per weekday */}
        {weekdays.filter(d=>!editFilter.date||d===editFilter.date).map(dayStr=>{
          const status=dayStatus[dayStr];
          const isNoCallsDay=noCalls.has(dayStr);
          const dayEntries=entries.map((e,i)=>({...e,_idx:i})).filter(e=>e.date===dayStr&&(!editFilter.project||e.project.toLowerCase().includes(editFilter.project.toLowerCase())));

          const statusColor=status==='no_calls'?'var(--cyan)':status==='has_projects'?'var(--green)':'var(--amber)';
          const statusIcon=status==='no_calls'?'📵':status==='has_projects'?'✓':'⚠';

          return(<div key={dayStr} className="day-entry-card" style={{borderColor:status==='pending'?'rgba(230,119,0,.35)':status==='has_projects'?'rgba(43,138,62,.3)':'rgba(12,133,153,.3)'}}>
            <div className="day-entry-header">
              <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}}>
                <span className="day-label">{fmtDate(dayStr)}</span>
                <span style={{fontSize:11,color:'var(--text3)'}}>{new Date(dayStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'})}</span>
                <span style={{fontSize:11,fontWeight:600,color:statusColor,marginLeft:'auto',flexShrink:0}}>{statusIcon} {status==='pending'?'Needs info':status==='no_calls'?'No calls':''}</span>
              </div>
            </div>

            {/* "No customer calls" toggle */}
            <label style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:isNoCallsDay?'rgba(12,133,153,.08)':'var(--surface2)',borderRadius:8,border:'1px solid',borderColor:isNoCallsDay?'rgba(12,133,153,.3)':'var(--border)',cursor:'pointer',marginBottom:8,userSelect:'none'}}>
              <input type="checkbox" checked={isNoCallsDay} onChange={()=>toggleNoCalls(dayStr)} style={{accentColor:'var(--cyan)',width:15,height:15,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:12.5,fontWeight:500,color:isNoCallsDay?'var(--cyan)':'var(--text)'}}>No customer calls on this date</div>
                {isNoCallsDay&&<div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>You can still add project updates below if needed</div>}
              </div>
            </label>

            {/* Project entries for this day */}
            {!isNoCallsDay&&dayEntries.length===0&&<div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',padding:'4px 0 2px'}}>
              No projects added yet — required unless "No customer calls" is checked
            </div>}

            {dayEntries.map(entry=>{
              const idx=entry._idx;
              return(<div key={idx} className="fade-in" style={{background:'var(--surface)',borderRadius:8,padding:10,marginTop:6,border:'1px solid var(--border)'}}>
                <div style={{display:'flex',gap:8,marginBottom:6}}>
                  <div style={{flex:1}}>
                    <label style={subLbl}>Project Name <span style={{color:'var(--red)'}}>*</span></label>
                    <input className={'input'+(entry._touched&&!entry.project.trim()?' input-error':'')} placeholder="e.g. Shield Roofing" value={entry.project} onChange={e=>updateEntry(idx,'project',e.target.value)} onBlur={()=>updateEntry(idx,'_touched',true)} style={{fontSize:13}}/>
                  </div>
                  <button className="btn-icon" onClick={()=>removeEntry(idx)} style={{width:26,height:26,color:'var(--red)',marginTop:17,flexShrink:0}}><Icon name="trash" size={12}/></button>
                </div>
                <label style={subLbl}>Backup Person(s)</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6,minHeight:26}}>
                  {entry.persons.map(p=>(<span key={p} className="chip chip-future" style={{fontSize:11}}>{p} <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>removePersonFromEntry(idx,p)}>×</span></span>))}
                  <button className="btn btn-sm btn-secondary" onClick={()=>updateEntry(idx,'showPicker',!entry.showPicker)} style={{fontSize:11,padding:'2px 8px',borderRadius:999}}><Icon name="plus" size={11}/> {entry.showPicker?'Close':'Add'}</button>
                </div>
                {entry.showPicker&&<div className="fade-in" style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:8,marginBottom:8}}>
                  <input className="input" placeholder="Search team members..." value={entry.pickerQ} onChange={e=>updateEntry(idx,'pickerQ',e.target.value)} style={{fontSize:12,marginBottom:6,padding:'5px 10px'}}/>
                  <div style={{maxHeight:100,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
                    {existingNames.filter(n=>!entry.persons.includes(n)&&(!entry.pickerQ||n.toLowerCase().includes(entry.pickerQ.toLowerCase()))).map(n=>(
                      <div key={n} onClick={()=>addPersonToEntry(idx,n)} style={{padding:'4px 8px',borderRadius:4,fontSize:12,cursor:'pointer'}} onMouseOver={e=>e.currentTarget.style.background='var(--accent-light)'} onMouseOut={e=>e.currentTarget.style.background='transparent'}>{n}</div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:6,marginTop:6,borderTop:'1px solid var(--border)',paddingTop:6}}>
                    <input className="input" placeholder="Or type new name..." value={entry.newPerson} onChange={e=>updateEntry(idx,'newPerson',e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNewPersonToEntry(idx)} style={{fontSize:12,padding:'4px 8px',flex:1}}/>
                    <button className="btn btn-sm btn-primary" onClick={()=>addNewPersonToEntry(idx)} style={{fontSize:11,padding:'3px 10px'}}>Add</button>
                  </div>
                </div>}
                <label style={subLbl}>Agenda / Notes</label>
                <textarea className="input" placeholder="Meeting agenda, handoff notes, updates..." value={entry.agenda} onChange={e=>updateEntry(idx,'agenda',e.target.value)} style={{fontSize:12.5,minHeight:52,resize:'vertical',lineHeight:1.5}}/>
              </div>);
            })}

            {/* Always show "Add Project" button — even when no-calls is checked (for updates) */}
            <button className="btn btn-sm btn-secondary" onClick={()=>addEntryForDay(dayStr)} style={{fontSize:11,padding:'4px 10px',marginTop:8,width:'100%'}}>
              <Icon name="plus" size={11}/> {isNoCallsDay?'Add project update anyway':'Add Project'}
            </button>
          </div>);
        })}

        {/* Bottom hint: next pending day quick-jump */}
        {weekdays.filter(d=>dayStatus[d]==='pending').length>0&&!editFilter.date&&(
          <div style={{marginTop:10,padding:'10px 14px',background:'var(--amber-bg)',border:'1px solid rgba(230,119,0,.25)',borderRadius:8,fontSize:12,color:'var(--amber)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
            <span>⚠ {weekdays.filter(d=>dayStatus[d]==='pending').length} day{weekdays.filter(d=>dayStatus[d]==='pending').length!==1?'s':''} still need info</span>
            <button className="btn btn-sm" onClick={()=>setEditFilter(f=>({...f,date:weekdays.find(d=>dayStatus[d]==='pending')||''}))} style={{background:'var(--amber)',color:'#fff',border:'none',fontSize:11}}>
              Jump to next →
            </button>
          </div>
        )}
      </div>}
    </div>}

    {/* Footer */}
    {saveErr&&<div style={{padding:'8px 12px',background:'var(--red-bg)',border:'1px solid var(--red-border)',borderRadius:8,fontSize:12,color:'var(--red)',marginTop:10}}>⚠ {saveErr}</div>}
    <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'space-between',alignItems:'center'}}>
      <div style={{fontSize:11.5,color:'var(--text3)'}}>{dates.length} date{dates.length!==1?'s':''} · {countLeaveDays(dates,halfDays)} leave day{countLeaveDays(dates,halfDays)!==1?'s':''} · {noCalls.size} no-call · {entries.filter(e=>e.project||e.persons.length>0).length} entries</div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={handleSave} title={!allDaysDone&&weekdays.length>0?'Complete all weekdays first':''}>
          {editData?'Update':'Save'}
        </button>
      </div>
    </div>
  </div></div>);
}

// ─── MAIN APP ───
function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem('cx_lt_theme')||'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('cx_lt_theme',theme)},[theme]);
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_lt_session'))}catch{return null}});
  const[data,setData]=useState([]);
  const[lastSync,setLastSync]=useState('Loading...');
  const[view,setView]=useState('upcoming');const[weekDate,setWeekDate]=useState(new Date());
  const[typeFilter,setTypeFilter]=useState('All');const[search,setSearch]=useState('');
  const[selectedUsers,setSelectedUsers]=useState([]);
  const[showAddLeave,setShowAddLeave]=useState(false);const[showUserPicker,setShowUserPicker]=useState(false);
  const[toasts,setToasts]=useState([]);const[editingIdx,setEditingIdx]=useState(null);
  const[showOoo,setShowOoo]=useState(false);const[oooData,setOooData]=useState(null);
  const[showDeleteConfirm,setShowDeleteConfirm]=useState(null);
  const[showExport,setShowExport]=useState(null);  // single member export
  const[showBulkExport,setShowBulkExport]=useState(false);
  const[showProjectsAgenda,setShowProjectsAgenda]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[refreshing,setRefreshing]=useState(false);
  const toast=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)};

  const loadAllData=async(showToast=false)=>{
    let canvasMembers=[];
    let syncLabel='Loading...';
    try{
      const c=await readCache();
      if(c){canvasMembers=parseCanvasMarkdown(c.markdown);syncLabel=new Date(c.updated_at).toLocaleString()}
    }catch(e){console.warn('Canvas cache read failed:',e.message)}
    try{
      const ul=await fetchUserLeaves();
      const merged=mergeCanvasAndUserLeaves(canvasMembers,ul);
      setData(merged);
      setLastSync(syncLabel);
      if(showToast)toast('Data refreshed','success');
    }catch(e){
      console.error('loadAllData error:',e.message);
      // Try localStorage fallback
      try{
        const cached=JSON.parse(localStorage.getItem('cx_lt_leaves_cache')||'[]');
        setData(mergeCanvasAndUserLeaves(canvasMembers,cached));
        setLastSync(syncLabel+' (offline)');
        if(showToast)toast('Using cached data — network unavailable','info');
      }catch{setData(canvasMembers);setLastSync('Error loading')}
    }
  };
  useEffect(()=>{loadAllData()},[]);

  const handleRefresh=async()=>{
    setRefreshing(true);
    await loadAllData(true);
    setRefreshing(false);
  };

  const allNames=useMemo(()=>data.map(m=>m.name).sort(),[data]);

  const filtered=useMemo(()=>{
    let r=data;
    if(view==='today')r=r.filter(m=>m.dates.some(isToday));
    else if(view==='upcoming')r=r.filter(m=>m.dates.some(d=>d>=todayStr())); // includes today
    else if(view==='week')r=r.filter(m=>m.dates.some(d=>inWeek(d,weekDate)));
    // 'all' shows everyone including past dates
    if(typeFilter!=='All')r=r.filter(m=>m.type===typeFilter);
    if(selectedUsers.length>0)r=r.filter(m=>selectedUsers.includes(m.name));
    if(search.trim()){const q=search.toLowerCase();r=r.filter(m=>m.name.toLowerCase().includes(q)||(m.backup||'').toLowerCase().includes(q)||m.dates.some(d=>d.includes(q)))}
    return[...r].sort((a,b)=>{const aMe=user&&a.name.toLowerCase()===user.name.toLowerCase();const bMe=user&&b.name.toLowerCase()===user.name.toLowerCase();if(aMe&&!bMe)return-1;if(!aMe&&bMe)return 1;return a.name.localeCompare(b.name)});
  },[data,view,weekDate,typeFilter,selectedUsers,search,user]);

  const stats=useMemo(()=>({total:data.length,today:data.filter(m=>m.dates.some(isToday)).length,week:data.filter(m=>m.dates.some(d=>inWeek(d,new Date()))).length,upcoming:data.filter(m=>m.dates.length>0).length}),[data]);
  const clearFilters=()=>{setView('upcoming');setTypeFilter('All');setSearch('');setSelectedUsers([])};

  // Build human-readable filter description for bulk export
  const filterDesc=useMemo(()=>{
    const parts=[];
    if(view!=='upcoming')parts.push('View: '+view.charAt(0).toUpperCase()+view.slice(1));
    if(typeFilter!=='All')parts.push('Type: '+typeFilter);
    if(selectedUsers.length>0)parts.push('Members: '+selectedUsers.join(', '));
    if(search.trim())parts.push('Search: "'+search.trim()+'"');
    return parts.join(' · ');
  },[view,typeFilter,selectedUsers,search]);

  const hasFilters=!!(view!=='upcoming'||typeFilter!=='All'||selectedUsers.length>0||search.trim());

  const handleDeleteMember=idx=>setShowDeleteConfirm(idx);
  const confirmDelete=async()=>{
    const idx=showDeleteConfirm;const member=data[idx];
    setData(d=>d.filter((_,i)=>i!==idx));setShowDeleteConfirm(null);
    try{await softDeleteLeave(member.name);toast(member.name+' removed','success')}
    catch{toast('Removed locally (save failed)','error')}
  };

  const handleSaveLeave=async(entry)=>{
    // Do NOT filter by isFuture — user may save today's leave or back-dated entries
    const savedDates=[...new Set(entry.dates)].filter(d=>d&&d.match(/^\d{4}-\d{2}-\d{2}$/)).sort();
    const savedHalfDays=entry.halfDays||{};
    const cleanHalfDays={};
    savedDates.forEach(d=>{if(savedHalfDays[d]&&savedHalfDays[d]!=='full')cleanHalfDays[d]=savedHalfDays[d]});

    const finalEntry={...entry,dates:savedDates,halfDays:cleanHalfDays};
    const wasEditing=editingIdx!==null;

    // 1. Optimistically update local state immediately so UI shows data right away
    if(wasEditing){
      setData(d=>d.map((m,i)=>i===editingIdx?{...m,...finalEntry}:m));
      setEditingIdx(null);
    }else{
      const ei=data.findIndex(m=>m.name.toLowerCase()===entry.name.toLowerCase());
      if(ei>=0){
        setData(d=>d.map((m,i)=>{
          if(i!==ei)return m;
          const mg=new Set([...m.dates,...savedDates]);
          return{...m,dates:[...mg].sort(),backup:finalEntry.backup||m.backup,type:finalEntry.type||m.type,halfDays:{...(m.halfDays||{}),...cleanHalfDays}};
        }));
      }else{
        setData(d=>[...d,{name:finalEntry.name,dates:savedDates,backup:finalEntry.backup,type:finalEntry.type,raw:'',halfDays:cleanHalfDays}]);
      }
    }
    setShowAddLeave(false);

    // 2. Persist to Supabase and confirm
    try{
      await upsertLeave(finalEntry,user?.email||'');
      // Sync project entries into the master lt_projects table
      syncLeaveProjectsToMaster(finalEntry.name,finalEntry.backup).catch(e=>console.warn('sync projects:',e.message));
      // 3. Reload from DB to confirm data is actually there
      const freshLeaves=await fetchUserLeaves();
      const canvasMembers=data.filter(m=>m.raw!==undefined&&m.raw!=='');
      const freshMerged=mergeCanvasAndUserLeaves(
        canvasMembers.map(m=>({...m})),
        freshLeaves
      );
      setData(freshMerged);
      toast('Leave saved ✓','success');
    }catch(e){
      // Data is still in local state but not persisted — warn clearly
      console.error('upsertLeave failed:',e.message);
      toast('⚠ Saved locally only — database error: '+e.message.slice(0,60),'error');
    }

    if(savedDates.length>0){
      setTimeout(()=>{setOooData({name:finalEntry.name,dates:savedDates});setShowOoo(true)},200);
    }
  };

  if(!user)return<LoginScreen onLogin={setUser}/>;
  const tbc={PTO:'badge-pto',Sick:'badge-sick',Mixed:'badge-mixed','Business Travel':'badge-bt',Other:'badge-other'};

  return(<div style={{minHeight:'100vh',background:'var(--bg)'}}>
    <ToastContainer toasts={toasts} remove={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>

    <header style={{position:'sticky',top:0,zIndex:50,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',background:'var(--header-bg)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--header-border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#fff',fontWeight:700}}>CX</div>
        <span style={{fontSize:17,fontWeight:700}}>Leave Tracker</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <button className="btn btn-secondary btn-sm" onClick={handleRefresh} disabled={refreshing}><span className={refreshing?'spin':''} style={{display:'inline-flex'}}><Icon name="refresh" size={14}/></span> {refreshing?'…':'Refresh'}</button>
        <button className="btn btn-sm" onClick={()=>setShowImport(true)} style={{background:'var(--green-bg)',color:'var(--green)',border:'1px solid rgba(43,138,62,.25)'}}><Icon name="download" size={14}/> Import</button>
        <button className="btn btn-sm" onClick={()=>setShowProjectsAgenda(true)} style={{background:'var(--indigo-bg)',color:'var(--indigo)',border:'1px solid rgba(92,71,224,.2)'}}><Icon name="clipboard" size={14}/> Projects &amp; Agenda</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditingIdx(null);setShowAddLeave(true)}}><Icon name="plus" size={14}/> Add My Leave</button>
        <button className="theme-toggle" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}/>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4,paddingLeft:8,borderLeft:'1px solid var(--border)'}}>
          <span style={{fontSize:12,color:'var(--text2)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name}</span>
          <button className="btn-icon" title="Logout" onClick={()=>{localStorage.removeItem('cx_lt_session');setUser(null)}} style={{width:28,height:28}}><Icon name="logout" size={14}/></button>
        </div>
      </div>
    </header>

    <main style={{maxWidth:1320,margin:'0 auto',padding:'18px 18px 40px'}}>
      <div className="stat-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[{key:'all',val:stats.total,label:'Total Members',color:'var(--accent)'},{key:'today',val:stats.today,label:'On Leave Today',color:'var(--red)'},{key:'week',val:stats.week,label:'This Week',color:'var(--amber)'},{key:'upcoming',val:stats.upcoming,label:'Upcoming Leaves',color:'var(--green)'}].map(s=>(<div key={s.key} className={'stat-card '+(view===s.key?'active':'')} onClick={()=>setView(s.key)}><div className="value" style={{color:s.color}}>{s.val}</div><div className="label">{s.label}</div></div>))}
      </div>

      <div className="card" style={{padding:12,marginBottom:14}}>
        <div className="filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)'}}>
            {['upcoming','today','week','all'].map(v=>(<button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:view===v?'var(--accent)':'transparent',color:view===v?'#fff':'var(--text2)',cursor:'pointer'}}>{v==='all'?'All':v[0].toUpperCase()+v.slice(1)}</button>))}
          </div>
          {view==='week'&&<div style={{display:'flex',alignItems:'center',gap:4}}>
            <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,-1))} style={{width:26,height:26}}><Icon name="chevL" size={14}/></button>
            <span style={{fontSize:12,color:'var(--text2)',minWidth:110,textAlign:'center',fontFamily:"'JetBrains Mono',monospace"}}>{fmtDate(getWeekRange(weekDate)[0])+' – '+fmtDate(getWeekRange(weekDate)[1])}</span>
            <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,1))} style={{width:26,height:26}}><Icon name="chevR" size={14}/></button>
            <button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(new Date())}>This week</button>
          </div>}
          <select className="input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px'}}>{['All','PTO','Sick','Mixed','Business Travel'].map(t=><option key={t}>{t}</option>)}</select>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowUserPicker(true)}><Icon name="users" size={13}/> {selectedUsers.length>0?selectedUsers.length+' selected':'Members'}</button>
          <div style={{position:'relative',flex:'1 1 140px',minWidth:130}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',display:'flex'}}><Icon name="search" size={14}/></span>
            <input className="input" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:32,fontSize:12}}/>
          </div>
          <button className="btn btn-sm btn-danger" onClick={clearFilters} style={{fontSize:11}}>Clear</button>
          {/* ── Bulk Export button ── */}
          <button
            className="btn btn-sm"
            onClick={()=>setShowBulkExport(true)}
            title={hasFilters?'Export filtered results ('+filtered.length+' rows)':'Export all ('+filtered.length+' rows)'}
            style={{background:'var(--green-bg)',color:'var(--green)',border:'1px solid rgba(43,138,62,.25)',whiteSpace:'nowrap'}}
          >
            <Icon name="download" size={13}/>
            {hasFilters?'Export filtered ('+filtered.length+')':'Export all ('+filtered.length+')'}
          </button>
        </div>
      </div>

      <div className="card responsive-table" style={{overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table><thead><tr>
            <th>Name</th><th>Type</th><th>Leave Dates</th><th>Days</th>
            <th className="desktop-only">Project</th><th className="desktop-only">Backup</th><th className="desktop-only">Agenda</th>
            <th style={{width:88}}>Actions</th>
          </tr></thead><tbody>
            {filtered.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:40,color:'var(--text3)'}}>No matching records</td></tr>:filtered.map((m,i)=>{
              const oi=data.indexOf(m);const dc=m.dates.length;
              const hd=m.halfDays||{};
              const totalDays=countLeaveDays(m.dates,hd);
              const isMe=user&&m.name.toLowerCase()===user.name.toLowerCase();
              const projects=parseProjectEntries(m.backup||'');
              const rowSpan=Math.max(projects.length,1);
              return(<React.Fragment key={m.name+i}>
                <tr className="fade-in">
                  <td rowSpan={rowSpan} style={{fontWeight:600,whiteSpace:'nowrap',fontSize:13.5,verticalAlign:'top'}}>{m.name}{isMe&&<span style={{fontSize:10,color:'var(--accent)',marginLeft:4}}>(you)</span>}</td>
                  <td rowSpan={rowSpan} style={{verticalAlign:'top'}}><span className={'badge '+(tbc[m.type]||'badge-none')}>{m.type}</span></td>
                  <td rowSpan={rowSpan} style={{maxWidth:260,verticalAlign:'top'}}><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{dc===0?<span style={{color:'var(--text3)',fontSize:12}}>No upcoming</span>:m.dates.slice(0,10).map(d=>{
                    const half=hd[d];
                    return(<span key={d} className={'chip '+(isToday(d)?'chip-today pulse':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10.5,gap:3}}>
                      {fmtDate(d)}
                      {half&&half!=='full'&&<span style={{fontSize:9,background:'rgba(255,255,255,.25)',borderRadius:3,padding:'0 3px',fontFamily:'sans-serif'}}>{half==='first'?'AM':'PM'}</span>}
                    </span>);
                  })}{dc>10&&<span className="chip chip-gray" style={{fontSize:10}}>+{dc-10}</span>}</div></td>
                  <td rowSpan={rowSpan} style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,fontSize:14,textAlign:'center',verticalAlign:'top'}}>
                    <span style={totalDays>5?{color:'var(--amber)',background:'var(--amber-bg)',padding:'2px 8px',borderRadius:6}:{}}>{totalDays}</span>
                    {Object.values(hd).some(v=>v&&v!=='full')&&<div style={{fontSize:9.5,color:'var(--text3)',marginTop:2}}>½ day(s)</div>}
                  </td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{projects[0]?projects[0].project&&projects[0].project!=='__NO_CALLS__'?projects[0].project:'':''}</td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{projects[0]?projects[0].persons.join(', ')||'':''}</td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text3)'}}>{projects[0]?projects[0].isNoCalls?<span style={{color:'var(--cyan)',fontSize:11}}>📵 No customer calls</span>:projects[0].agenda||'':''}</td>
                  <td rowSpan={rowSpan} style={{verticalAlign:'top'}}>
                    <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                      {/* Per-row export (always visible) */}
                      <button className="btn-icon" onClick={()=>setShowExport(m)} title="Export this record" style={{width:28,height:28,color:'var(--indigo)'}}><Icon name="share" size={13}/></button>
                      {isMe&&<>
                        <button className="btn-icon" onClick={()=>{setEditingIdx(oi);setShowAddLeave(true)}} title="Edit" style={{width:28,height:28}}><Icon name="edit" size={13}/></button>
                        <button className="btn-icon" onClick={()=>handleDeleteMember(oi)} title="Delete" style={{width:28,height:28,color:'var(--red)'}}><Icon name="trash" size={13}/></button>
                      </>}
                    </div>
                  </td>
                </tr>
                {projects.slice(1).map((p,pi)=>(
                  <tr key={m.name+'-proj-'+pi} className="fade-in">
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{p.project&&p.project!=='__NO_CALLS__'?p.project:''}</td>
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{p.persons.join(', ')||''}</td>
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text3)'}}>{p.isNoCalls?<span style={{color:'var(--cyan)',fontSize:11}}>📵 No customer calls</span>:p.agenda||''}</td>
                  </tr>
                ))}
              </React.Fragment>);
            })}
          </tbody></table>
        </div>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text3)'}}>
          <span>Showing {filtered.length} of {data.length}{hasFilters&&<span style={{color:'var(--accent)',marginLeft:6}}>· Filtered</span>}</span>
          <span style={{fontFamily:"'JetBrains Mono',monospace"}}>Last sync: {lastSync}</span>
        </div>
      </div>
    </main>

    {showAddLeave&&<AddLeaveModal onClose={()=>{setShowAddLeave(false);setEditingIdx(null)}} onSave={handleSaveLeave} existingNames={allNames} editData={editingIdx!==null?data[editingIdx]:null} userName={user.name} allUserData={data}/>}
    {showUserPicker&&<UserPickerModal names={allNames} selected={selectedUsers} onClose={()=>setShowUserPicker(false)} onApply={sel=>{setSelectedUsers(sel);setShowUserPicker(false)}}/>}
    {showOoo&&oooData&&<OooActionsModal name={oooData.name} dates={oooData.dates} onClose={()=>{setShowOoo(false);setOooData(null)}}/>}
    {showExport&&<ExportModal member={showExport} onClose={()=>setShowExport(null)}/>}
    {showBulkExport&&<BulkExportModal members={filtered} filterDesc={filterDesc} onClose={()=>setShowBulkExport(false)}/>}
    {showProjectsAgenda&&<ProjectsAgendaModal members={data} userName={user.name} allNames={allNames} onClose={()=>setShowProjectsAgenda(false)}/>}
    {showImport&&<ImportLeaveModal userName={user.name} onClose={()=>setShowImport(false)} onImport={handleSaveLeave}/>}
    {showDeleteConfirm!==null&&data[showDeleteConfirm]&&<div className="overlay" onClick={()=>setShowDeleteConfirm(null)}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
      <h3 style={{fontSize:17,fontWeight:600,marginBottom:12,color:'var(--red)'}}>Delete Leave Record</h3>
      <p style={{fontSize:13.5,marginBottom:8}}>Remove <strong>{data[showDeleteConfirm].name}</strong>?</p>
      {data[showDeleteConfirm].dates.length>0&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:6}}>{data[showDeleteConfirm].dates.length} leave date{data[showDeleteConfirm].dates.length>1?'s':''} will be removed:</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{data[showDeleteConfirm].dates.slice(0,8).map(d=>(<span key={d} className="chip chip-future" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)}</span>))}{data[showDeleteConfirm].dates.length>8&&<span className="chip chip-gray" style={{fontSize:10}}>+{data[showDeleteConfirm].dates.length-8} more</span>}</div>
      </div>}
      <p style={{fontSize:12,color:'var(--text3)',marginBottom:14}}>Saved to database — visible to all users.</p>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button className="btn btn-secondary" onClick={()=>setShowDeleteConfirm(null)}>Cancel</button>
        <button className="btn btn-danger" onClick={confirmDelete} style={{background:'var(--red)',color:'#fff',border:'none'}}>Delete</button>
      </div>
    </div></div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
