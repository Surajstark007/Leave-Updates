@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

const today = () => {const d=new Date();return d.toISOString().split('T')[0]};
const parseDate = (s) => {if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmt = (ds) => {const d=parseDate(ds);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'?'};
const isToday = (ds) => ds===today();
const isFuture = (ds) => ds>=today();
const isPast = (ds) => ds<today();

function getWeekRange(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return[mon.toISOString().split('T')[0],sun.toISOString().split('T')[0]]}
function getWeekLabel(d){const[s,e]=getWeekRange(d);return`${fmt(s)} – ${fmt(e)}`}
function inWeek(ds,weekDate){const[ws,we]=getWeekRange(weekDate);return ds>=ws&&ds<=we}
function shiftWeek(d,n){const nd=new Date(d);nd.setDate(nd.getDate()+7*n);return nd}

function expandDateRange(str){
  str=str.trim();
  const toMatch=str.match(/^(\d{4}-\d{2}-\d{2})\s*to\s*(\d{4}-\d{2}-\d{2})$/i);
  if(toMatch){
    const dates=[];const s=new Date(toMatch[1]);const e=new Date(toMatch[2]);
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))dates.push(d.toISOString().split('T')[0]);
    return dates;
  }
  return[str];
}

function parseDatesString(raw){
  if(!raw||!raw.trim())return[];
  const year=new Date().getFullYear();
  const monthMap={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  let normalized=raw;
  // Handle "Jan 5-9" → "2026-01-05 to 2026-01-09"
  normalized=normalized.replace(/([A-Za-z]+)\s+(\d{1,2})-(\d{1,2})/g,(m,mon,d1,d2)=>{
    const mm=monthMap[mon.toLowerCase().substring(0,3)];
    if(!mm)return m;
    return`${year}-${mm}-${d1.padStart(2,'0')} to ${year}-${mm}-${d2.padStart(2,'0')}`;
  });
  // Handle "Thanksgiving week Nov 23-27" type
  normalized=normalized.replace(/[A-Za-z]+\s+week\s+/gi,'');
  const parts=normalized.split(',').map(s=>s.trim()).filter(Boolean);
  const dates=[];
  parts.forEach(p=>{
    expandDateRange(p).forEach(d=>{if(d.match(/^\d{4}-\d{2}-\d{2}$/))dates.push(d)});
  });
  return dates;
}

function processRawData(raw){
  return raw.map(r=>{
    const allDates=parseDatesString(r.dates);
    const futureDates=allDates.filter(d=>isFuture(d)).sort();
    return{name:r.name,dates:futureDates,allDatesRaw:r.dates,backup:r.backup||'',type:r.type||'None'};
  });
}

// ─── SUPABASE HELPERS ───────────────────────
async function sbFetch(path,opts={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    ...opts,
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})},
  });
  if(!res.ok)throw new Error(await res.text());
  const text=await res.text();
  return text?JSON.parse(text):null;
}
async function logAction(email,name,action){
  return sbFetch('lt_user_logs',{method:'POST',body:JSON.stringify({email,name,action,last_activity:new Date().toISOString()})});
}
async function findUser(email){
  const data=await sbFetch(`lt_user_logs?email=eq.${encodeURIComponent(email)}&action=eq.register&order=created_at.desc&limit=1`);
  return data&&data.length>0?data[0]:null;
}

    logout:<svg width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>,
  };
  return <span className={className} style={{display:'inline-flex',alignItems:'center'}}>{icons[name]||null}</span>;
};

// ─── TOAST ──────────────────────────────────
function ToastContainer({toasts,remove}){
  return <div className="toast-container">{toasts.map(t=>
    <div key={t.id} className={`toast toast-${t.type}`} onClick={()=>remove(t.id)}>
      {t.type==='success'?'✓':t.type==='error'?'✗':'ℹ'} {t.msg}
    </div>
  )}</div>;
}

// ─── LOGIN SCREEN ───────────────────────────
function LoginScreen({onLogin}){
  const[email,setEmail]=useState('');
  const[name,setName]=useState('');
  const[step,setStep]=useState('email');// email|name|loading
  const[err,setErr]=useState('');

  const handleEmailSubmit=async()=>{
    if(!email||!email.includes('@')){setErr('Enter a valid email');return}
    setStep('loading');setErr('');
    try{
      const user=await findUser(email);
      if(user){
        await logAction(email,user.name,'login');
        onLogin({email,name:user.name});
      }else{setStep('name')}
    }catch(e){setErr('Network error. Try again.');setStep('email')}
  };
  const handleNameSubmit=async()=>{
    if(!name.trim()){setErr('Enter your name');return}
    setStep('loading');setErr('');
    try{
      await logAction(email,name.trim(),'register');
      await logAction(email,name.trim(),'login');
      onLogin({email,name:name.trim()});
    }catch(e){setErr('Failed to register.');setStep('name')}
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'radial-gradient(ellipse at 30% 20%, rgba(56,189,248,.08) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(99,102,241,.06) 0%, transparent 50%), var(--bg)'}}>
      <div className="glass fade-in" style={{padding:40,width:'100%',maxWidth:420,textAlign:'center'}}>
        <div style={{fontSize:32,fontWeight:700,marginBottom:4,background:'linear-gradient(135deg,var(--accent),var(--accent2))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>CX Leave Tracker</div>
        <p style={{color:'var(--text2)',fontSize:14,marginBottom:28}}>Track team availability & backups</p>
        {step==='email'&&<div>
          <input className="input" placeholder="Enter your work email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmailSubmit()} autoFocus style={{marginBottom:12,textAlign:'center'}}/>
          <button className="btn btn-primary" style={{width:'100%'}} onClick={handleEmailSubmit}>Continue</button>
        </div>}
        {step==='name'&&<div className="fade-in">
          <p style={{color:'var(--text2)',fontSize:13,marginBottom:12}}>Welcome! Enter your full name to get started.</p>
          <input className="input" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleNameSubmit()} autoFocus style={{marginBottom:12,textAlign:'center'}}/>
          <button className="btn btn-primary" style={{width:'100%'}} onClick={handleNameSubmit}>Register & Continue</button>
        </div>}
        {step==='loading'&&<div style={{padding:20}}><div className="spin" style={{width:32,height:32,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',margin:'0 auto'}}/></div>}
        {err&&<p style={{color:'var(--red)',fontSize:13,marginTop:10}}>{err}</p>}
      </div>
    </div>
  );
}

// ─── MAIN APP ───────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[data,setData]=useState(()=>processRawData(FALLBACK_RAW));
  const[view,setView]=useState('upcoming');// upcoming|today|week|all
  const[weekDate,setWeekDate]=useState(new Date());
  const[typeFilter,setTypeFilter]=useState('All');
  const[projectFilter,setProjectFilter]=useState('All');
  const[search,setSearch]=useState('');
  const[selectedUsers,setSelectedUsers]=useState([]);
  const[savedViews,setSavedViews]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_saved_views')||'[]')}catch{return[]}});
  const[showAddLeave,setShowAddLeave]=useState(false);
  const[showUserPicker,setShowUserPicker]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[toasts,setToasts]=useState([]);
  const[editingIdx,setEditingIdx]=useState(null);
  const[showSaveView,setShowSaveView]=useState(false);
  const[saveViewName,setSaveViewName]=useState('');

  const toast=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500)};

  // Extract all unique projects from backup data
  const allProjects=useMemo(()=>{
    const ps=new Set();
    data.forEach(m=>{
      if(!m.backup)return;
      // Parse "ProjectName - Person; ProjectName2 - Person2"
      m.backup.split(/[;]/).forEach(seg=>{
        const dash=seg.indexOf('-');
        if(dash>0)ps.add(seg.substring(0,dash).trim());
        else{
          const colon=seg.indexOf(':');
          if(colon>0)ps.add(seg.substring(0,colon).trim());
        }
      });
    });
    return['All',...[...ps].sort()];
  },[data]);

  const allNames=useMemo(()=>data.map(m=>m.name).sort(),[data]);

  // Filtered data
  const filtered=useMemo(()=>{
    let result=data;
    // View filter
    if(view==='today')result=result.filter(m=>m.dates.some(isToday));
    else if(view==='upcoming')result=result.filter(m=>m.dates.length>0);
    else if(view==='week')result=result.filter(m=>m.dates.some(d=>inWeek(d,weekDate)));
    // type
    if(typeFilter!=='All')result=result.filter(m=>m.type===typeFilter);
    // project
    if(projectFilter!=='All')result=result.filter(m=>m.backup.toLowerCase().includes(projectFilter.toLowerCase()));
    // selected users
    if(selectedUsers.length>0)result=result.filter(m=>selectedUsers.includes(m.name));
    // search
    if(search.trim()){const q=search.toLowerCase();result=result.filter(m=>m.name.toLowerCase().includes(q)||m.backup.toLowerCase().includes(q)||m.dates.some(d=>d.includes(q)))}
    return result;
  },[data,view,weekDate,typeFilter,projectFilter,selectedUsers,search]);

  // Stats
  const stats=useMemo(()=>{
    const todayLeave=data.filter(m=>m.dates.some(isToday)).length;
    const thisWeek=data.filter(m=>m.dates.some(d=>inWeek(d,new Date()))).length;
    const upcoming=data.filter(m=>m.dates.length>0).length;
    return{total:data.length,today:todayLeave,week:thisWeek,upcoming};
  },[data]);

  const handleSync=async()=>{
    setSyncing(true);
    try{
      const res=await syncFromSlack();
      toast('Synced with Slack canvas','success');
      // If we got usable data, try to parse it
      // For now, just show success - canvas parsing depends on format returned
      console.log('Slack sync response:',res);
      // Try channel fallback too
      const ch=await readChannel();
      console.log('Channel messages:',ch);
      toast('Data fetched - check console for raw response','info');
    }catch(e){
      toast('Sync failed - using cached data','error');
      console.error(e);
    }
    setSyncing(false);
  };

  const clearFilters=()=>{setView('upcoming');setTypeFilter('All');setProjectFilter('All');setSearch('');setSelectedUsers([])};

  const applySavedView=(v)=>{
    setView(v.view||'upcoming');setTypeFilter(v.typeFilter||'All');
    setProjectFilter(v.projectFilter||'All');setSelectedUsers(v.selectedUsers||[]);setSearch(v.search||'');
  };
  const saveCurView=()=>{
    if(!saveViewName.trim())return;
    const nv={name:saveViewName.trim(),view,typeFilter,projectFilter,selectedUsers,search};
    const updated=[...savedViews,nv];
    setSavedViews(updated);localStorage.setItem('cx_saved_views',JSON.stringify(updated));
    setSaveViewName('');setShowSaveView(false);toast('View saved','success');
  };
  const deleteSavedView=(i)=>{const updated=savedViews.filter((_,j)=>j!==i);setSavedViews(updated);localStorage.setItem('cx_saved_views',JSON.stringify(updated))};

  const handleDeleteMember=(idx)=>{if(confirm('Remove this member from the tracker?')){setData(d=>d.filter((_,i)=>i!==idx));toast('Member removed','success')}};
  const handleEditMember=(idx)=>{setEditingIdx(idx);setShowAddLeave(true)};

  const handleSaveLeave=(entry)=>{
    if(editingIdx!==null){
      setData(d=>d.map((m,i)=>i===editingIdx?{...m,...entry,dates:entry.dates.filter(isFuture).sort()}:m));
      setEditingIdx(null);
      toast('Updated successfully','success');
    }else{
      // Check if member exists
      const existIdx=data.findIndex(m=>m.name.toLowerCase()===entry.name.toLowerCase());
      if(existIdx>=0){
        setData(d=>d.map((m,i)=>{
          if(i!==existIdx)return m;
          const merged=new Set([...m.dates,...entry.dates]);
          const mergedBackup=m.backup?(m.backup+'; '+entry.backup):entry.backup;
          return{...m,dates:[...merged].filter(isFuture).sort(),backup:mergedBackup,type:entry.type||m.type};
        }));
      }else{
        setData(d=>[...d,{name:entry.name,dates:entry.dates.filter(isFuture).sort(),backup:entry.backup,type:entry.type,allDatesRaw:''}]);
      }
      toast('Leave added','success');
    }
    setShowAddLeave(false);
  };

  if(!user)return<LoginScreen onLogin={setUser}/>;

  return(
    <div style={{minHeight:'100vh',background:'radial-gradient(ellipse at 20% 0%, rgba(56,189,248,.05) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(99,102,241,.04) 0%, transparent 50%), var(--bg)'}}>
      <ToastContainer toasts={toasts} remove={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>

      {/* HEADER */}
      <header className="glass-header" style={{position:'sticky',top:0,zIndex:50,padding:'14px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:20,fontWeight:700,background:'linear-gradient(135deg,var(--accent),var(--accent2))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>CX Leave Tracker</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={handleSync} disabled={syncing}>
            <Icon name="sync" size={14} className={syncing?'spin':''}/> {syncing?'Syncing...':'Sync from Slack'}
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>{setEditingIdx(null);setShowAddLeave(true)}}>
            <Icon name="plus" size={14}/> Add Leave
          </button>
          <div style={{display:'flex',alignItems:'center',gap:8,marginLeft:8,paddingLeft:8,borderLeft:'1px solid var(--border)'}}>
            <span style={{fontSize:12,color:'var(--text2)'}}>{user.name}</span>
            <button className="btn-icon" title="Logout" onClick={()=>setUser(null)} style={{width:28,height:28}}><Icon name="logout" size={14}/></button>
          </div>
        </div>
      </header>

      <main style={{maxWidth:1320,margin:'0 auto',padding:'20px 20px 40px'}}>
        {/* STATS */}
        <div className="stat-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
          <div className="glass stat-card" onClick={()=>setView('all')} style={view==='all'?{borderColor:'var(--accent)'}:{}}>
            <div className="value" style={{color:'var(--accent)'}}>{stats.total}</div>
            <div className="label">Total Members</div>
          </div>
          <div className="glass stat-card" onClick={()=>setView('today')} style={view==='today'?{borderColor:'var(--red)'}:{}}>
            <div className="value" style={{color:stats.today>0?'var(--red)':'var(--text2)'}}>{stats.today}</div>
            <div className="label">On Leave Today</div>
          </div>
          <div className="glass stat-card" onClick={()=>setView('week')} style={view==='week'?{borderColor:'var(--amber)'}:{}}>
            <div className="value" style={{color:'var(--amber)'}}>{stats.week}</div>
            <div className="label">This Week</div>
          </div>
          <div className="glass stat-card" onClick={()=>setView('upcoming')} style={view==='upcoming'?{borderColor:'var(--green)'}:{}}>
            <div className="value" style={{color:'var(--green)'}}>{stats.upcoming}</div>
            <div className="label">Upcoming Leaves</div>
          </div>
        </div>

        {/* FILTERS */}
        <div className="glass" style={{padding:14,marginBottom:16}}>
          <div className="filter-row" style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            {/* View toggles */}
            <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:'var(--radius-xs)',padding:2}}>
              {['upcoming','today','week','all'].map(v=>(
                <button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:'var(--radius-xs)',fontSize:12,fontWeight:500,border:'none',background:view===v?'var(--accent)':'transparent',color:view===v?'#0f172a':'var(--text2)',transition:'all .15s',cursor:'pointer'}}>
                  {v==='all'?'All Members':v.charAt(0).toUpperCase()+v.slice(1)}
                </button>
              ))}
            </div>

            {/* Week picker */}
            {view==='week'&&<div style={{display:'flex',alignItems:'center',gap:4}}>
              <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,-1))} style={{width:26,height:26}}><Icon name="chevLeft" size={14}/></button>
              <span style={{fontSize:12,color:'var(--text2)',minWidth:120,textAlign:'center',fontFamily:'var(--mono)'}}>{getWeekLabel(weekDate)}</span>
              <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,1))} style={{width:26,height:26}}><Icon name="chevRight" size={14}/></button>
              <button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(new Date())}>This week</button>
              <button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(shiftWeek(new Date(),1))}>Next week</button>
            </div>}

            {/* Type filter */}
            <select className="input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px'}}>
              {['All','PTO','Sick','Mixed','Business Travel','Other','None'].map(t=><option key={t}>{t}</option>)}
            </select>

            {/* Project filter */}
            <select className="input" value={projectFilter} onChange={e=>setProjectFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px',maxWidth:180}}>
              {allProjects.map(p=><option key={p}>{p}</option>)}
            </select>

            {/* Multi user picker */}
            <button className="btn btn-sm btn-secondary" onClick={()=>setShowUserPicker(true)}>
              <Icon name="users" size={13}/> {selectedUsers.length>0?`${selectedUsers.length} selected`:'Select Members'}
            </button>

            {/* Search */}
            <div style={{position:'relative',flex:'1 1 160px',minWidth:140}}>
              <Icon name="search" size={14} className="" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}/>
              <input className="input" placeholder="Search name, dates, backup..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:32,fontSize:12}}/>
            </div>

            {/* Save & Clear */}
            <button className="btn btn-sm btn-secondary" onClick={()=>setShowSaveView(true)} title="Save current view"><Icon name="save" size={13}/></button>
            <button className="btn btn-sm btn-danger" onClick={clearFilters} style={{fontSize:11}}>Clear All</button>
          </div>

          {/* Saved views chips */}
          {savedViews.length>0&&<div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
            {savedViews.map((sv,i)=>(
              <span key={i} className="view-chip" onClick={()=>applySavedView(sv)}>
                {sv.name} <span className="x" onClick={e=>{e.stopPropagation();deleteSavedView(i)}}>×</span>
              </span>
            ))}
          </div>}
        </div>

        {/* TABLE */}
        <div className="glass responsive-table" style={{overflow:'hidden'}}>
          <div style={{overflowX:'auto'}}>
            <table>
              <thead>
                <tr>
                  <th>Name</th><th>Type</th><th>Leave Dates</th><th className="desktop-only">Named Backup</th><th>Days</th><th style={{width:80}}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length===0?<tr><td colSpan={6} style={{textAlign:'center',padding:40,color:'var(--text3)'}}>No matching records</td></tr>:
                filtered.map((m,i)=>{
                  const origIdx=data.indexOf(m);
                  const typeColors={PTO:'indigo',Sick:'red',Mixed:'amber','Business Travel':'cyan',Other:'pink',None:'gray'};
                  const tc=typeColors[m.type]||'gray';
                  const dayCount=m.dates.length;
                  return(
                    <tr key={m.name+i} className="fade-in">
                      <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{m.name}</td>
                      <td>{m.type&&m.type!=='None'?<span className={`badge chip-${tc}`}>{m.type}</span>:<span style={{color:'var(--text3)',fontSize:12}}>—</span>}</td>
                      <td style={{maxWidth:320}}>
                        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                          {m.dates.length===0?<span style={{color:'var(--text3)',fontSize:12}}>No upcoming dates</span>:
                          m.dates.slice(0,12).map(d=>(
                            <span key={d} className={`chip ${isToday(d)?'chip-red pulse':'chip-indigo'}`} style={{fontFamily:'var(--mono)',fontSize:11}}>
                              {fmt(d)}
                            </span>
                          ))}
                          {m.dates.length>12&&<span className="chip chip-gray" style={{fontSize:10}}>+{m.dates.length-12} more</span>}
                        </div>
                      </td>
                      <td className="desktop-only" style={{maxWidth:280,whiteSpace:'pre-wrap',fontSize:12.5,color:'var(--text2)',lineHeight:1.6}}>
                        {m.backup||<span style={{color:'var(--text3)'}}>—</span>}
                      </td>
                      <td style={{fontFamily:'var(--mono)',fontWeight:600,fontSize:14,textAlign:'center'}}>
                        <span style={dayCount>5?{color:'var(--amber)',background:'rgba(245,158,11,.12)',padding:'2px 8px',borderRadius:6}:{}}>{dayCount}</span>
                      </td>
                      <td>
                        <div style={{display:'flex',gap:4}}>
                          <button className="btn-icon" onClick={()=>handleEditMember(origIdx)} title="Edit"><Icon name="edit" size={14}/></button>
                          <button className="btn-icon" onClick={()=>handleDeleteMember(origIdx)} title="Delete" style={{color:'var(--red)'}}><Icon name="trash" size={14}/></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text3)'}}>
            <span>Showing {filtered.length} of {data.length} members</span>
            <span style={{fontFamily:'var(--mono)'}}>Last synced: {new Date().toLocaleString()}</span>
          </div>
        </div>
      </main>

      {/* ADD/EDIT LEAVE MODAL */}
      {showAddLeave&&<AddLeaveModal
        onClose={()=>{setShowAddLeave(false);setEditingIdx(null)}}
        onSave={handleSaveLeave}
        existingNames={allNames}
        editData={editingIdx!==null?data[editingIdx]:null}
      />}

      {/* USER PICKER MODAL */}
      {showUserPicker&&<UserPickerModal
        names={allNames}
        selected={selectedUsers}
        onClose={()=>setShowUserPicker(false)}
        onApply={sel=>{setSelectedUsers(sel);setShowUserPicker(false)}}
      />}

      {/* SAVE VIEW MODAL */}
      {showSaveView&&<div className="overlay" onClick={()=>setShowSaveView(false)}>
        <div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
          <h3 style={{fontSize:16,fontWeight:600,marginBottom:14}}>Save Current View</h3>
          <input className="input" placeholder="View name" value={saveViewName} onChange={e=>setSaveViewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveCurView()} autoFocus/>
          <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary btn-sm" onClick={()=>setShowSaveView(false)}>Cancel</button>
            <button className="btn btn-primary btn-sm" onClick={saveCurView}>Save</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

// ─── ADD LEAVE MODAL ────────────────────────
function AddLeaveModal({onClose,onSave,existingNames,editData}){
  const[name,setName]=useState(editData?editData.name:'');
  const[isNew,setIsNew]=useState(false);
  const[type,setType]=useState(editData?editData.type:'PTO');
  const[dates,setDates]=useState(editData?[...editData.dates]:[]);
  const[dateInput,setDateInput]=useState('');
  const[backupEntries,setBackupEntries]=useState(()=>{
    if(editData&&editData.backup){
      const entries=editData.backup.split(/[;]/).map(s=>s.trim()).filter(Boolean).map(seg=>{
        // Try "Project - Person | Agenda: text" or "Project - Person"
        const parts=seg.split('|').map(s=>s.trim());
        const main=parts[0]||'';
        const agenda=(parts[1]||'').replace(/^Agenda:\s*/i,'');
        const dash=main.indexOf('-');
        if(dash>0)return{project:main.substring(0,dash).trim(),person:main.substring(dash+1).trim(),callDate:'',agenda};
        const colon=main.indexOf(':');
        if(colon>0)return{project:main.substring(0,colon).trim(),person:main.substring(colon+1).trim(),callDate:'',agenda};
        return{project:'',person:main,callDate:'',agenda};
      });
      return entries.length?entries:[{project:'',person:'',callDate:'',agenda:''}];
    }
    return[{project:'',person:'',callDate:'',agenda:''}];
  });

  const addDate=()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}};
  const removeDate=d=>setDates(ds=>ds.filter(x=>x!==d));
  const addBackupEntry=()=>setBackupEntries(e=>[...e,{project:'',person:'',callDate:'',agenda:''}]);
  const removeBackupEntry=i=>setBackupEntries(e=>e.filter((_,j)=>j!==i));
  const updateBackup=(i,field,val)=>setBackupEntries(e=>e.map((x,j)=>j===i?{...x,[field]:val}:x));

  const handleSave=()=>{
    if(!name.trim())return;
    const backupStr=backupEntries.filter(e=>e.project||e.person).map(e=>{
      let s=e.project?(e.project+(e.callDate?` (${e.callDate})`:'')+' - '+e.person):e.person;
      if(e.agenda)s+=' | Agenda: '+e.agenda;
      return s;
    }).join('; ');
    onSave({name:name.trim(),type,dates,backup:backupStr});
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:600}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h3 style={{fontSize:18,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3>
          <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>

        {/* Name */}
        <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Team Member</label>
        {isNew?
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            <input className="input" placeholder="Enter full name" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
            <button className="btn btn-sm btn-secondary" onClick={()=>setIsNew(false)}>Cancel</button>
          </div>
          :
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            <select className="input" value={name} onChange={e=>setName(e.target.value)} disabled={!!editData}>
              <option value="">Select member...</option>
              {existingNames.map(n=><option key={n}>{n}</option>)}
            </select>
            {!editData&&<button className="btn btn-sm btn-secondary" onClick={()=>{setIsNew(true);setName('')}} title="Add new member"><Icon name="plus" size={14}/> New</button>}
          </div>
        }

        {/* Type */}
        <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Leave Type</label>
        <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
          {['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(
            <button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'rgba(56,189,248,.15)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>
              {t}
            </button>
          ))}
        </div>

        {/* Dates */}
        <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Leave Dates</label>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)} style={{flex:1}}/>
          <button className="btn btn-sm btn-primary" onClick={addDate}>Add</button>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:16,minHeight:28}}>
          {dates.map(d=>(
            <span key={d} className="chip chip-indigo" style={{fontFamily:'var(--mono)',fontSize:11}}>
              {fmt(d)} <span style={{cursor:'pointer',marginLeft:2,opacity:.7}} onClick={()=>removeDate(d)}>×</span>
            </span>
          ))}
        </div>

        {/* Backup & Agenda */}
        <div style={{borderTop:'1px solid var(--border)',paddingTop:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h4 style={{fontSize:14,fontWeight:600}}>Backup & Agenda Details</h4>
            <button className="btn btn-sm btn-secondary" onClick={addBackupEntry}><Icon name="plus" size={12}/> Add Project</button>
          </div>
          {backupEntries.map((entry,i)=>(
            <div key={i} className="fade-in" style={{background:'var(--surface2)',borderRadius:'var(--radius-sm)',padding:12,marginBottom:8,border:'1px solid var(--border)'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <div>
                  <label style={{fontSize:11,color:'var(--text3)'}}>Backup Person</label>
                  <input className="input" placeholder="Name" value={entry.person} onChange={e=>updateBackup(i,'person',e.target.value)} style={{fontSize:13}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:'var(--text3)'}}>Project Name</label>
                  <input className="input" placeholder="Project" value={entry.project} onChange={e=>updateBackup(i,'project',e.target.value)} style={{fontSize:13}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:'var(--text3)'}}>Call Date</label>
                  <input type="date" className="input" value={entry.callDate} onChange={e=>updateBackup(i,'callDate',e.target.value)} style={{fontSize:13}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:'var(--text3)'}}>Agenda</label>
                  <input className="input" placeholder="Meeting agenda" value={entry.agenda} onChange={e=>updateBackup(i,'agenda',e.target.value)} style={{fontSize:13}}/>
                </div>
              </div>
              {backupEntries.length>1&&<button className="btn btn-sm btn-danger" onClick={()=>removeBackupEntry(i)} style={{fontSize:11}}>Remove</button>}
            </div>
          ))}
        </div>

        <div style={{display:'flex',gap:8,marginTop:20,justifyContent:'flex-end'}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>{editData?'Update':'Save'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── USER PICKER MODAL ──────────────────────
function UserPickerModal({names,selected,onClose,onApply}){
  const[sel,setSel]=useState(new Set(selected));
  const[q,setQ]=useState('');
  const toggle=n=>{const ns=new Set(sel);if(ns.has(n))ns.delete(n);else ns.add(n);setSel(ns)};
  const filteredNames=q?names.filter(n=>n.toLowerCase().includes(q.toLowerCase())):names;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:400}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <h3 style={{fontSize:16,fontWeight:600}}>Select Members</h3>
          <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>
        <input className="input" placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:12}}/>
        <div style={{maxHeight:300,overflowY:'auto',display:'flex',flexDirection:'column',gap:2}}>
          {filteredNames.map(n=>(
            <label key={n} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:'var(--radius-xs)',cursor:'pointer',background:sel.has(n)?'rgba(56,189,248,.08)':'transparent',transition:'background .15s'}}>
              <input type="checkbox" checked={sel.has(n)} onChange={()=>toggle(n)} style={{accentColor:'var(--accent)'}}/>
              <span style={{fontSize:13}}>{n}</span>
            </label>
          ))}
        </div>
        <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'space-between'}}>
          <button className="btn btn-sm btn-secondary" onClick={()=>setSel(new Set())}>Clear All</button>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-secondary btn-sm" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary btn-sm" onClick={()=>onApply([...sel])}>Apply ({sel.size})</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
