const SU={'U076358T0Q5':'Dinesh MS','U037YB1SD6Y':'Sundeep','U072FRECZ41':'Balaje','U0A3GTQANUT':'Kari','U04S03L5EC9':'Suraj Pillai','U08JL5H9GSG':'Nancy','U8JPFF83Y':'Ramya','U08MX6QKNUQ':'Vigneswaran','U01QUJKDDRP':'Preetha','U07CZN255CP':'Rakul','U06AK5LTU4B':'Sateesh Babu','U02CFDXAHV2':'Devi','U0A8VJU90NQ':'Unknown','U065H6E5940':'Unknown','U05338G3Q7M':'Samuel J','U07662DHBS6':'Unknown','U03Q0AH8PGW':'Manjusha','U04RERW24F8':'Vignesh P','U08CELR2E05':'Radhika','U07CKR6FG92':'Madhu','U03E0G6UCH0':'Sai Kishan T','U04M46PN9RC':'Johnkamesh','U07CWKK62TA':'Jahanwi Shree','U06BZA0EWQM':'Jacob','U07235UJSSW':'Ajit','U071WGRMX62':'Unknown','U07V18B4SQP':'Unknown','U02HN9RC3DM':'Archanaa','U03BWDXKPU5':'Karunambika','U079W3Q6ZB9':'Thanveer','U099LL9097X':'Shanthosh','U06S2QPP0S1':'Unknown','U02JTAK36TX':'Unknown','U02A8N46ZV5':'Unknown','U04M7S27J13':'Unknown','U04078U5RE3':'Deepak','URZHXB6QL':'Unknown','U4RQ6868Y':'Vijay','U08KNEUM7HD':'Unknown','U08KNEWE6G7':'Unknown','U06PU003J1Y':'Unknown','U03CE9S8685':'Abiramy','U0768GE2SH2':'Unknown'};

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDate=s=>{if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmtDate=ds=>{const d=parseDate(ds);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'?'};
const isToday=ds=>ds===todayStr();
const isFuture=ds=>ds>=todayStr();
function getWeekRange(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return[f(mon),f(sun)]}
function inWeek(ds,wd){const[ws,we]=getWeekRange(wd);return ds>=ws&&ds<=we}
function shiftWeek(d,n){const nd=new Date(d);nd.setDate(nd.getDate()+7*n);return nd}
function expandDateRange(s,e){const dates=[];const sd=new Date(s);const ed=new Date(e);for(let d=new Date(sd);d<=ed;d.setDate(d.getDate()+1))dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return dates}

function parseDatesFromCell(raw){
  if(!raw||!raw.trim())return[];const dates=new Set();const year=new Date().getFullYear();
  [...raw.matchAll(/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g)].forEach(m=>dates.add(m[1]));
  let rm;
  const rp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s*[-\u2013]\s*!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=rp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const tp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s+to\s+!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=tp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const mm={january:'01',jan:'01',february:'02',feb:'02',march:'03',mar:'03',april:'04',apr:'04',may:'05',june:'06',jun:'06',july:'07',jul:'07',august:'08',aug:'08',september:'09',sep:'09',october:'10',oct:'10',november:'11',nov:'11',december:'12',dec:'12'};
  let cl=raw.replace(/!\[\]\(slack_date:\d{4}-\d{2}-\d{2}\)/g,'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\*\*/g,'');
  const mrp=/(\w+)\s+(\d{1,2})\s*(?:st|nd|rd|th)?\s*[-\u2013]\s*(?:(\w+)\s+)?(\d{1,2})(?:st|nd|rd|th)?/gi;
  while((rm=mrp.exec(cl))!==null){const m1=mm[rm[1].toLowerCase()];const m2=rm[3]?mm[rm[3].toLowerCase()]:m1;if(m1&&m2)expandDateRange(year+'-'+m1+'-'+String(rm[2]).padStart(2,'0'),year+'-'+m2+'-'+String(rm[4]).padStart(2,'0')).forEach(d=>dates.add(d))}
  const mdp=/\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sep|october|oct|november|nov|december|dec)\s+(\d{1,2})(?:st|nd|rd|th)?\b/gi;
  while((rm=mdp.exec(cl))!==null){const mn=mm[rm[1].toLowerCase()];if(mn)dates.add(year+'-'+mn+'-'+String(rm[2]).padStart(2,'0'))}
  const dmp=/(\d{1,2})(?:st|nd|rd|th)\s+(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sep|october|oct|november|nov|december|dec)/gi;
  while((rm=dmp.exec(cl))!==null){const mn=mm[rm[2].toLowerCase()];if(mn)dates.add(year+'-'+mn+'-'+String(rm[1]).padStart(2,'0'))}
  const ur=/(\d{2})\/(\d{2})\/(\d{4})\s*to\s*(\d{2})\/(\d{2})\/(\d{4})/g;
  while((rm=ur.exec(cl))!==null)expandDateRange(rm[3]+'-'+rm[1]+'-'+rm[2],rm[6]+'-'+rm[4]+'-'+rm[5]).forEach(d=>dates.add(d));
  const wp=/(\w+)\s*-\s*(\d{1,2})\s*-\s*(\d{4})/gi;
  while((rm=wp.exec(cl))!==null){const mn=mm[rm[1].toLowerCase()];if(mn)dates.add(rm[3]+'-'+mn+'-'+String(rm[2]).padStart(2,'0'))}
  return[...dates].filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/)).sort();
}
function cleanBackup(raw){if(!raw)return'';return raw.replace(/<@(\w+)>/g,(_,u)=>SU[u]||u).replace(/<br\s*\/?>/gi,'\n').replace(/!\[\]\(@\w+\)/g,'').replace(/\*\*/g,'').replace(/\\/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim()}
function detectLeaveType(dc){if(!dc)return'PTO';const t=dc.toLowerCase();if(t.includes('sick')&&t.includes('planned'))return'Mixed';if(t.includes('sick'))return'Sick';if(t.includes('business travel'))return'Business Travel';return'PTO'}

function parseCanvasMarkdown(md){
  const lines=md.split('\n');const members=[];let hp=false;
  for(const line of lines){const tr=line.trim();if(!tr.startsWith('|'))continue;
    const cells=tr.split('|').map(c=>c.trim());if(cells[0]==='')cells.shift();if(cells[cells.length-1]==='')cells.pop();if(cells.length<2)continue;
    if(cells[0]==='Name'||cells[0].match(/^[\s-]+$/)){hp=true;continue}
    if(cells.every(c=>c.match(/^[\s-]*$/))){hp=true;continue}
    if(!hp&&cells[0].includes('---')){hp=true;continue}
    const name=cells[0].replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!name)continue;
    const dateCell=cells[1]||'';const backupCell=cells[2]||'';
    const fd=parseDatesFromCell(dateCell).filter(isFuture).sort();
    const type=detectLeaveType(dateCell);const backup=cleanBackup(backupCell);
    const ex=members.find(m=>m.name.toLowerCase()===name.toLowerCase());
    if(ex){const mg=new Set([...ex.dates,...fd]);ex.dates=[...mg].sort();if(backup&&!ex.backup.includes(backup))ex.backup=ex.backup?ex.backup+'\n'+backup:backup;continue}
    members.push({name,dates:fd,backup,type,raw:dateCell});
  }
  return members;
}

// ─── SYNC: Edge Function reads from Supabase cache ───
// To update the cache with live Slack data, tell Claude "sync the canvas" in chat.
// Claude reads the live canvas via Slack MCP and writes to Supabase.
// Then this Sync button pulls the latest from Supabase instantly.
async function liveSync(onProgress){
  onProgress('Fetching latest data...');
  const r=await fetch(SB_URL+'/functions/v1/slack-proxy',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'read_canvas',canvas_id:CANVAS_ID})
  });
  if(!r.ok)throw new Error('Sync request failed: '+r.status);
  const data=await r.json();
  if(!data.ok)throw new Error(data.error||'Unknown error');
  onProgress('Parsing data...');
  return{markdown:data.markdown,updated_at:data.updated_at};
}

// Fallback: read from Supabase cache
async function readCache(){
  const r=await fetch(SB_URL+'/rest/v1/lt_canvas_cache?canvas_id=eq.'+CANVAS_ID+'&order=updated_at.desc&limit=1',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  if(!r.ok)return null;
  const data=await r.json();
  return data&&data[0]?{markdown:data[0].markdown_content,updated_at:data[0].updated_at}:null;
}

// ─── USER-ADDED LEAVES (persisted in Supabase lt_leaves) ───
async function fetchUserLeaves(){
  const r=await fetch(SB_URL+'/rest/v1/lt_leaves?deleted=eq.false&order=created_at.desc',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  if(!r.ok)return[];
  return r.json();
}
async function upsertLeave(entry,addedBy){
  // Check if entry already exists by name (case-insensitive)
  const existing=await fetch(SB_URL+'/rest/v1/lt_leaves?name=ilike.'+encodeURIComponent(entry.name)+'&deleted=eq.false&limit=1',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  const existingData=await existing.json();
  if(existingData&&existingData.length>0){
    // Update existing
    return fetch(SB_URL+'/rest/v1/lt_leaves?id=eq.'+existingData[0].id,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify({type:entry.type,dates:JSON.stringify(entry.dates),backup:entry.backup,updated_at:new Date().toISOString(),added_by:addedBy})
    });
  }
  // Insert new
  return fetch(SB_URL+'/rest/v1/lt_leaves',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({name:entry.name,type:entry.type,dates:JSON.stringify(entry.dates),backup:entry.backup,added_by:addedBy})
  });
}
async function softDeleteLeave(name){
  // Mark as deleted by name
  return fetch(SB_URL+'/rest/v1/lt_leaves?name=ilike.'+encodeURIComponent(name)+'&deleted=eq.false',{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({deleted:true,updated_at:new Date().toISOString()})
  });
}

// Merge canvas data with user-added leaves (user entries override canvas for same name)
function mergeCanvasAndUserLeaves(canvasMembers,userLeaves){
  const merged=[...canvasMembers];
  const deletedNames=new Set();
  for(const ul of userLeaves){
    if(ul.deleted){deletedNames.add(ul.name.toLowerCase());continue}
    let dates=[];
    try{dates=typeof ul.dates==='string'?JSON.parse(ul.dates):ul.dates||[]}catch{dates=[]}
    const idx=merged.findIndex(m=>m.name.toLowerCase()===ul.name.toLowerCase());
    if(idx>=0){
      // Merge dates and backup
      const existingDates=new Set(merged[idx].dates);
      dates.forEach(d=>existingDates.add(d));
      merged[idx]={...merged[idx],dates:[...existingDates].filter(d=>d>=todayStr()).sort(),backup:ul.backup||merged[idx].backup,type:ul.type||merged[idx].type};
    }else{
      merged.push({name:ul.name,dates:dates.filter(d=>d>=todayStr()).sort(),backup:ul.backup||'',type:ul.type||'PTO',raw:''});
    }
  }
  return merged.filter(m=>!deletedNames.has(m.name.toLowerCase()));
}

// Supabase user auth
async function sbFetch(path,opts={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function logAction(email,name,action){return sbFetch('lt_user_logs',{method:'POST',body:JSON.stringify({email,name,action,last_activity:new Date().toISOString()})})}
async function findUser(email){const d=await sbFetch('lt_user_logs?email=eq.'+encodeURIComponent(email)+'&action=eq.register&order=created_at.desc&limit=1');return d&&d.length>0?d[0]:null}

const Icon=({name,size=16})=>{const p={width:size,height:size,fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',viewBox:'0 0 24 24'};const icons={search:<svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,sync:<svg {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>,plus:<svg {...p}><path d="M12 5v14M5 12h14"/></svg>,x:<svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>,edit:<svg {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>,trash:<svg {...p}><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,chevL:<svg {...p}><path d="m15 18-6-6 6-6"/></svg>,chevR:<svg {...p}><path d="m9 18 6-6-6-6"/></svg>,users:<svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,save:<svg {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,logout:<svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>,refresh:<svg {...p}><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.36 2.64"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.36-2.64"/><path d="M3 21v-5h5"/></svg>};return<span style={{display:'inline-flex',alignItems:'center'}}>{icons[name]||null}</span>};
function ToastContainer({toasts,remove}){return<div className="toast-container">{toasts.map(t=><div key={t.id} className={'toast toast-'+t.type} onClick={()=>remove(t.id)}>{t.type==='success'?'\u2713':t.type==='error'?'\u2717':'\u2139'} {t.msg}</div>)}</div>}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState('');const[name,setName]=useState('');const[step,setStep]=useState('email');const[err,setErr]=useState('');
  const he=async()=>{if(!email||!email.includes('@')){setErr('Enter a valid email');return}setStep('loading');setErr('');try{const u=await findUser(email);if(u){await logAction(email,u.name,'login');const s={email,name:u.name};localStorage.setItem('cx_lt_session',JSON.stringify(s));onLogin(s)}else setStep('name')}catch{setErr('Network error');setStep('email')}};
  const hn=async()=>{if(!name.trim()){setErr('Enter your name');return}setStep('loading');setErr('');try{await logAction(email,name.trim(),'register');const s={email,name:name.trim()};localStorage.setItem('cx_lt_session',JSON.stringify(s));onLogin(s)}catch{setErr('Failed');setStep('name')}};
  return(<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'var(--bg)'}}><div className="card fade-in" style={{padding:40,width:'100%',maxWidth:400,textAlign:'center'}}><div style={{width:56,height:56,borderRadius:16,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:24,color:'#fff',fontWeight:700}}>CX</div><div style={{fontSize:24,fontWeight:700,marginBottom:4}}>Leave Tracker</div><p style={{color:'var(--text2)',fontSize:13.5,marginBottom:28}}>Track team availability & backups</p>
  {step==='email'&&<div><input className="input" placeholder="Enter your work email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&he()} autoFocus style={{marginBottom:12,textAlign:'center'}}/><button className="btn btn-primary" style={{width:'100%'}} onClick={he}>Continue</button></div>}
  {step==='name'&&<div className="fade-in"><p style={{color:'var(--text2)',fontSize:13,marginBottom:12}}>Welcome! Set your name to get started.</p><input className="input" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&hn()} autoFocus style={{marginBottom:12,textAlign:'center'}}/><button className="btn btn-primary" style={{width:'100%'}} onClick={hn}>Register</button></div>}
  {step==='loading'&&<div style={{padding:20}}><div className="spin" style={{width:32,height:32,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',margin:'0 auto'}}/></div>}
  {err&&<p style={{color:'var(--red)',fontSize:13,marginTop:10}}>{err}</p>}</div></div>);

function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem('cx_lt_theme')||'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('cx_lt_theme',theme)},[theme]);
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_lt_session'))}catch{return null}});
  const[data,setData]=useState([]);
  const[lastSync,setLastSync]=useState('Loading...');
  const[view,setView]=useState('upcoming');const[weekDate,setWeekDate]=useState(new Date());
  const[typeFilter,setTypeFilter]=useState('All');const[search,setSearch]=useState('');
  const[selectedUsers,setSelectedUsers]=useState([]);
  const[showAddLeave,setShowAddLeave]=useState(false);const[showUserPicker,setShowUserPicker]=useState(false);
  const[syncing,setSyncing]=useState(false);const[syncStatus,setSyncStatus]=useState('');
  const[toasts,setToasts]=useState([]);const[editingIdx,setEditingIdx]=useState(null);
  const toast=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)};

  // Load merged data: canvas cache + user-added leaves
  const loadAllData=async()=>{
    let canvasMembers=[];
    try{const c=await readCache();if(c){canvasMembers=parseCanvasMarkdown(c.markdown);setLastSync(new Date(c.updated_at).toLocaleString())}}catch{}
    try{const ul=await fetchUserLeaves();const merged=mergeCanvasAndUserLeaves(canvasMembers,ul);setData(merged)}catch{setData(canvasMembers)}
  };
  useEffect(()=>{loadAllData()},[]);

  const[refreshing,setRefreshing]=useState(false);
  const handleRefresh=async()=>{
    setRefreshing(true);
    try{await loadAllData();toast('Refreshed with latest data','success')}
    catch(e){toast('Refresh failed: '+e.message,'error')}
    setRefreshing(false);
  };

  const allNames=useMemo(()=>data.map(m=>m.name).sort(),[data]);
  const filtered=useMemo(()=>{let r=data;if(view==='today')r=r.filter(m=>m.dates.some(isToday));else if(view==='upcoming')r=r.filter(m=>m.dates.length>0);else if(view==='week')r=r.filter(m=>m.dates.some(d=>inWeek(d,weekDate)));if(typeFilter!=='All')r=r.filter(m=>m.type===typeFilter);if(selectedUsers.length>0)r=r.filter(m=>selectedUsers.includes(m.name));if(search.trim()){const q=search.toLowerCase();r=r.filter(m=>m.name.toLowerCase().includes(q)||m.backup.toLowerCase().includes(q)||m.dates.some(d=>d.includes(q)))}return r},[data,view,weekDate,typeFilter,selectedUsers,search]);
  const stats=useMemo(()=>({total:data.length,today:data.filter(m=>m.dates.some(isToday)).length,week:data.filter(m=>m.dates.some(d=>inWeek(d,new Date()))).length,upcoming:data.filter(m=>m.dates.length>0).length}),[data]);

  const handleSync=async()=>{
    setSyncing(true);setSyncStatus('Starting...');
    try{
      const result=await liveSync(msg=>setSyncStatus(msg));
      const canvasMembers=parseCanvasMarkdown(result.markdown);
      if(canvasMembers.length>0){
        const ul=await fetchUserLeaves();
        const merged=mergeCanvasAndUserLeaves(canvasMembers,ul);
        setData(merged);setLastSync(new Date().toLocaleString());
        toast('Synced '+merged.length+' members (canvas + app data)','success');
      }else toast('Parsed 0 rows from canvas','error');
    }catch(e){
      console.error('Live sync failed:',e);
      toast('Sync failed: '+e.message+'. Refreshing...','error');
      await loadAllData();
    }
    setSyncing(false);setSyncStatus('');
  };

  const clearFilters=()=>{setView('upcoming');setTypeFilter('All');setSearch('');setSelectedUsers([])};
  const handleDeleteMember=async(idx)=>{
    if(!confirm('Remove this member?'))return;
    const member=data[idx];
    setData(d=>d.filter((_,i)=>i!==idx));
    try{await softDeleteLeave(member.name);toast('Removed & saved','success')}
    catch{toast('Removed locally (save failed)','error')}
  };
  const handleSaveLeave=async(entry)=>{
    if(editingIdx!==null){
      setData(d=>d.map((m,i)=>i===editingIdx?{...m,...entry,dates:entry.dates.filter(isFuture).sort()}:m));
      setEditingIdx(null);
      try{await upsertLeave({...entry,dates:entry.dates.filter(isFuture).sort()},user?.email||'');toast('Updated & saved','success')}
      catch{toast('Updated locally (save failed)','error')}
    }else{
      const ei=data.findIndex(m=>m.name.toLowerCase()===entry.name.toLowerCase());
      if(ei>=0){
        setData(d=>d.map((m,i)=>{if(i!==ei)return m;const mg=new Set([...m.dates,...entry.dates]);return{...m,dates:[...mg].filter(isFuture).sort(),backup:entry.backup||m.backup,type:entry.type||m.type}}));
      }else{
        setData(d=>[...d,{name:entry.name,dates:entry.dates.filter(isFuture).sort(),backup:entry.backup,type:entry.type,raw:''}]);
      }
      try{await upsertLeave({...entry,dates:entry.dates.filter(isFuture).sort()},user?.email||'');toast('Leave added & saved','success')}
      catch{toast('Added locally (save failed)','error')}
    }
    setShowAddLeave(false);
  };

  if(!user)return<LoginScreen onLogin={setUser}/>;
  const tbc={PTO:'badge-pto',Sick:'badge-sick',Mixed:'badge-mixed','Business Travel':'badge-bt',Other:'badge-other'};
  return(<div style={{minHeight:'100vh',background:'var(--bg)'}}>
    <ToastContainer toasts={toasts} remove={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>
    <header style={{position:'sticky',top:0,zIndex:50,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',background:'var(--header-bg)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--header-border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:32,height:32,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#fff',fontWeight:700}}>CX</div><span style={{fontSize:17,fontWeight:700}}>Leave Tracker</span></div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end'}}>
          <div style={{display:'flex',gap:6}}>
            <button className="btn btn-secondary btn-sm" onClick={handleRefresh} disabled={refreshing} title="Pull latest data from all users"><span className={refreshing?'spin':''} style={{display:'inline-flex'}}><Icon name="refresh" size={14}/></span> {refreshing?'Refreshing...':'Refresh'}</button>
            <button className="btn btn-secondary btn-sm" onClick={handleSync} disabled={syncing} title="Sync from Slack canvas cache"><span className={syncing?'spin':''} style={{display:'inline-flex'}}><Icon name="sync" size={14}/></span> {syncing?'Syncing...':'Sync Slack'}</button>
          </div>
          {syncStatus&&<div className="sync-progress">{syncStatus}</div>}
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditingIdx(null);setShowAddLeave(true)}}><Icon name="plus" size={14}/> Add</button>
        <button className="theme-toggle" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}/>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4,paddingLeft:8,borderLeft:'1px solid var(--border)'}}><span style={{fontSize:12,color:'var(--text2)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name}</span><button className="btn-icon" title="Logout" onClick={()=>{localStorage.removeItem('cx_lt_session');setUser(null)}} style={{width:28,height:28}}><Icon name="logout" size={14}/></button></div>
      </div>
    </header>
    <main style={{maxWidth:1320,margin:'0 auto',padding:'18px 18px 40px'}}>
      <div className="stat-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[{key:'all',val:stats.total,label:'Total Members',color:'var(--accent)'},{key:'today',val:stats.today,label:'On Leave Today',color:'var(--red)'},{key:'week',val:stats.week,label:'This Week',color:'var(--amber)'},{key:'upcoming',val:stats.upcoming,label:'Upcoming Leaves',color:'var(--green)'}].map(s=>(<div key={s.key} className={'stat-card '+(view===s.key?'active':'')} onClick={()=>setView(s.key)}><div className="value" style={{color:s.color}}>{s.val}</div><div className="label">{s.label}</div></div>))}
      </div>
      <div className="card" style={{padding:12,marginBottom:14}}>
        <div className="filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)'}}>
            {['upcoming','today','week','all'].map(v=>(<button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:view===v?'var(--accent)':'transparent',color:view===v?'#fff':'var(--text2)',cursor:'pointer'}}>{v==='all'?'All':v[0].toUpperCase()+v.slice(1)}</button>))}
          </div>
          {view==='week'&&<div style={{display:'flex',alignItems:'center',gap:4}}><button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,-1))} style={{width:26,height:26}}><Icon name="chevL" size={14}/></button><span style={{fontSize:12,color:'var(--text2)',minWidth:110,textAlign:'center',fontFamily:"'JetBrains Mono',monospace"}}>{fmtDate(getWeekRange(weekDate)[0])+' \u2013 '+fmtDate(getWeekRange(weekDate)[1])}</span><button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,1))} style={{width:26,height:26}}><Icon name="chevR" size={14}/></button><button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(new Date())}>This week</button></div>}
          <select className="input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px'}}>{['All','PTO','Sick','Mixed','Business Travel'].map(t=><option key={t}>{t}</option>)}</select>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowUserPicker(true)}><Icon name="users" size={13}/> {selectedUsers.length>0?selectedUsers.length+' selected':'Members'}</button>
          <div style={{position:'relative',flex:'1 1 140px',minWidth:130}}><span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',display:'flex'}}><Icon name="search" size={14}/></span><input className="input" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:32,fontSize:12}}/></div>
          <button className="btn btn-sm btn-danger" onClick={clearFilters} style={{fontSize:11}}>Clear</button>
        </div>
      </div>
      <div className="card responsive-table" style={{overflow:'hidden'}}><div style={{overflowX:'auto'}}><table><thead><tr><th>Name</th><th>Type</th><th>Leave Dates</th><th className="desktop-only">Named Backup</th><th>Days</th><th style={{width:72}}>Actions</th></tr></thead><tbody>
        {filtered.length===0?<tr><td colSpan={6} style={{textAlign:'center',padding:40,color:'var(--text3)'}}>No matching records</td></tr>:filtered.map((m,i)=>{const oi=data.indexOf(m);const dc=m.dates.length;return(<tr key={m.name+i} className="fade-in"><td style={{fontWeight:600,whiteSpace:'nowrap',fontSize:13.5}}>{m.name}</td><td><span className={'badge '+(tbc[m.type]||'badge-none')}>{m.type}</span></td><td style={{maxWidth:300}}><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{dc===0?<span style={{color:'var(--text3)',fontSize:12}}>No upcoming</span>:m.dates.slice(0,10).map(d=>(<span key={d} className={'chip '+(isToday(d)?'chip-today pulse':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)}</span>))}{dc>10&&<span className="chip chip-gray" style={{fontSize:10}}>+{dc-10}</span>}</div></td><td className="desktop-only" style={{maxWidth:260,whiteSpace:'pre-wrap',fontSize:12,color:'var(--text2)',lineHeight:1.55}}>{m.backup||<span style={{color:'var(--text3)'}}>{'\u2014'}</span>}</td><td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,fontSize:14,textAlign:'center'}}><span style={dc>5?{color:'var(--amber)',background:'var(--amber-bg)',padding:'2px 8px',borderRadius:6}:{}}>{dc}</span></td><td><div style={{display:'flex',gap:4}}><button className="btn-icon" onClick={()=>{setEditingIdx(oi);setShowAddLeave(true)}} title="Edit" style={{width:28,height:28}}><Icon name="edit" size={13}/></button><button className="btn-icon" onClick={()=>handleDeleteMember(oi)} title="Delete" style={{width:28,height:28,color:'var(--red)'}}><Icon name="trash" size={13}/></button></div></td></tr>)})}
      </tbody></table></div><div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text3)'}}><span>Showing {filtered.length} of {data.length}</span><span style={{fontFamily:"'JetBrains Mono',monospace"}}>Last sync: {lastSync}</span></div></div>
    </main>
    {showAddLeave&&<AddLeaveModal onClose={()=>{setShowAddLeave(false);setEditingIdx(null)}} onSave={handleSaveLeave} existingNames={allNames} editData={editingIdx!==null?data[editingIdx]:null}/>}
    {showUserPicker&&<UserPickerModal names={allNames} selected={selectedUsers} onClose={()=>setShowUserPicker(false)} onApply={sel=>{setSelectedUsers(sel);setShowUserPicker(false)}}/>}
  </div>);
}

function AddLeaveModal({onClose,onSave,existingNames,editData}){
  const[name,setName]=useState(editData?editData.name:'');
  const[isNew,setIsNew]=useState(false);
  const[type,setType]=useState(editData?editData.type:'PTO');
  const[dates,setDates]=useState(editData?[...editData.dates]:[]);
  const[dateInput,setDateInput]=useState('');

  // Parse existing backup into structured entries
  const parseBackupEntries=(backupStr)=>{
    if(!backupStr)return[{project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}];
    const lines=backupStr.split('\n').filter(l=>l.trim());
    if(lines.length===0)return[{project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}];
    return lines.map(line=>{
      let project='',personStr='',agenda='';
      // Check for agenda after |
      const pipeParts=line.split('|').map(s=>s.trim());
      const mainPart=pipeParts[0]||'';
      agenda=(pipeParts[1]||'').replace(/^Agenda:\s*/i,'');
      // Split by - for project and person
      const dashIdx=mainPart.indexOf(' - ');
      if(dashIdx>-1){project=mainPart.substring(0,dashIdx).trim();personStr=mainPart.substring(dashIdx+3).trim()}
      else{const colonIdx=mainPart.indexOf(':');if(colonIdx>-1){project=mainPart.substring(0,colonIdx).trim();personStr=mainPart.substring(colonIdx+1).trim()}else personStr=mainPart}
      const persons=personStr?personStr.split(/[,&]/).map(p=>p.trim()).filter(Boolean):[];
      return{project,persons,newPerson:'',agenda,showPicker:false,pickerQ:''};
    });
  };
  const[entries,setEntries]=useState(()=>parseBackupEntries(editData?editData.backup:''));

  const updateEntry=(idx,field,val)=>setEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val}:x));
  const addEntry=()=>setEntries(e=>[...e,{project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  const removeEntry=idx=>setEntries(e=>e.filter((_,i)=>i!==idx));
  const addPersonToEntry=(idx,person)=>{
    setEntries(e=>e.map((x,i)=>{
      if(i!==idx)return x;
      if(x.persons.includes(person))return x;
      return{...x,persons:[...x.persons,person],showPicker:false,pickerQ:''};
    }));
  };
  const removePersonFromEntry=(idx,person)=>{
    setEntries(e=>e.map((x,i)=>i===idx?{...x,persons:x.persons.filter(p=>p!==person)}:x));
  };
  const addNewPersonToEntry=(idx)=>{
    setEntries(e=>e.map((x,i)=>{
      if(i!==idx||!x.newPerson.trim())return x;
      const np=x.newPerson.trim();
      if(x.persons.includes(np))return{...x,newPerson:''};
      return{...x,persons:[...x.persons,np],newPerson:''};
    }));
  };

  const buildBackupString=()=>{
    return entries.filter(e=>e.project||e.persons.length>0).map(e=>{
      let s='';
      if(e.project){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
      else if(e.persons.length>0)s+=e.persons.join(', ');
      if(e.agenda)s+=' | Agenda: '+e.agenda;
      return s;
    }).join('\n');
  };

  const lbl={fontSize:12,color:'var(--text2)',marginBottom:4,display:'block',fontWeight:500};
  const subLbl={fontSize:11,color:'var(--text3)',marginBottom:3,display:'block'};

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:580}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
      <h3 style={{fontSize:17,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3>
      <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
    </div>

    <label style={lbl}>Team Member</label>
    {isNew?<div style={{display:'flex',gap:8,marginBottom:14}}><input className="input" placeholder="Full name" value={name} onChange={e=>setName(e.target.value)} autoFocus/><button className="btn btn-sm btn-secondary" onClick={()=>setIsNew(false)}>Cancel</button></div>:
    <div style={{display:'flex',gap:8,marginBottom:14}}><select className="input" value={name} onChange={e=>setName(e.target.value)} disabled={!!editData}><option value="">Select member...</option>{existingNames.map(n=><option key={n}>{n}</option>)}</select>{!editData&&<button className="btn btn-sm btn-secondary" onClick={()=>{setIsNew(true);setName('')}}><Icon name="plus" size={14}/> New</button>}</div>}

    <label style={lbl}>Leave Type</label>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>{['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(<button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'var(--accent-light)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>{t}</button>))}</div>

    <label style={lbl}>Leave Dates</label>
    <div style={{display:'flex',gap:8,marginBottom:8}}><input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)} style={{flex:1}}/><button className="btn btn-sm btn-primary" onClick={()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}>Add</button></div>
    <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:14,minHeight:24}}>{dates.map(d=>(<span key={d} className="chip chip-future" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)} <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>setDates(ds=>ds.filter(x=>x!==d))}>{'\u00d7'}</span></span>))}</div>

    <div style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <label style={{...lbl,marginBottom:0}}>Backup & Agenda Details</label>
        <button className="btn btn-sm btn-secondary" onClick={addEntry}><Icon name="plus" size={12}/> Add Project</button>
      </div>

      {entries.map((entry,idx)=>(<div key={idx} className="fade-in" style={{background:'var(--surface2)',borderRadius:10,padding:12,marginBottom:8,border:'1px solid var(--border)'}}>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1}}>
            <label style={subLbl}>Project Name</label>
            <input className="input" placeholder="e.g. Shield Roofing" value={entry.project} onChange={e=>updateEntry(idx,'project',e.target.value)} style={{fontSize:13}}/>
          </div>
          {entries.length>1&&<button className="btn-icon" onClick={()=>removeEntry(idx)} title="Remove" style={{width:28,height:28,color:'var(--red)',marginTop:18,flexShrink:0}}><Icon name="trash" size={13}/></button>}
        </div>

        <label style={subLbl}>Backup Person(s)</label>
        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6,minHeight:26}}>
          {entry.persons.map(p=>(<span key={p} className="chip chip-future" style={{fontSize:11}}>{p} <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>removePersonFromEntry(idx,p)}>{'\u00d7'}</span></span>))}
          <button className="btn btn-sm btn-secondary" onClick={()=>updateEntry(idx,'showPicker',!entry.showPicker)} style={{fontSize:11,padding:'2px 8px',borderRadius:999}}>
            <Icon name="plus" size={11}/> {entry.showPicker?'Close':'Add'}
          </button>
        </div>

        {entry.showPicker&&<div className="fade-in" style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:8,marginBottom:8}}>
          <input className="input" placeholder="Search team members..." value={entry.pickerQ} onChange={e=>updateEntry(idx,'pickerQ',e.target.value)} style={{fontSize:12,marginBottom:6,padding:'5px 10px'}}/>
          <div style={{maxHeight:120,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
            {existingNames.filter(n=>!entry.persons.includes(n)&&(!entry.pickerQ||n.toLowerCase().includes(entry.pickerQ.toLowerCase()))).map(n=>(
              <div key={n} onClick={()=>addPersonToEntry(idx,n)} style={{padding:'4px 8px',borderRadius:4,fontSize:12,cursor:'pointer',background:'transparent',transition:'background .1s'}} onMouseOver={e=>e.currentTarget.style.background='var(--accent-light)'} onMouseOut={e=>e.currentTarget.style.background='transparent'}>{n}</div>
            ))}
          </div>
          <div style={{display:'flex',gap:6,marginTop:6,borderTop:'1px solid var(--border)',paddingTop:6}}>
            <input className="input" placeholder="Or type new name..." value={entry.newPerson} onChange={e=>updateEntry(idx,'newPerson',e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNewPersonToEntry(idx)} style={{fontSize:12,padding:'4px 8px',flex:1}}/>
            <button className="btn btn-sm btn-primary" onClick={()=>addNewPersonToEntry(idx)} style={{fontSize:11,padding:'3px 10px'}}>Add</button>
          </div>
        </div>}

        <label style={subLbl}>Agenda / Notes</label>
        <input className="input" placeholder="Meeting agenda, handoff notes..." value={entry.agenda} onChange={e=>updateEntry(idx,'agenda',e.target.value)} style={{fontSize:13}}/>
      </div>))}
    </div>

    <div style={{display:'flex',gap:8,marginTop:18,justifyContent:'flex-end'}}>
      <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" onClick={()=>{if(!name.trim())return;onSave({name:name.trim(),type,dates,backup:buildBackupString()})}}>{editData?'Update':'Save'}</button>
    </div>
  </div></div>);
}

function UserPickerModal({names,selected,onClose,onApply}){
  const[sel,setSel]=useState(new Set(selected));const[q,setQ]=useState('');
  const toggle=n=>{const ns=new Set(sel);if(ns.has(n))ns.delete(n);else ns.add(n);setSel(ns)};
  const fn=q?names.filter(n=>n.toLowerCase().includes(q.toLowerCase())):names;
  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h3 style={{fontSize:16,fontWeight:600}}>Select Members</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
    <input className="input" placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
    <div style={{maxHeight:280,overflowY:'auto',display:'flex',flexDirection:'column',gap:2}}>{fn.map(n=>(<label key={n} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:6,cursor:'pointer',background:sel.has(n)?'var(--accent-light)':'transparent'}}><input type="checkbox" checked={sel.has(n)} onChange={()=>toggle(n)} style={{accentColor:'var(--accent)'}}/><span style={{fontSize:13}}>{n}</span></label>))}</div>
    <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'space-between'}}><button className="btn btn-sm btn-secondary" onClick={()=>setSel(new Set())}>Clear</button><div style={{display:'flex',gap:8}}><button className="btn btn-secondary btn-sm" onClick={onClose}>Cancel</button><button className="btn btn-primary btn-sm" onClick={()=>onApply([...sel])}>Apply ({sel.size})</button></div></div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
