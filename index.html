const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDate=(s)=>{if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmtDate=(ds)=>{const d=parseDate(ds);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'?'};

function getWeekRange(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return[f(mon),f(sun)]}
function getWeekLabel(d){const[s,e]=getWeekRange(d);return fmtDate(s)+' \u2013 '+fmtDate(e)}
function inWeek(ds,wd){const[ws,we]=getWeekRange(wd);return ds>=ws&&ds<=we}
function shiftWeek(d,n){const nd=new Date(d);nd.setDate(nd.getDate()+7*n);return nd}
function expandDateRange(start,end){const dates=[];const s=new Date(start);const e=new Date(end);for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}return dates}

function parseDatesFromCell(raw){
  if(!raw||!raw.trim())return[];const dates=new Set();const year=new Date().getFullYear();
  [...raw.matchAll(/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g)].forEach(m=>dates.add(m[1]));
  let rm;const rp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s*[-\u2013]\s*!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=rp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const tp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s+to\s+!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=tp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const mm={january:'01',jan:'01',february:'02',feb:'02',march:'03',mar:'03',april:'04',apr:'04',may:'05',june:'06',jun:'06',july:'07',jul:'07',august:'08',aug:'08',september:'09',sep:'09',october:'10',oct:'10',november:'11',nov:'11',december:'12',dec:'12'};
  let cl=raw.replace(/!\[\]\(slack_date:\d{4}-\d{2}-\d{2}\)/g,'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\*\*/g,'');
  const mrp=/(\w+)\s+(\d{1,2})\s*(?:st|nd|rd|th)?\s*[-\u2013]\s*(?:(\w+)\s+)?(\d{1,2})(?:st|nd|rd|th)?/gi;
  let mr;while((mr=mrp.exec(cl))!==null){const m1=mm[mr[1].toLowerCase()];const m2=mr[3]?mm[mr[3].toLowerCase()]:m1;if(m1&&m2)expandDateRange(`${year}-${m1}-${String(mr[2]).padStart(2,'0')}`,`${year}-${m2}-${String(mr[4]).padStart(2,'0')}`).forEach(d=>dates.add(d))}
  const mdp=/\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sep|october|oct|november|nov|december|dec)\s+(\d{1,2})(?:st|nd|rd|th)?\b/gi;
  let md;while((md=mdp.exec(cl))!==null){const mn=mm[md[1].toLowerCase()];if(mn)dates.add(`${year}-${mn}-${String(md[2]).padStart(2,'0')}`)}
  const dmp=/(\d{1,2})(?:st|nd|rd|th)\s+(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sep|october|oct|november|nov|december|dec)/gi;
  let dm;while((dm=dmp.exec(cl))!==null){const mn=mm[dm[2].toLowerCase()];if(mn)dates.add(`${year}-${mn}-${String(dm[1]).padStart(2,'0')}`)}
  const ur=/(\d{2})\/(\d{2})\/(\d{4})\s*to\s*(\d{2})\/(\d{2})\/(\d{4})/g;
  while((rm=ur.exec(cl))!==null)expandDateRange(`${rm[3]}-${rm[1]}-${rm[2]}`,`${rm[6]}-${rm[4]}-${rm[5]}`).forEach(d=>dates.add(d));
  const wp=/(\w+)\s*-\s*(\d{1,2})\s*-\s*(\d{4})/gi;
  while((rm=wp.exec(cl))!==null){const mn=mm[rm[1].toLowerCase()];if(mn)dates.add(`${rm[3]}-${mn}-${String(rm[2]).padStart(2,'0')}`)}
  return[...dates].filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/)).sort();
}
function cleanBackup(raw){if(!raw)return'';let s=raw;s=s.replace(/<@(\w+)>/g,(_,uid)=>SLACK_USERS[uid]||uid);s=s.replace(/<br\s*\/?>/gi,'\n');s=s.replace(/!\[\]\(@\w+\)/g,'');s=s.replace(/\*\*/g,'');s=s.replace(/\\/g,'');s=s.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');return s.trim()}
function detectLeaveType(dc){if(!dc)return'PTO';const t=dc.toLowerCase();if(t.includes('sick')&&t.includes('planned'))return'Mixed';if(t.includes('sick'))return'Sick';if(t.includes('business travel'))return'Business Travel';return'PTO'}

function parseCanvasMarkdown(md){
  const lines=md.split('\n');const members=[];let headerPassed=false;
  for(const line of lines){const trimmed=line.trim();if(!trimmed.startsWith('|'))continue;
    const cells=trimmed.split('|').map(c=>c.trim());if(cells[0]==='')cells.shift();if(cells[cells.length-1]==='')cells.pop();if(cells.length<2)continue;
    if(cells[0]==='Name'||cells[0].match(/^[\s-]+$/)){headerPassed=true;continue}
    if(cells.every(c=>c.match(/^[\s-]*$/))){headerPassed=true;continue}
    if(!headerPassed&&cells[0].includes('---')){headerPassed=true;continue}
    const name=cells[0].replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!name)continue;
    const dateCell=cells[1]||'';const backupCell=cells[2]||'';
    const futureDates=parseDatesFromCell(dateCell).filter(isFuture).sort();
    const type=detectLeaveType(dateCell);const backup=cleanBackup(backupCell);
    const existing=members.find(m=>m.name.toLowerCase()===name.toLowerCase());
    if(existing){const merged=new Set([...existing.dates,...futureDates]);existing.dates=[...merged].sort();if(backup&&!existing.backup.includes(backup))existing.backup=existing.backup?existing.backup+'\n'+backup:backup;continue}
    members.push({name,dates:futureDates,backup,type,allDatesRaw:dateCell});
  }
  return members;
}

// ─── LIVE SYNC via Anthropic API + Slack MCP ───
async function syncCanvasViaAPI(){
  const response=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      messages:[{role:"user",content:"Read the Slack canvas with ID F09LAPUPJH1 and return ONLY the raw markdown_content field from the result. Do not summarize or interpret it. Return the complete raw markdown text."}],
      mcp_servers:[{type:"url",url:"https://mcp.slack.com/mcp",name:"slack-mcp"}]
    })
  });
  const data=await response.json();
  // Extract text and tool results
  let fullText='';
  if(data.content){
    for(const block of data.content){
      if(block.type==='text')fullText+=block.text+'\n';
      if(block.type==='mcp_tool_result'&&block.content){
        for(const sub of block.content){if(sub.text)fullText+=sub.text+'\n'}
      }
    }
  }
  return fullText;
}

const Icon=({name,size=16})=>{const p={width:size,height:size,fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',viewBox:'0 0 24 24'};const icons={search:<svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,sync:<svg {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>,plus:<svg {...p}><path d="M12 5v14M5 12h14"/></svg>,x:<svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>,edit:<svg {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>,trash:<svg {...p}><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,chevL:<svg {...p}><path d="m15 18-6-6 6-6"/></svg>,chevR:<svg {...p}><path d="m9 18 6-6-6-6"/></svg>,users:<svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,save:<svg {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,logout:<svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>};return<span style={{display:'inline-flex',alignItems:'center'}}>{icons[name]||null}</span>};
function ToastContainer({toasts,remove}){return<div className="toast-container">{toasts.map(t=><div key={t.id} className={'toast toast-'+t.type} onClick={()=>remove(t.id)}>{t.type==='success'?'\u2713':t.type==='error'?'\u2717':'\u2139'} {t.msg}</div>)}</div>}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState('');const[name,setName]=useState('');const[step,setStep]=useState('email');const[err,setErr]=useState('');
  const handleEmail=async()=>{if(!email||!email.includes('@')){setErr('Enter a valid email');return}setStep('loading');setErr('');try{const user=await findUser(email);if(user){await logAction(email,user.name,'login');const s={email,name:user.name};localStorage.setItem('cx_lt_session',JSON.stringify(s));onLogin(s)}else setStep('name')}catch(e){setErr('Network error');setStep('email')}};
  const handleName=async()=>{if(!name.trim()){setErr('Enter your name');return}setStep('loading');setErr('');try{await logAction(email,name.trim(),'register');const s={email,name:name.trim()};localStorage.setItem('cx_lt_session',JSON.stringify(s));onLogin(s)}catch(e){setErr('Failed');setStep('name')}};
  return(<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'var(--bg)'}}><div className="card fade-in" style={{padding:40,width:'100%',maxWidth:400,textAlign:'center'}}><div style={{width:56,height:56,borderRadius:16,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:24,color:'#fff',fontWeight:700}}>CX</div><div style={{fontSize:24,fontWeight:700,marginBottom:4}}>Leave Tracker</div><p style={{color:'var(--text2)',fontSize:13.5,marginBottom:28}}>Track team availability & backups</p>
  {step==='email'&&<div><input className="input" placeholder="Enter your work email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmail()} autoFocus style={{marginBottom:12,textAlign:'center'}}/><button className="btn btn-primary" style={{width:'100%'}} onClick={handleEmail}>Continue</button></div>}
  {step==='name'&&<div className="fade-in"><p style={{color:'var(--text2)',fontSize:13,marginBottom:12}}>Welcome! Set your name to get started.</p><input className="input" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleName()} autoFocus style={{marginBottom:12,textAlign:'center'}}/><button className="btn btn-primary" style={{width:'100%'}} onClick={handleName}>Register</button></div>}
  {step==='loading'&&<div style={{padding:20}}><div className="spin" style={{width:32,height:32,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',margin:'0 auto'}}/></div>}
  {err&&<p style={{color:'var(--red)',fontSize:13,marginTop:10}}>{err}</p>}</div></div>);
}

function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem('cx_lt_theme')||'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('cx_lt_theme',theme)},[theme]);
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_lt_session'))}catch{return null}});
  const[data,setData]=useState(()=>parseCanvasMarkdown(CANVAS_MD));
  const[lastSync,setLastSync]=useState('Snapshot');
  const[view,setView]=useState('upcoming');const[weekDate,setWeekDate]=useState(new Date());
  const[typeFilter,setTypeFilter]=useState('All');const[projectFilter,setProjectFilter]=useState('All');
  const[search,setSearch]=useState('');const[selectedUsers,setSelectedUsers]=useState([]);
  const[savedViews,setSavedViews]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_saved_views')||'[]')}catch{return[]}});
  const[showAddLeave,setShowAddLeave]=useState(false);const[showUserPicker,setShowUserPicker]=useState(false);
  const[syncing,setSyncing]=useState(false);const[toasts,setToasts]=useState([]);
  const[editingIdx,setEditingIdx]=useState(null);const[showSaveView,setShowSaveView]=useState(false);const[saveViewName,setSaveViewName]=useState('');
  const toast=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500)};
  const allProjects=useMemo(()=>{const ps=new Set();data.forEach(m=>{if(!m.backup)return;m.backup.split(/[\n;]/).forEach(seg=>{const dash=seg.indexOf('-');if(dash>0)ps.add(seg.substring(0,dash).trim())})});return['All',...[...ps].filter(p=>p.length>1&&p.length<50).sort()]},[data]);
  const allNames=useMemo(()=>data.map(m=>m.name).sort(),[data]);
  const filtered=useMemo(()=>{let r=data;if(view==='today')r=r.filter(m=>m.dates.some(isToday));else if(view==='upcoming')r=r.filter(m=>m.dates.length>0);else if(view==='week')r=r.filter(m=>m.dates.some(d=>inWeek(d,weekDate)));if(typeFilter!=='All')r=r.filter(m=>m.type===typeFilter);if(projectFilter!=='All')r=r.filter(m=>m.backup.toLowerCase().includes(projectFilter.toLowerCase()));if(selectedUsers.length>0)r=r.filter(m=>selectedUsers.includes(m.name));if(search.trim()){const q=search.toLowerCase();r=r.filter(m=>m.name.toLowerCase().includes(q)||m.backup.toLowerCase().includes(q)||m.dates.some(d=>d.includes(q)))}return r},[data,view,weekDate,typeFilter,projectFilter,selectedUsers,search]);
  const stats=useMemo(()=>({total:data.length,today:data.filter(m=>m.dates.some(isToday)).length,week:data.filter(m=>m.dates.some(d=>inWeek(d,new Date()))).length,upcoming:data.filter(m=>m.dates.length>0).length}),[data]);

  const handleSync=async()=>{
    setSyncing(true);
    try{
      toast('Fetching live canvas data from Slack...','info');
      const rawText=await syncCanvasViaAPI();
      console.log('API sync raw text length:',rawText.length);
      // Try to find the markdown table in the response
      let mdContent=rawText;
      // The API response might have the table embedded in explanatory text
      // Look for the table pattern
      const tableStart=rawText.indexOf('|Name|');
      if(tableStart===-1){
        // Try alternate: look for any pipe-delimited table
        const altStart=rawText.indexOf('|Abiramy');
        if(altStart>-1)mdContent=rawText.substring(altStart);
        else{
          // If no table found at all, the API may have just described it
          // Check if the raw text contains slack_date patterns
          if(rawText.includes('slack_date:')){mdContent=rawText}
          else{toast('Could not extract table from API response. Using snapshot.','error');setSyncing(false);return}
        }
      }else{mdContent=rawText.substring(tableStart)}
      const parsed=parseCanvasMarkdown(mdContent);
      if(parsed.length>0){setData(parsed);setLastSync(new Date().toLocaleTimeString());toast('Synced '+parsed.length+' members live from Slack!','success')}
      else{toast('Parsed 0 rows. Using snapshot.','error')}
    }catch(e){console.error('Sync error:',e);toast('Sync failed: '+e.message,'error')}
    setSyncing(false);
  };

  const clearFilters=()=>{setView('upcoming');setTypeFilter('All');setProjectFilter('All');setSearch('');setSelectedUsers([])};
  const applySavedView=v=>{setView(v.view||'upcoming');setTypeFilter(v.typeFilter||'All');setProjectFilter(v.projectFilter||'All');setSelectedUsers(v.selectedUsers||[]);setSearch(v.search||'')};
  const saveCurView=()=>{if(!saveViewName.trim())return;const nv={name:saveViewName.trim(),view,typeFilter,projectFilter,selectedUsers,search};const u=[...savedViews,nv];setSavedViews(u);localStorage.setItem('cx_saved_views',JSON.stringify(u));setSaveViewName('');setShowSaveView(false);toast('View saved','success')};
  const deleteSavedView=i=>{const u=savedViews.filter((_,j)=>j!==i);setSavedViews(u);localStorage.setItem('cx_saved_views',JSON.stringify(u))};
  const handleDeleteMember=idx=>{if(confirm('Remove this member?')){setData(d=>d.filter((_,i)=>i!==idx));toast('Removed','success')}};
  const handleEditMember=idx=>{setEditingIdx(idx);setShowAddLeave(true)};
  const handleSaveLeave=entry=>{if(editingIdx!==null){setData(d=>d.map((m,i)=>i===editingIdx?{...m,...entry,dates:entry.dates.filter(isFuture).sort()}:m));setEditingIdx(null);toast('Updated','success')}else{const ei=data.findIndex(m=>m.name.toLowerCase()===entry.name.toLowerCase());if(ei>=0){setData(d=>d.map((m,i)=>{if(i!==ei)return m;const merged=new Set([...m.dates,...entry.dates]);return{...m,dates:[...merged].filter(isFuture).sort(),backup:m.backup?(m.backup+'\n'+entry.backup):entry.backup,type:entry.type||m.type}}))}else{setData(d=>[...d,{name:entry.name,dates:entry.dates.filter(isFuture).sort(),backup:entry.backup,type:entry.type,allDatesRaw:''}])}toast('Leave added','success')}setShowAddLeave(false)};
  const handleLogout=()=>{localStorage.removeItem('cx_lt_session');setUser(null)};
  if(!user)return<LoginScreen onLogin={setUser}/>;
  const tbc={PTO:'badge-pto',Sick:'badge-sick',Mixed:'badge-mixed','Business Travel':'badge-bt',Other:'badge-other'};
  return(<div style={{minHeight:'100vh',background:'var(--bg)'}}>
    <ToastContainer toasts={toasts} remove={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>
    <header style={{position:'sticky',top:0,zIndex:50,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',background:'var(--header-bg)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--header-border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:32,height:32,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#fff',fontWeight:700}}>CX</div><span style={{fontSize:17,fontWeight:700}}>Leave Tracker</span></div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <button className="btn btn-secondary btn-sm" onClick={handleSync} disabled={syncing}><span className={syncing?'spin':''} style={{display:'inline-flex'}}><Icon name="sync" size={14}/></span> {syncing?'Syncing...':'Sync from Slack'}</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditingIdx(null);setShowAddLeave(true)}}><Icon name="plus" size={14}/> Add</button>
        <button className="theme-toggle" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}/>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4,paddingLeft:8,borderLeft:'1px solid var(--border)'}}><span style={{fontSize:12,color:'var(--text2)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name}</span><button className="btn-icon" title="Logout" onClick={handleLogout} style={{width:28,height:28}}><Icon name="logout" size={14}/></button></div>
      </div>
    </header>
    <main style={{maxWidth:1320,margin:'0 auto',padding:'18px 18px 40px'}}>
      <div className="stat-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[{key:'all',val:stats.total,label:'Total Members',color:'var(--accent)'},{key:'today',val:stats.today,label:'On Leave Today',color:'var(--red)'},{key:'week',val:stats.week,label:'This Week',color:'var(--amber)'},{key:'upcoming',val:stats.upcoming,label:'Upcoming Leaves',color:'var(--green)'}].map(s=>(<div key={s.key} className={'stat-card '+(view===s.key?'active':'')} onClick={()=>setView(s.key)}><div className="value" style={{color:s.color}}>{s.val}</div><div className="label">{s.label}</div></div>))}
      </div>
      <div className="card" style={{padding:12,marginBottom:14}}>
        <div className="filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)'}}>
            {['upcoming','today','week','all'].map(v=>(<button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:view===v?'var(--accent)':'transparent',color:view===v?'#fff':'var(--text2)',cursor:'pointer'}}>{v==='all'?'All':v[0].toUpperCase()+v.slice(1)}</button>))}
          </div>
          {view==='week'&&<div style={{display:'flex',alignItems:'center',gap:4}}><button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,-1))} style={{width:26,height:26}}><Icon name="chevL" size={14}/></button><span style={{fontSize:12,color:'var(--text2)',minWidth:110,textAlign:'center',fontFamily:"'JetBrains Mono',monospace"}}>{getWeekLabel(weekDate)}</span><button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,1))} style={{width:26,height:26}}><Icon name="chevR" size={14}/></button><button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(new Date())}>This week</button></div>}
          <select className="input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px'}}>{['All','PTO','Sick','Mixed','Business Travel','Other'].map(t=><option key={t}>{t}</option>)}</select>
          <select className="input" value={projectFilter} onChange={e=>setProjectFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px',maxWidth:170}}>{allProjects.map(p=><option key={p}>{p}</option>)}</select>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowUserPicker(true)}><Icon name="users" size={13}/> {selectedUsers.length>0?selectedUsers.length+' selected':'Members'}</button>
          <div style={{position:'relative',flex:'1 1 140px',minWidth:130}}><span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',display:'flex'}}><Icon name="search" size={14}/></span><input className="input" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:32,fontSize:12}}/></div>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowSaveView(true)} title="Save view"><Icon name="save" size={13}/></button>
          <button className="btn btn-sm btn-danger" onClick={clearFilters} style={{fontSize:11}}>Clear</button>
        </div>
        {savedViews.length>0&&<div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>{savedViews.map((sv,i)=>(<span key={i} className="view-chip" onClick={()=>applySavedView(sv)}>{sv.name} <span className="x" onClick={e=>{e.stopPropagation();deleteSavedView(i)}}>\u00d7</span></span>))}</div>}
      </div>
      <div className="card responsive-table" style={{overflow:'hidden'}}><div style={{overflowX:'auto'}}><table><thead><tr><th>Name</th><th>Type</th><th>Leave Dates</th><th className="desktop-only">Named Backup</th><th>Days</th><th style={{width:72}}>Actions</th></tr></thead><tbody>
        {filtered.length===0?<tr><td colSpan={6} style={{textAlign:'center',padding:40,color:'var(--text3)'}}>No matching records</td></tr>:filtered.map((m,i)=>{const oi=data.indexOf(m);const dc=m.dates.length;return(<tr key={m.name+i} className="fade-in"><td style={{fontWeight:600,whiteSpace:'nowrap',fontSize:13.5}}>{m.name}</td><td>{m.type?<span className={'badge '+(tbc[m.type]||'badge-none')}>{m.type}</span>:<span style={{color:'var(--text3)'}}>\u2014</span>}</td><td style={{maxWidth:300}}><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{dc===0?<span style={{color:'var(--text3)',fontSize:12}}>No upcoming</span>:m.dates.slice(0,10).map(d=>(<span key={d} className={'chip '+(isToday(d)?'chip-today pulse':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)}</span>))}{dc>10&&<span className="chip chip-gray" style={{fontSize:10}}>+{dc-10}</span>}</div></td><td className="desktop-only" style={{maxWidth:260,whiteSpace:'pre-wrap',fontSize:12,color:'var(--text2)',lineHeight:1.55}}>{m.backup||<span style={{color:'var(--text3)'}}>\u2014</span>}</td><td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,fontSize:14,textAlign:'center'}}><span style={dc>5?{color:'var(--amber)',background:'var(--amber-bg)',padding:'2px 8px',borderRadius:6}:{}}>{dc}</span></td><td><div style={{display:'flex',gap:4}}><button className="btn-icon" onClick={()=>handleEditMember(oi)} title="Edit" style={{width:28,height:28}}><Icon name="edit" size={13}/></button><button className="btn-icon" onClick={()=>handleDeleteMember(oi)} title="Delete" style={{width:28,height:28,color:'var(--red)'}}><Icon name="trash" size={13}/></button></div></td></tr>)})}
      </tbody></table></div><div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text3)'}}><span>Showing {filtered.length} of {data.length}</span><span style={{fontFamily:"'JetBrains Mono',monospace"}}>Synced: {lastSync}</span></div></div>
    </main>
    {showAddLeave&&<AddLeaveModal onClose={()=>{setShowAddLeave(false);setEditingIdx(null)}} onSave={handleSaveLeave} existingNames={allNames} editData={editingIdx!==null?data[editingIdx]:null}/>}
    {showUserPicker&&<UserPickerModal names={allNames} selected={selectedUsers} onClose={()=>setShowUserPicker(false)} onApply={sel=>{setSelectedUsers(sel);setShowUserPicker(false)}}/>}
    {showSaveView&&<div className="overlay" onClick={()=>setShowSaveView(false)}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:340}}><h3 style={{fontSize:16,fontWeight:600,marginBottom:14}}>Save Current View</h3><input className="input" placeholder="View name" value={saveViewName} onChange={e=>setSaveViewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveCurView()} autoFocus/><div style={{display:'flex',gap:8,marginTop:14,justifyContent:'flex-end'}}><button className="btn btn-secondary btn-sm" onClick={()=>setShowSaveView(false)}>Cancel</button><button className="btn btn-primary btn-sm" onClick={saveCurView}>Save</button></div></div></div>}
  </div>);
}

function AddLeaveModal({onClose,onSave,existingNames,editData}){
  const[name,setName]=useState(editData?editData.name:'');const[isNew,setIsNew]=useState(false);const[type,setType]=useState(editData?editData.type:'PTO');
  const[dates,setDates]=useState(editData?[...editData.dates]:[]);const[dateInput,setDateInput]=useState('');const[backup,setBackup]=useState(editData?editData.backup:'');
  const addDate=()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}};
  const removeDate=d=>setDates(ds=>ds.filter(x=>x!==d));
  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><h3 style={{fontSize:17,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
    <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Team Member</label>
    {isNew?<div style={{display:'flex',gap:8,marginBottom:14}}><input className="input" placeholder="Full name" value={name} onChange={e=>setName(e.target.value)} autoFocus/><button className="btn btn-sm btn-secondary" onClick={()=>setIsNew(false)}>Cancel</button></div>:
    <div style={{display:'flex',gap:8,marginBottom:14}}><select className="input" value={name} onChange={e=>setName(e.target.value)} disabled={!!editData}><option value="">Select...</option>{existingNames.map(n=><option key={n}>{n}</option>)}</select>{!editData&&<button className="btn btn-sm btn-secondary" onClick={()=>{setIsNew(true);setName('')}}><Icon name="plus" size={14}/></button>}</div>}
    <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Leave Type</label>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>{['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(<button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'var(--accent-light)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer'}}>{t}</button>))}</div>
    <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Leave Dates</label>
    <div style={{display:'flex',gap:8,marginBottom:8}}><input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)} style={{flex:1}}/><button className="btn btn-sm btn-primary" onClick={addDate}>Add</button></div>
    <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:14,minHeight:24}}>{dates.map(d=>(<span key={d} className="chip chip-future" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)} <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>removeDate(d)}>\u00d7</span></span>))}</div>
    <label style={{fontSize:12,color:'var(--text2)',marginBottom:4,display:'block'}}>Named Backup</label>
    <textarea className="input" rows={3} placeholder="ProjectA - PersonB" value={backup} onChange={e=>setBackup(e.target.value)} style={{resize:'vertical',marginBottom:14}}/>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={()=>{if(!name.trim())return;onSave({name:name.trim(),type,dates,backup})}}>{editData?'Update':'Save'}</button></div>
  </div></div>);
}

function UserPickerModal({names,selected,onClose,onApply}){
  const[sel,setSel]=useState(new Set(selected));const[q,setQ]=useState('');
  const toggle=n=>{const ns=new Set(sel);if(ns.has(n))ns.delete(n);else ns.add(n);setSel(ns)};
  const fn=q?names.filter(n=>n.toLowerCase().includes(q.toLowerCase())):names;
  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h3 style={{fontSize:16,fontWeight:600}}>Select Members</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
    <input className="input" placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
    <div style={{maxHeight:280,overflowY:'auto',display:'flex',flexDirection:'column',gap:2}}>{fn.map(n=>(<label key={n} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:6,cursor:'pointer',background:sel.has(n)?'var(--accent-light)':'transparent'}}><input type="checkbox" checked={sel.has(n)} onChange={()=>toggle(n)} style={{accentColor:'var(--accent)'}}/><span style={{fontSize:13}}>{n}</span></label>))}</div>
    <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'space-between'}}><button className="btn btn-sm btn-secondary" onClick={()=>setSel(new Set())}>Clear</button><div style={{display:'flex',gap:8}}><button className="btn btn-secondary btn-sm" onClick={onClose}>Cancel</button><button className="btn btn-primary btn-sm" onClick={()=>onApply([...sel])}>Apply ({sel.size})</button></div></div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
