      var dashIdx=mainPart.indexOf(' - ');
      if(dashIdx>-1){project=mainPart.substring(0,dashIdx).trim();personStr=mainPart.substring(dashIdx+3).trim()}
      else{var colonIdx=mainPart.indexOf(':');if(colonIdx>-1){project=mainPart.substring(0,colonIdx).trim();personStr=mainPart.substring(colonIdx+1).trim()}else{project=mainPart;personStr=''}}
    }
    var persons=personStr?personStr.split(/\s*,\s*/).filter(Boolean):[];
    return{date:date,project:project,persons:persons,agenda:agenda,isNoCalls:isNoCalls};
  }).filter(function(p){
    if(p.isNoCalls)return includeNoCalls?true:false;
    return p.project||p.persons.length>0;
  });
}
function getNoCallsDates(backupStr){
  if(!backupStr)return new Set();
  var s=new Set();
  backupStr.split('\n').forEach(function(line){
    var m=line.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*__NO_CALLS__/);
    if(m)s.add(m[1]);
  });
  return s;
}
function buildBackupString(entries){
  return entries.filter(e=>e.project||e.persons.length>0).map(e=>{
    let s='';
    if(e.date)s+='['+e.date+'] ';
    if(e.project&&e.project!=='__NO_CALLS__'){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
    else if(e.persons.length>0)s+=e.persons.join(', ');
    if(e.agenda)s+=' | Agenda: '+e.agenda.replace(/\r?\n/g,' · ');
    return s;
  }).join('\n');
}

async function upsertLeave(entry,addedBy){
  const memberName=(entry&&entry.name&&String(entry.name).trim())||
                   (addedBy&&String(addedBy).split('@')[0].trim())||
                   'Unknown';

  const payload={
    member_name:memberName,
    dates:JSON.stringify(entry.dates||[]),
    type:entry.type||'PTO',
    backup:entry.backup||'',
    half_days:JSON.stringify(entry.halfDays||{}),
    date_types:JSON.stringify(entry.dateTypes||{}),
    added_by:String(addedBy||''),
    updated_at:new Date().toISOString(),
  };

  console.log('[upsertLeave] memberName=',memberName,'payload=',JSON.stringify(payload).slice(0,150));

  // Use Prefer: return=minimal so PostgREST doesn't try to SELECT the row back
  // (SELECT may be blocked by RLS even when INSERT is allowed)
  const headers={
    'apikey':SB_KEY,
    'Authorization':'Bearer '+SB_KEY,
    'Content-Type':'application/json',
    'Prefer':'return=minimal',
  };

  // Look for existing row
  let existingId=null;
  try{
    const lu=await fetch(SB_URL+'/rest/v1/lt_leaves?member_name=eq.'+encodeURIComponent(memberName)+'&limit=1',{headers});
    if(lu.ok){const rows=await lu.json();if(Array.isArray(rows)&&rows.length>0)existingId=rows[0].id;}
  }catch(e){console.warn('[upsertLeave] lookup err:',e.message)}

  const url=existingId
    ?SB_URL+'/rest/v1/lt_leaves?id=eq.'+existingId
    :SB_URL+'/rest/v1/lt_leaves';
  const method=existingId?'PATCH':'POST';

  const r=await fetch(url,{method,headers,body:JSON.stringify(payload)});
  const txt=await r.text();
  console.log('[upsertLeave] status:',r.status,'response:',txt.slice(0,100));
  if(!r.ok){
    let msg=txt;
    try{const j=JSON.parse(txt);msg=j.message||j.hint||j.details||txt}catch{}
    throw new Error(msg);
  }
  return true; // success — don't need the row back
}

function mergeCanvasAndUserLeaves(canvasMembers,userLeaves){
  const merged=[...canvasMembers];const deletedNames=new Set();
  for(const ul of userLeaves){
    // Handle all possible name column variants
    const ulName=(ul.member_name||ul.name||ul.employee||ul.employee_name||ul.person||ul.person_name||ul.member||ul.username||ul.display_name||'').trim();
    if(!ulName)continue;
    if(ul.deleted){deletedNames.add(ulName.toLowerCase());continue}
    // Handle all possible dates column variants
    const rawDates=ul.dates||ul.leave_dates||ul.date_list||'[]';
    let dates=[];
    try{dates=typeof rawDates==='string'?JSON.parse(rawDates):rawDates||[]}catch{dates=[]}
    // Handle all possible half_days column variants
    const rawHD=ul.half_days||ul.halfdays||ul.half_day||'{}';
    let halfDays={};
    try{halfDays=typeof rawHD==='string'?JSON.parse(rawHD):rawHD||{}}catch{halfDays={}}
    // Handle all possible date_types column variants
    const rawDT=ul.date_types||ul.datetypes||ul.leave_types||'{}';
    let dateTypes={};
    try{dateTypes=typeof rawDT==='string'?JSON.parse(rawDT):rawDT||{}}catch{dateTypes={}}
    // Handle all possible type column variants
    const ulType=ul.type||ul.leave_type||ul.leavetype||'PTO';
    // Handle all possible backup column variants
    const ulBackup=ul.backup||ul.backup_info||ul.backup_person||'';
    const validDates=dates.filter(d=>d&&d.match&&d.match(/^\d{4}-\d{2}-\d{2}$/));
    const idx=merged.findIndex(m=>m.name.toLowerCase()===ulName.toLowerCase());
    if(idx>=0){
      const mergedDates=new Set([...merged[idx].dates,...validDates]);
      merged[idx]={...merged[idx],dates:[...mergedDates].sort(),backup:ulBackup||merged[idx].backup,type:ulType||merged[idx].type,halfDays:{...(merged[idx].halfDays||{}),...halfDays},dateTypes:{...(merged[idx].dateTypes||{}),...dateTypes}};
    }else{
      merged.push({name:ulName,dates:validDates.sort(),backup:ulBackup||'',type:ulType||'PTO',raw:'',halfDays,dateTypes});
    }
  }
  return merged.filter(m=>!deletedNames.has(m.name.toLowerCase()));
}

function buildCsvContent(members){
  // csvCell: wraps value in quotes and escapes internal quotes; newlines within a cell
  // are kept as literal \n inside quotes (RFC 4180 compliant — Excel/Sheets handle this correctly)
  const csvCell=v=>{
    const s=String(v==null?'':v)
      .replace(/\r\n/g,'\n').replace(/\r/g,'\n') // normalize line endings
      .replace(/\|/g,' · ');                      // pipe chars become · (avoid csv confusion)
    // Always quote if contains comma, quote, newline, or leading/trailing space
    if(s.includes(',')||s.includes('"')||s.includes('\n')||s!==s.trim())
      return'"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const rows=[['Employee Name','Leave Type','Leave Date Range','Total Leave Days','Leave Dates (all)','Project Date','Project Name','Backup Owner(s)','Agenda / Notes']];
  for(const m of members){
    const hd=m.halfDays||{};
    const ranges=groupConsecutiveDates(m.dates);
    const dateRangeStr=ranges.map(r=>r.start===r.end?fmtDateWithHalf(r.start,hd):fmtDateWithHalf(r.start,hd)+' – '+fmtDateWithHalf(r.end,hd)).join(' | ');
    const allDates=m.dates.map(d=>fmtDateWithHalf(d,hd)).join(', ');
    const totalDays=countLeaveDays(m.dates,hd);
    const projects=parseProjectEntries(m.backup||'');
    if(projects.length===0){
      rows.push([m.name,m.type,dateRangeStr,totalDays,allDates,'','','','']);
    }else{
      projects.forEach((p,pi)=>{
        // Agenda: normalise — strip pipe prefixes ("Agenda: "), keep bullet lines together
        const agendaClean=(p.agenda||'').replace(/^Agenda:\s*/i,'').trim();
        rows.push([
          pi===0?m.name:'',
          pi===0?m.type:'',
          pi===0?dateRangeStr:'',
          pi===0?totalDays:'',
          pi===0?allDates:'',
          p.date?fmtDateWithHalf(p.date,hd):'',
          p.isNoCalls?'No customer calls':p.project||'',
          p.persons.join(', ')||'',
          agendaClean
        ]);
      });
    }
  }
  return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}

function downloadCsv(content,filename){
  const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);

// ─── PROJECTS & AGENDA MODAL (standalone work tracker + leave-linked team view) ───
function ProjectsAgendaModal({members,userName,allNames,onClose}){
  const[activeTab,setActiveTab]=useState('mine');
  const[projEntries,setProjEntries]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  // Edit state for "My Entries" tab
  const blankEntry=()=>({id:null,date:todayStr(),project:'',next_call:'',backup:'',agenda:'',showPicker:false,pickerQ:'',_dirty:false});
  const[draftEntries,setDraftEntries]=useState([blankEntry()]);
  const[saveMsg,setSaveMsg]=useState('');
  // Team view filters
  const[search,setSearch]=useState('');
  const[memberFilter,setMemberFilter]=useState('');
  const[dateFilter,setDateFilter]=useState('');
  const generatedAt=new Date().toLocaleString();

  // Load all standalone project entries on mount
  useEffect(()=>{
    fetchProjectEntries().then(data=>{
      setProjEntries(data||[]);
      // Pre-populate My Entries with manual (non-leave_sync) entries for current user
      const mine=(data||[]).filter(e=>e.name&&e.name.toLowerCase()===userName.toLowerCase()&&e.source!=='leave_sync'&&!e.deleted);
      setDraftEntries(mine.length>0?mine.map(e=>({...e,showPicker:false,pickerQ:'',_dirty:false})):[blankEntry()]);
      setLoading(false);
    });
  },[userName]);

  const myEntries=draftEntries;
  const updateDraft=(idx,field,val)=>setDraftEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val,_dirty:true}:x));
  const addDraftRow=()=>setDraftEntries(e=>[...e,blankEntry()]);
  const removeDraftRow=async(idx)=>{
    const entry=draftEntries[idx];
    if(entry.id&&!String(entry.id).startsWith('local_')){
      await deleteProjectEntry(entry.id);
      setProjEntries(p=>p.filter(x=>x.id!==entry.id));
    }
    setDraftEntries(e=>e.filter((_,i)=>i!==idx));
  };

  const addPersonToDraft=(idx,person)=>setDraftEntries(e=>e.map((x,i)=>{
    if(i!==idx)return x;
    const existing=(x.backup||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(existing.includes(person))return{...x,showPicker:false,pickerQ:''};
    return{...x,backup:[...existing,person].join(', '),showPicker:false,pickerQ:'',_dirty:true};
  }));
  const removePersonFromDraft=(idx,person)=>setDraftEntries(e=>e.map((x,i)=>{
    if(i!==idx)return x;
    const persons=(x.backup||'').split(',').map(s=>s.trim()).filter(p=>p&&p!==person);
    return{...x,backup:persons.join(', '),_dirty:true};
  }));

  const handleSaveAll=async()=>{
    const toSave=draftEntries.filter(e=>e.project.trim());
    if(toSave.length===0){setSaveMsg('Add at least one project name to save.');return}
    setSaving(true);setSaveMsg('');
    try{
      const saved=[];
      for(const e of toSave){
        const result=await upsertProjectEntry({...e,name:userName});
        if(result&&result[0])saved.push({...result[0],showPicker:false,pickerQ:'',_dirty:false});
        else saved.push({...e,_dirty:false});
      }
      // Refresh from server
      const fresh=await fetchProjectEntries();
      setProjEntries(fresh||[]);
      const mine=(fresh||[]).filter(e=>e.name&&e.name.toLowerCase()===userName.toLowerCase());
      setDraftEntries(mine.length>0?mine.map(e=>({...e,showPicker:false,pickerQ:'',_dirty:false})):[blankEntry()]);
      setSaveMsg('✓ Saved successfully');
      setTimeout(()=>setSaveMsg(''),3000);
    }catch(err){setSaveMsg('Save failed — changes stored locally')}
    setSaving(false);
  };

  // Merge: lt_projects entries (both standalone + leave_sync) for team view
  // Deduplicate: if an entry exists in both lt_projects AND in the backup string, prefer lt_projects version
  const allTeamEntries=useMemo(()=>{
    const rows=[];
    const seenKeys=new Set(); // member+date+project dedup
    // First: all lt_projects entries (standalone + leave_sync)
    projEntries.forEach(e=>{
      if(e.deleted)return;
      const src=e.source==='leave_sync'?'leave_sync':'standalone';
      const key=(e.name||'').toLowerCase()+'|'+(e.date||'')+'|'+(e.project||'').toLowerCase();
      seenKeys.add(key);
      rows.push({
        member:e.name||'',source:src,type:'—',rangeStr:'',
        date:e.date||'',project:e.project||'',
        next_call:e.next_call||'',
        backup:e.backup?e.backup.split(',').map(s=>s.trim()).filter(Boolean):[],
        agenda:e.agenda||'',isNoCalls:false,noProjects:false
      });
    });
    // Second: Leave-linked entries from backup strings not already in lt_projects
    members.forEach(m=>{
      const projs=parseProjectEntries(m.backup||'',true);
      const ranges=groupConsecutiveDates(m.dates);
      const rangeStr=ranges.map(r=>r.start===r.end?fmtDate(r.start):fmtDate(r.start)+' – '+fmtDate(r.end)).join(', ');
      if(projs.length===0){
        rows.push({member:m.name,source:'leave',type:m.type,rangeStr,date:'',project:'',next_call:'',backup:[],agenda:'',isNoCalls:false,noProjects:true});
      }else{
        projs.forEach(p=>{
          const key=m.name.toLowerCase()+'|'+(p.date||'')+'|'+(p.project||'').toLowerCase();
          if(!seenKeys.has(key)){
            rows.push({member:m.name,source:'leave',type:m.type,rangeStr,date:p.date,project:p.project,next_call:'',backup:p.persons,agenda:p.agenda,isNoCalls:p.isNoCalls,noProjects:false});
          }
        });
      }
    });
    return rows.sort((a,b)=>a.date>b.date?1:a.date<b.date?-1:a.member.localeCompare(b.member));
  },[projEntries,members]);

  const uniqueMembers=[...new Set(allTeamEntries.map(e=>e.member).filter(Boolean))].sort();
  const uniqueDates=[...new Set(allTeamEntries.map(e=>e.date).filter(Boolean))].sort();

  const filteredTeam=useMemo(()=>{
    let r=allTeamEntries;

    if(dateFilter)r=r.filter(e=>e.date===dateFilter);
    if(search.trim()){const q=search.toLowerCase();r=r.filter(e=>e.member.toLowerCase().includes(q)||e.project.toLowerCase().includes(q)||(e.backup||[]).join(' ').toLowerCase().includes(q)||e.agenda.toLowerCase().includes(q))}
    return r;
  },[allTeamEntries,memberFilter,dateFilter,search]);

  const handleCsv=()=>{
    const esc=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s};
    const rows=[['Source','Employee','Leave Type','Leave Range','Date','Project','Next Call','Backup Owner(s)','Agenda / Notes']];
    filteredTeam.forEach(e=>{
      rows.push([e.source==='standalone'?'Standalone':'Leave-linked',e.member,e.type||'',e.rangeStr||'',e.date?fmtDate(e.date):'',e.isNoCalls?'No customer calls':e.project||'',e.next_call||'',(e.backup||[]).join(', ')||'',e.agenda||'']);
    });
    const csv=rows.map(r=>r.map(esc).join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='cx-projects-agenda-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
  };

  const handlePdf=()=>{
    const esc=s=>{if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>').replace(/\|/g,' · ')};

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;padding:28px 32px;color:#2c1810;font-size:12px;line-height:1.55}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid #e8590c}

.print-btn{padding:7px 14px;background:#e8590c;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:12px}

th{text-align:left;padding:7px 9px;background:#f7f3ee;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#9a8576;border-bottom:2px solid #e0d5c7;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid #e0d5c7;vertical-align:top;font-size:11.5px;word-break:break-word}

@media print{.print-btn{display:none}td,th{font-size:10px;padding:5px 7px}}</style></head><body>

<table><thead><tr><th></th><th>Employee</th><th>Date</th><th>Project</th><th>Next Call</th><th>Backup Owner</th><th>Agenda / Notes</th></tr></thead>
<tbody>${rows}</tbody></table>
<div class="footer"><span>🗂️ Standalone · 🔗 Leave-synced · 📅 Leave-linked</span><span>${generatedAt}</span></div>

    {/* ══ TEAM VIEW TAB ══ */}

          <option value="">All employees</option>

// ─── INLINE PERSON PICKER (used in import preview backup column) ───
// Compact chip-based person picker that fits inside a table cell.
// Dropdown uses fixed positioning so it escapes table overflow clipping.
function InlinePersonPicker({persons,allNames,onChange,iStyle}){
  const[open,setOpen]=useState(false);
  const[q,setQ]=useState('');
  const[newName,setNewName]=useState('');
  const[dropPos,setDropPos]=useState({top:0,left:0,width:320});
  const triggerRef=useRef(null);
  const dropRef=useRef(null);

  // Recompute dropdown position whenever it opens
  const openDropdown=()=>{
    if(triggerRef.current){
      const r=triggerRef.current.getBoundingClientRect();
      const vpH=window.innerHeight;
      const dropH=320; // expected dropdown height
      // Open downward unless too close to bottom
      const top=r.bottom+4+dropH>vpH?Math.max(4,r.top-dropH-4):r.bottom+4;
      const width=Math.max(300,r.width);
      // Keep left edge within viewport
      const left=Math.min(r.left,window.innerWidth-width-8);
      setDropPos({top,left,width});
    }
    setOpen(true);
  };

  // Close on outside click
  useEffect(()=>{
    if(!open)return;
    const handler=e=>{
      if(triggerRef.current&&!triggerRef.current.contains(e.target)&&
         dropRef.current&&!dropRef.current.contains(e.target))
        setOpen(false);
    };
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[open]);

  const add=(name)=>{
    const n=name.trim();
    if(!n||persons.some(p=>p.toLowerCase()===n.toLowerCase()))return;
    onChange([...persons,n]);
    setQ('');setNewName('');
  };
  const remove=(name)=>onChange(persons.filter(p=>p.toLowerCase()!==name.toLowerCase()));

  // Merge allNames with any already-selected persons so parsed names always appear
  const knownNames=useMemo(()=>{
    const all=new Set((allNames||[]).map(n=>n.toLowerCase()));
    const extra=persons.filter(p=>!all.has(p.toLowerCase()));
    return extra.length>0?[...(allNames||[]),...extra]:(allNames||[]);
  },[allNames,persons]);

  const filtered=knownNames.filter(n=>
    !persons.some(p=>p.toLowerCase()===n.toLowerCase())&&
    (!q||n.toLowerCase().includes(q.toLowerCase()))
  );

  return(
    <div ref={triggerRef} style={{position:'relative',minWidth:0}}>
      {/* Chip display + open trigger */}
      <div
        style={{display:'flex',flexWrap:'wrap',gap:3,alignItems:'center',
          background:'var(--input-bg)',border:'1px solid '+(open?'var(--accent)':'var(--border)'),
          borderRadius:5,padding:'3px 5px',cursor:'pointer',minHeight:26,transition:'border-color .15s'}}
        onClick={openDropdown}
      >
        {persons.map(p=>(
          <span key={p} style={{display:'inline-flex',alignItems:'center',gap:2,
            background:'var(--chip-future-bg)',color:'var(--chip-future-text)',
            border:'1px solid var(--chip-future-border)',borderRadius:999,
            padding:'0 6px',fontSize:10,lineHeight:'18px',whiteSpace:'nowrap'}}>
            {p}
            <span onClick={ev=>{ev.stopPropagation();remove(p)}}
              style={{cursor:'pointer',opacity:.6,marginLeft:1,fontSize:11,lineHeight:1}}>×</span>
          </span>
        ))}
        {persons.length===0&&<span style={{fontSize:11,color:'var(--text3)'}}>Select or type…</span>}
        <span style={{marginLeft:'auto',fontSize:10,color:'var(--text3)',flexShrink:0}}>▾</span>
      </div>

      {/* Fixed-position dropdown — escapes table cell clipping */}
      {open&&typeof document!=='undefined'&&ReactDOM.createPortal(
        <div ref={dropRef} style={{
          position:'fixed',top:dropPos.top,left:dropPos.left,width:dropPos.width,
          zIndex:9999,background:'var(--surface)',border:'1px solid var(--border)',
          borderRadius:10,boxShadow:'0 8px 32px rgba(0,0,0,.18)',overflow:'hidden',
          animation:'fadeIn .15s ease-out'
        }}>
          {/* Search */}
          <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)',background:'var(--surface2)'}}>
            <input autoFocus className="input" placeholder="Search team members…"
              value={q} onChange={e=>setQ(e.target.value)}
              onKeyDown={e=>{
                if(e.key==='Enter'&&filtered.length>0){add(filtered[0]);setQ('')}
                if(e.key==='Escape')setOpen(false);
              }}
              style={{fontSize:12.5,padding:'6px 10px'}}
              onClick={ev=>ev.stopPropagation()}
            />
          </div>

          {/* Members list */}
          <div style={{maxHeight:200,overflowY:'auto'}}>
            {filtered.length===0&&!q&&<div style={{padding:'10px 12px',fontSize:12,color:'var(--text3)',fontStyle:'italic'}}>All members already added</div>}
            {filtered.length===0&&q&&<div style={{padding:'10px 12px',fontSize:12,color:'var(--text3)'}}>No match for "{q}"</div>}
            {filtered.map(n=>(
              <div key={n} onClick={()=>{add(n);setQ('')}}
                style={{padding:'7px 12px',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:8,transition:'background .1s'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--accent-light)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}
              >
                <span style={{width:24,height:24,borderRadius:'50%',background:'var(--indigo-bg)',
                  border:'1px solid var(--chip-future-border)',display:'inline-flex',alignItems:'center',
                  justifyContent:'center',fontSize:11,color:'var(--indigo)',fontWeight:600,flexShrink:0}}>
                  {n.charAt(0).toUpperCase()}
                </span>
                <span>{n}</span>
              </div>
            ))}
          </div>

          {/* Add new person */}
          <div style={{padding:'8px 10px',borderTop:'1px solid var(--border)',background:'var(--surface2)'}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:5,fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>Add new person</div>
            <div style={{display:'flex',gap:6}}>
              <input className="input" placeholder="Type full name…"
                value={newName} onChange={e=>setNewName(e.target.value)}
                onKeyDown={e=>{
                  if(e.key==='Enter'&&newName.trim()){add(newName);setOpen(false)}
                  if(e.key==='Escape')setOpen(false);
                }}
                style={{fontSize:12.5,padding:'6px 10px',flex:1}}
                onClick={ev=>ev.stopPropagation()}
              />
              <button className="btn btn-sm btn-primary"
                onClick={()=>{if(newName.trim()){add(newName);setOpen(false)}}}
                style={{flexShrink:0}}>Add</button>
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// ─── IMPORT LEAVE MODAL — accepts any file format ───
function ImportLeaveModal({onClose,onImport,userName,allNames}){
  const[step,setStep]=useState('upload');
  const[parseErr,setParseErr]=useState('');
  const[parseWarnings,setParseWarnings]=useState([]);
  const[parsed,setParsed]=useState(null);
  const[importing,setImporting]=useState(false);
  const[importLog,setImportLog]=useState([]);
  const[dragOver,setDragOver]=useState(false);
  const[fileName,setFileName]=useState('');
  const[parsing,setParsing]=useState(false);
  const fileRef=useRef(null);

  // ── Template download ──
  const downloadTemplate=()=>{
    const cols=['Date (DD-MM-YYYY)','Leave Type (PTO/Sick/Mixed/Business Travel)','Half Day (full/first/second)','Project Name','Backup Person(s) (comma separated)','Agenda / Notes'];
    const rows=[cols,['10-06-2025','PTO','full','Shield Roofing','Sundeep, Balaje','Review Q2 pipeline and hand off open tickets'],['11-06-2025','PTO','full','Acme Corp','Kari','Weekly sync — Kari to cover'],['12-06-2025','PTO','first','','','No customer calls']];
    const csv=rows.map(r=>r.map(v=>{const s=String(v);return s.includes(',')||s.includes('"')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='cx-leave-import-template.csv';
    document.body.appendChild(a);a.click();setTimeout(()=>removeChild(a),100);
    function removeChild(a){document.body.removeChild(a);URL.revokeObjectURL(url)}
  };

  // ── Date parsers ──
  const excelSerialToDate=(n)=>{
    if(n<1000||n>100000)return null;
    const d=new Date(Date.UTC(1900,0,1)+(n-2)*86400*1000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  };
  const MONTHS={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12',
    january:'01',february:'02',march:'03',april:'04',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
  const parseAnyDate=(raw)=>{
    if(!raw)return null;
    const s=String(raw).trim();
    // DD-MM-YYYY / DD/MM/YYYY (preferred)
    let m=s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
    if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    // YYYY-MM-DD
    m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    // DD Mon YYYY / DD-Mon-YYYY / DD Month YYYY
    m=s.match(/^(\d{1,2})[\s\-\/]([a-zA-Z]+)[\s\-\/](\d{2,4})$/);
    if(m){const mn=MONTHS[m[2].toLowerCase()];const yr=m[3].length===2?'20'+m[3]:m[3];if(mn)return yr+'-'+mn+'-'+m[1].padStart(2,'0')}
    // Mon DD YYYY / Month DD, YYYY
    m=s.match(/^([a-zA-Z]+)[\s\-](\d{1,2})[,\s]+(\d{4})$/);
    if(m){const mn=MONTHS[m[1].toLowerCase()];if(mn)return m[3]+'-'+mn+'-'+m[2].padStart(2,'0')}
    // Excel serial
    if(/^\d{5}$/.test(s))return excelSerialToDate(parseInt(s));
    // ISO with time
    m=s.match(/^(\d{4}-\d{2}-\d{2})T/);
    if(m)return m[1];
    // Short DD/MM/YY
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
    if(m)return'20'+m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return null;
  };

  // ── CSV/tabular parser — RFC 4180 compliant (preserves \n inside quoted cells) ──
  const parseCsvText=(text)=>{
    const normalized=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    if(!normalized.trim())return{error:'File appears empty — no data rows found'};

    // Detect separator from first line
    const firstNewline=normalized.indexOf('\n');
    const firstLine=firstNewline>=0?normalized.slice(0,firstNewline):normalized;
    const sep=firstLine.includes('\t')?'\t':firstLine.includes(';')?';':',';

    // Full RFC 4180 tokeniser — handles \n inside quoted fields
    const parseAllRows=(src,s)=>{
      const allRows=[];let row=[];let cur='';let inQ=false;
      for(let i=0;i<src.length;i++){
        const c=src[i];
        if(inQ){
          if(c==='"'&&src[i+1]==='"'){cur+='"';i++}           // escaped quote
          else if(c==='"'){inQ=false}                          // closing quote
          else cur+=c;                                         // content (including \n)
        }else{
          if(c==='"'){inQ=true}
          else if(c===s){row.push(cur);cur=''}                 // field separator
          else if(c==='\n'){row.push(cur);allRows.push(row);row=[];cur=''}  // row separator
          else cur+=c;
        }
      }
      if(cur||row.length)row.push(cur);
      if(row.some(c=>c.trim()))allRows.push(row);
      return allRows;
    };

    const allRows=parseAllRows(normalized,sep);
    if(allRows.length<2)return{error:'File appears empty — no data rows found'};

    const rawHeader=allRows[0].map(h=>h.trim());
    const header=rawHeader.map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,''));
    const rows=[];
    for(let i=1;i<allRows.length;i++){
      const cells=allRows[i];
      if(cells.every(c=>!c.trim()))continue;
      const row={};
      // For agenda/notes fields: keep internal newlines, only trim leading/trailing whitespace
      header.forEach((k,j)=>{
        const raw=cells[j]||'';
        // Preserve newlines inside agenda-type fields; trim edges
        row[k]=raw.trim();
      });
      rawHeader.forEach((k,j)=>{row['_r_'+k.toLowerCase().trim()]=(cells[j]||'').trim()});
      row['_cells']=cells;
      rows.push(row);
    }
    return{header,rawHeader,rows};
  };

  const tabularToResult=(rows,rawHeader,header)=>{
    const typeMap={'pto':'PTO','sick':'Sick','mixed':'Mixed','businesstravel':'Business Travel','bt':'Business Travel','business':'Business Travel'};

    // Try to find the date column — check headers, then scan all cells of first data row
    const dateColIdx=(()=>{
      // Header contains 'date'
      const i=header.findIndex(h=>h.includes('date'));if(i>=0)return i;
      const j=(rawHeader||[]).findIndex(h=>h.toLowerCase().includes('date'));if(j>=0)return j;
      // Scan first row for any cell that parses as a date
      if(rows[0]){for(let k=0;k<(rows[0]._cells||[]).length;k++){if(parseAnyDate(rows[0]._cells[k]))return k}}
      return -1; // unknown
    })();

    const dates=[];const halfDays={};const entries=[];let type='PTO';const skipped=[];
    rows.forEach(row=>{
      // Get date value: try detected column, then common key names, then scan ALL cells
      let rawDate='';
      if(dateColIdx>=0)rawDate=(row._cells||[])[dateColIdx]||'';
      if(!rawDate)rawDate=row['dateddmmyyyy']||row['date']||row['leavedate']||row['dateyyyyymmdd']||row['leavedateddmmyyyy']||'';
      // Last resort: scan every cell for something that looks like a date
      if(!rawDate&&row._cells){
        for(const cell of row._cells){if(cell&&parseAnyDate(cell)){rawDate=cell;break}}
      }
      const dateStr=parseAnyDate(rawDate);
      if(!dateStr){if(rawDate&&rawDate.trim())skipped.push(rawDate.trim());return}
      if(!dates.includes(dateStr))dates.push(dateStr);
      const rt=(row['leavetypepto']||row['leavetype']||row['type']||row['leave']||row['leavetype1']||'').toLowerCase().replace(/[^a-z]/g,'');
      if(rt&&typeMap[rt])type=typeMap[rt];
      const rh=(row['halfdayfull']||row['halfday']||row['half']||row['halfdayfullhalf']||'').toLowerCase();
      if(/first|1st|^am$|firsthalf/.test(rh))halfDays[dateStr]='first';
      else if(/second|2nd|^pm$|secondhalf/.test(rh))halfDays[dateStr]='second';
      const project=(row['projectname']||row['project']||row['customer']||row['customername']||row['projectname1']||'').trim();
      const backupRaw=(row['backuppersons']||row['backup']||row['backupowner']||row['dri']||row['backuppersonscommaseparated']||row['backupresource']||'').trim();
      const agenda=(row['agendanotes']||row['agenda']||row['notes']||row['note']||row['agendanotes1']||'').trim();
      const persons=backupRaw?backupRaw.split(/[,;]+/).map(s=>s.trim()).filter(Boolean):[];
      const isNoCalls=!project&&!persons.length&&/no.{0,10}call/.test(agenda.toLowerCase());
      entries.push({date:dateStr,project,persons,agenda,isNoCalls});
    });
    dates.sort();
    return{dates,type,halfDays,entries,rowCount:rows.length,skipped};
  };

  // ── Freeform text parser (for .txt, .doc, .docx, .rtf, .md, .pdf) ──
  const parseFreeformText=(text)=>{
    const warnings=[];
    const dates=[];const halfDays={};const entries=[];
    const typeMap={'pto':'PTO','sick':'Sick','sickleave':'Sick','mixed':'Mixed','businesstravel':'Business Travel','business':'Business Travel'};
    let type='PTO';

    // 1. Extract all date mentions anywhere in the document
    const dateHits=new Map(); // dateStr → context line
    const lines=text.split(/\n/).map(l=>l.trim());

    // Scan every line for dates
    lines.forEach(line=>{
      if(!line)return;
      // Try to find all date patterns in the line
      const patterns=[
        /\b(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})\b/g,       // DD-MM-YYYY
        /\b(\d{4})[-\/](\d{2})[-\/](\d{2})\b/g,                // YYYY-MM-DD
        /\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})\b/gi,
        /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})[,\s]+(\d{4})\b/gi,
        /\b(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{4})\b/gi,
      ];
      patterns.forEach(re=>{
        let m;re.lastIndex=0;
        while((m=re.exec(line))!==null){
          const ds=parseAnyDate(m[0]);
          if(ds&&!dateHits.has(ds))dateHits.set(ds,line);
        }
      });
    });

    // 2. Detect leave type keywords
    const fullText=text.toLowerCase();
    for(const[key,val]of Object.entries(typeMap)){if(fullText.includes(key)){type=val;break}}

    // 3. Detect half-day keywords
    let halfDefault=null;
    if(/first.half|morning.half|half.day.morning|am.half/.test(fullText))halfDefault='first';
    else if(/second.half|afternoon.half|half.day.afternoon|pm.half/.test(fullText))halfDefault='second';

    // 4. For each found date, extract surrounding context for project/backup/agenda
    // Strategy: find the line containing the date and the next 3–5 non-empty lines
    const contextWindow=5;
    const sortedDates=[...dateHits.keys()].sort();
    sortedDates.forEach(ds=>{
      dates.push(ds);
      if(halfDefault)halfDays[ds]=halfDefault;

      const ctxLine=dateHits.get(ds)||'';
      // Find its index in lines array
      const lineIdx=lines.findIndex(l=>l.includes(ctxLine)||parseAnyDate(l));
      const ctx=lines.slice(Math.max(0,lineIdx),Math.min(lines.length,lineIdx+contextWindow)).join(' ');

      // Extract project — look for patterns like "Project: X", "Customer: X", or a capitalised name
      let project='';
      let m=ctx.match(/project[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/customer[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/client[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/account[:\s]+([^\n,\.]{2,40})/i);
      if(m)project=m[1].trim();

      // Extract backup — look for "backup: X", "cover: X", "DRI: X", "@Name"
      let persons=[];
      const bkp=ctx.match(/backup[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/cover(?:ed by|ing)[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/dri[:\s]+([^\n,\.]{2,40})/i)||ctx.match(/poc[:\s]+([^\n,\.]{2,40})/i);
      if(bkp)persons=bkp[1].split(/[,&]+/).map(s=>s.trim()).filter(Boolean);

      // Extract agenda — "Agenda: X", "Notes: X", "Discussion: X"
      let agenda='';
      const ag=ctx.match(/agenda[:\s]+([^\n]{4,120})/i)||ctx.match(/notes[:\s]+([^\n]{4,120})/i)||ctx.match(/discuss[^\s]*[:\s]+([^\n]{4,120})/i)||ctx.match(/handoff[:\s]+([^\n]{4,120})/i);
      if(ag)agenda=ag[1].trim();

      // No-calls detection
      const isNoCalls=/no.{0,10}call/.test(ctx.toLowerCase());

      entries.push({date:ds,project,persons,agenda,isNoCalls});
    });

    if(dates.length===0){
      return{error:'No dates found in the document. The app looked for formats like "10-06-2025", "10 June 2025", "Jun 10 2025". Please make sure dates are mentioned in the file.'};
    }

    if(dates.length>0&&entries.filter(e=>e.project).length===0){
      warnings.push('No project names were found — you can add them in the editable preview below.');
    }
    return{dates,type,halfDays,entries,rowCount:dates.length,skipped:[],warnings};
  };

  // ── Extract text from various file formats ──
  const extractText=async(file,ext)=>{
    if(['csv','txt','md','rtf'].includes(ext)){
      let t=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'UTF-8')});
      if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
      // Strip RTF control words if needed
      if(ext==='rtf')t=t.replace(/\{[^}]*\}|\\[a-z]+\d*\s?/g,' ').replace(/\s+/g,' ');
      return{text:t,tabular:ext==='csv'};
    }
    if(['xlsx','xls'].includes(ext)){
      if(!window.XLSX){
        const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});
      }
      const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsArrayBuffer(file)});
      const wb=window.XLSX.read(buf,{type:'array',cellDates:true,dateNF:'dd-mm-yyyy'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      return{text:window.XLSX.utils.sheet_to_csv(ws,{dateNF:'dd-mm-yyyy'}),tabular:true};
    }
    if(ext==='docx'){
      // Use mammoth.js for .docx text extraction
      if(!window.mammoth){
        const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
        await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});
      }
      const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsArrayBuffer(file)});
      const result=await window.mammoth.extractRawText({arrayBuffer:buf});
      return{text:result.value,tabular:false};
    }
    if(ext==='pdf'){
      // Use pdf.js for text extraction
      if(!window.pdfjsLib){
        const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsArrayBuffer(file)});
      const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
      let text='';
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str).join(' ')+'\n';}
      return{text,tabular:false};
    }
    if(ext==='doc'){
      // .doc is binary — best effort: read as text and strip binary chars
      const t=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'windows-1252')});
      const cleaned=t.replace(/[^\x20-\x7E\n\r\t]/g,' ').replace(/\s+/g,' ');
      return{text:cleaned,tabular:false};
    }
    throw new Error('Unsupported file type: .'+ext+'. Supported: CSV, XLSX, XLS, TXT, DOCX, DOC, PDF, RTF, MD');
  };

  // ── Main file handler ──
  const handleFile=async(file)=>{
    if(!file)return;
    setParseErr('');setParseWarnings([]);setParsing(true);setFileName(file.name);
    const ext=file.name.split('.').pop().toLowerCase();
    try{
      const{text,tabular}=await extractText(file,ext);
      let result;
      if(tabular){
        const{error,rows,rawHeader,header}=parseCsvText(text);
        if(error){setParseErr(error);setParsing(false);return}
        if(!rows||rows.length===0){setParseErr('File has a header row but no data rows were found.');setParsing(false);return}
        result=tabularToResult(rows,rawHeader||[],header||[]);
        if(result.dates.length===0){
          // Build a detailed diagnostic showing exactly what was seen
          const firstRow=rows[0]||{};
          const colInfo=(rawHeader||[]).map((rh,i)=>{
            const val=(firstRow._cells||[])[i]||'';
            return rh+': "'+val.slice(0,20)+'"';
          }).join(' | ');
          const sv=result.skipped.slice(0,4).join(', ');
          const hint=sv?`Values tried as dates: "${sv}". `:'';
          setParseErr(`No valid dates found. ${hint}Columns & first values: ${colInfo||'(none)'}. Date formats supported: DD-MM-YYYY, YYYY-MM-DD, "10 Jun 2025".`);
          setParsing(false);return;
        }
      }else{
        const fr=parseFreeformText(text);
        if(fr.error){setParseErr(fr.error);setParsing(false);return}
        result=fr;
        if(fr.warnings&&fr.warnings.length>0)setParseWarnings(fr.warnings);
      }
      if(result.skipped&&result.skipped.length>0)
        setParseWarnings(w=>[...w,`${result.skipped.length} row(s) skipped — unreadable date values: ${result.skipped.slice(0,3).join(', ')}`]);
      setParsed(result);setStep('preview');
    }catch(e){setParseErr(e.message||'Could not read file')}
    setParsing(false);
  };

  const triggerNewFile=()=>{
    setParseErr('');setParseWarnings([]);setFileName('');setParsed(null);
    if(fileRef.current){fileRef.current.value='';fileRef.current.click()}
  };

  const confirmImport=async()=>{
    if(!parsed)return;
    setImporting(true);setStep('importing');setImportLog([]);
    const backupStr=parsed.entries.filter(e=>e.project||e.persons.length>0||e.isNoCalls).map(e=>{
      if(e.isNoCalls)return'['+e.date+'] __NO_CALLS__';
      let s='['+e.date+'] ';
      if(e.project){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
      else if(e.persons.length>0)s+=e.persons.join(', ');
      // Replace newlines in agenda with bullet separator to keep everything on one line per entry
      if(e.agenda)s+=' | Agenda: '+e.agenda.replace(/\r?\n/g,' · ');
      return s;
    }).join('\n');
    const effectiveName=(userName&&userName.trim())||'Unknown';
    console.log('[import] userName='+JSON.stringify(userName)+' effectiveName='+JSON.stringify(effectiveName));
    setImportLog(l=>[...l,parsed.dates.length+' leave dates ('+parsed.type+') for '+effectiveName]);
    setImportLog(l=>[...l,parsed.entries.filter(e=>e.project||e.isNoCalls).length+' project / agenda entries']);
    try{
      await onImport({name:effectiveName,type:parsed.type,dates:parsed.dates,backup:backupStr,halfDays:parsed.halfDays||{},dateTypes:parsed.dateTypes||{}});
      setImportLog(l=>[...l,'Saved to database ✓']);
      setImporting(false);setStep('done');
    }catch(err){
      console.error('[import] save failed:',err.message);
      setImportLog(l=>[...l,'⚠ Save failed: '+err.message.slice(0,100)]);
      setImporting(false);setStep('preview');
    }
  };

  // Shared inline input style
  const iStyle={width:'100%',background:'var(--input-bg)',border:'1px solid var(--border)',borderRadius:5,padding:'3px 6px',fontSize:11,color:'var(--text)',outline:'none'};

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:860,width:'96%',maxHeight:'92vh',display:'flex',flexDirection:'column',padding:0,overflow:'hidden'}}>
    <div style={{padding:'18px 24px 14px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <div>
        <h3 style={{fontSize:17,fontWeight:600}}>📥 Import Leave from File</h3>
        <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>Upload any file — CSV, Excel, Word, PDF, Notepad, or plain text</div>
      </div>
      <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>

          <div style={{display:'flex',gap:8}}>

            <button className="btn btn-primary" onClick={confirmImport} disabled={parsed.dates.length===0}>Confirm &amp; Import</button>
          </div>
        </div>
      </div>
    </div>}

    {/* ── STEP: IMPORTING / DONE ── */}
    {(step==='importing'||step==='done')&&<div style={{textAlign:'center',padding:'24px 0'}}>
      {step==='importing'&&<div className="spin" style={{width:36,height:36,border:'3px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',margin:'0 auto 16px'}}/>}

    </div>{/* end scrollable content */}

}


function getAutoReplyText(name,dates){
  const sorted=[...dates].sort();const ranges=groupConsecutiveDates(sorted);
  const latestRange=ranges[ranges.length-1];const returnDay=getNextWorkingDay(latestRange.end);
  const returnStr=returnDay.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
  let dateDesc='';
  if(ranges.length===1){const r=ranges[0];if(r.start===r.end)dateDesc='on '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});else dateDesc='from '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})+' to '+new Date(r.end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})}
  else{const first=new Date(ranges[0].start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});const last=new Date(ranges[ranges.length-1].end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});dateDesc='from '+first+' to '+last}
  return`Hello,\n\nThank you for your email. I am out of office ${dateDesc} and will be back on ${returnStr}.\n\nI have limited access to my mail and will respond to your email as soon as possible upon my return.\n\nThank you for your understanding.\n\nBest regards,\n${name}`;
}
function OooActionsModal({name,dates,onClose}){
  const[copied,setCopied]=useState(false);const[opened,setOpened]=useState(false);
  const sorted=[...dates].sort();const ranges=groupConsecutiveDates(sorted);
  const returnDay=getNextWorkingDay(ranges[ranges.length-1].end);
  const returnStr=returnDay.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const startDateStr=new Date(sorted[0]+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const endDateStr=new Date(sorted[sorted.length-1]+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const autoReply=getAutoReplyText(name,dates);
  const handleCopy=async()=>{try{await navigator.clipboard.writeText(autoReply);setCopied(true);setTimeout(()=>setCopied(false),2500)}catch{const ta=document.createElement('textarea');ta.value=autoReply;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),2500)}};
  const handleOpen=()=>{window.open('https://outlook.office.com/mail/options/accounts/automaticReplies','_blank');setOpened(true)};
  const checkItem=(done,text)=>(<div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}><div style={{width:20,height:20,borderRadius:'50%',border:'2px solid',borderColor:done?'var(--green)':'var(--border)',background:done?'var(--green)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all .2s'}}>{done&&<span style={{color:'#fff',fontSize:11,fontWeight:700}}>✓</span>}</div><span style={{fontSize:12.5,color:'var(--text)',lineHeight:1.5}}>{text}</span></div>);
  const stepStyle={display:'flex',gap:12,padding:14,background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)',marginBottom:10};
  const numStyle={width:26,height:26,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0,marginTop:1};
  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:560}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><h3 style={{fontSize:17,fontWeight:600}}>Set Up Out of Office</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
    <div style={{padding:'10px 14px',background:'var(--accent-light)',border:'1px solid var(--accent-border)',borderRadius:8,marginBottom:14,fontSize:13}}><strong>{name}</strong> &nbsp;·&nbsp; {sorted.length} day{sorted.length>1?'s':''} &nbsp;·&nbsp; Returns <strong>{returnStr}</strong></div>
    <div style={stepStyle}><div style={numStyle}>1</div><div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Open Outlook Automatic Replies</div>
      <button className={'btn btn-sm '+(opened?'btn-secondary':'btn-primary')} onClick={handleOpen} style={{marginBottom:10}}>{opened?'Opened — switch to that tab':'Open Automatic Replies ↗'}</button>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'4px 12px'}}>
        {checkItem(false,<>Toggle <strong>Turn on automatic replies</strong> → <strong>On</strong></>)}
        {checkItem(false,<>Check <strong>"Send replies only during a time period"</strong></>)}
        {checkItem(false,<>Start: <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'var(--accent)'}}>{startDateStr}</span></>)}
        {checkItem(false,<>End: <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'var(--accent)'}}>{endDateStr}</span></>)}
        {checkItem(false,<>Paste message from Step 2 → <strong>Save</strong></>)}
      </div>
    </div></div>
    <div style={stepStyle}><div style={numStyle}>2</div><div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>Copy Auto-Reply Message</div>
      <div style={{background:'var(--input-bg)',border:'1px solid var(--border)',borderRadius:8,padding:10,fontSize:12,lineHeight:1.65,whiteSpace:'pre-wrap',color:'var(--text)',maxHeight:170,overflowY:'auto',marginBottom:8}}>{autoReply}</div>
      <button className={'btn btn-sm '+(copied?'btn-secondary':'btn-primary')} onClick={handleCopy}>{copied?'✓ Copied!':'Copy Message'}</button>
    </div></div>
    <div style={{display:'flex',justifyContent:'flex-end',marginTop:4}}><button className="btn btn-secondary" onClick={onClose}>Done</button></div>
  </div></div>);
}

function UserPickerModal({names,selected,onClose,onApply}){

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h3 style={{fontSize:16,fontWeight:600}}>Select Members</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>

  </div></div>);
}

  const[dateTypes,setDateTypes]=useState(()=>editData&&editData.dateTypes?{...editData.dateTypes}:{});

  const[rangeEnd,setRangeEnd]=useState('');

  const[saveErr,setSaveErr]=useState('');
  const[editFilter,setEditFilter]=useState({date:'',project:''});

  const setDateType=(dateStr,val)=>setDateTypes(dt=>{
    const n={...dt};
    if(!val||val===type)delete n[dateStr]; // if same as default, no need to store
    else n[dateStr]=val;
    return n;
  });

  // Compute effective type for a date
  const effectiveType=(dateStr)=>dateTypes[dateStr]||type;

  // Auto-update the overall type badge when dates have mixed types
  const uniqueTypes=useMemo(()=>{
    if(dates.length===0)return new Set([type]);
    const s=new Set(dates.map(d=>dateTypes[d]||type));
    return s;
  },[dates,dateTypes,type]);
  const displayType=uniqueTypes.size>1?'Mixed':[...uniqueTypes][0]||type;

  const setHalfDay=(dateStr,val)=>setHalfDays(hd=>{
    const n={...hd};
    if(val==='full'||!val)delete n[dateStr];
    else n[dateStr]=val;
    return n;
  });

  // noCalls: set of dateStrs where user says no customer calls
  const[noCalls,setNoCalls]=useState(()=>{
    // On edit, restore from backup entries tagged __NO_CALLS__
    if(!(editData&&editData.backup))return new Set();
    const s=new Set();
    editData.backup.split('\n').forEach(line=>{
      const m=line.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*__NO_CALLS__/);
      if(m)s.add(m[1]);
    });
    return s;
  });

  // Load previous entries from editData, filtering out __NO_CALLS__ sentinels
  const parseInitialEntries=()=>{
    if(!(editData&&editData.backup))return[];
    return parseProjectEntries(editData.backup)
      .filter(p=>p.project!=='__NO_CALLS__')
      .map(p=>({...p,newPerson:'',showPicker:false,pickerQ:''}));
  };
  const[entries,setEntries]=useState(parseInitialEntries);

  // previousEntries: all historical entries for this user across all saved data
  // so user can reuse/edit old project info for new leave dates
  const previousEntries=useMemo(()=>{
    if(!allUserData)return[];
    const myRecord=allUserData.find(m=>m.name.toLowerCase()===name.toLowerCase());
    if(!myRecord||!myRecord.backup)return[];
    return parseProjectEntries(myRecord.backup).filter(p=>p.project&&p.project!=='__NO_CALLS__');
  },[allUserData,name]);

  const weekdays=useMemo(()=>dates.filter(isWeekday).sort(),[dates]);

  // ── Validation: each weekday must have either noCalls OR ≥1 project entry ──
  const dayStatus=useMemo(()=>{
    const s={};
    weekdays.forEach(d=>{
      if(noCalls.has(d)){s[d]='no_calls';return}
      const hasProject=entries.some(e=>e.date===d&&(e.project.trim()||e.persons.length>0));
      s[d]=hasProject?'has_projects':'pending';
    });
    return s;
  },[weekdays,noCalls,entries]);

  const allDaysDone=weekdays.length===0||weekdays.every(d=>dayStatus[d]!=='pending');
  const pendingDays=weekdays.filter(d=>dayStatus[d]==='pending');

  const toggleNoCalls=(dateStr)=>{
    setNoCalls(prev=>{
      const n=new Set(prev);
      if(n.has(dateStr)){n.delete(dateStr)}
      else{
        n.add(dateStr);
        setEntries(e=>e.filter(en=>en.date!==dateStr));
        // Auto-advance: find next pending weekday and focus it
        setTimeout(()=>{
          const nextPending=weekdays.find(d=>d>dateStr&&!n.has(d)&&!entries.some(e=>e.date===d&&(e.project.trim()||e.persons.length>0)));
          if(nextPending)setEditFilter(f=>({...f,date:nextPending}));
        },50);
      }
      return n;
    });
  };

  // ── Date range validation ──
  const handleRangeStartChange=v=>{
    setRangeStart(v);setRangeErr('');
    if(rangeEnd&&v&&rangeEnd<v){setRangeEnd('');setRangeErr('End date was before start — please re-select')}
  };
  const handleRangeEndChange=v=>{
    setRangeEnd(v);setRangeErr('');
    if(rangeStart&&v&&v<rangeStart){setRangeErr('End date must be on or after start date');setRangeEnd('')}
  };
  const applyRange=()=>{
    if(!rangeStart||!rangeEnd){setRangeErr('Select both start and end dates');return}
    if(rangeEnd<rangeStart){setRangeErr('End date must be on or after start date');return}
    const allInRange=expandDateRange(rangeStart,rangeEnd);
    const newDates=new Set(dates);allInRange.forEach(d=>newDates.add(d));
    setDates([...newDates].sort());setRangeStart('');setRangeEnd('');setRangeErr('');
  };
  const rangePreviewDays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?expandDateRange(rangeStart,rangeEnd).length:0;
  const rangePreviewWeekdays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?getWeekdaysInRange(rangeStart,rangeEnd).length:0;

  // ── Entry management ──
  const updateEntry=(idx,field,val)=>setEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val}:x));
  const removeEntry=idx=>setEntries(e=>e.filter((_,i)=>i!==idx));
  const addPersonToEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx)return x;if(x.persons.includes(person))return x;return{...x,persons:[...x.persons,person],showPicker:false,pickerQ:''}}))};
  const removePersonFromEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>i===idx?{...x,persons:x.persons.filter(p=>p!==person)}:x))};
  const addNewPersonToEntry=(idx)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx||!x.newPerson.trim())return x;const np=x.newPerson.trim();if(x.persons.includes(np))return{...x,newPerson:''};return{...x,persons:[...x.persons,np],newPerson:''}}))};

  const addEntryForDay=(dateStr)=>{
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setEntries(e=>[...e,{date:dateStr,project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  };
  // Copy a previous entry into a specific day (pre-fill)
  const copyPrevEntryToDay=(dateStr,prev)=>{
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setEntries(e=>[...e,{date:dateStr,project:prev.project,persons:[...prev.persons],newPerson:'',agenda:prev.agenda||'',showPicker:false,pickerQ:''}]);
  };
  const addBlankEntry=()=>setEntries(e=>[...e,{date:'',project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  const deleteDateEntry=(dateStr)=>{
    setDates(ds=>ds.filter(d=>d!==dateStr));
    setEntries(e=>e.filter(en=>en.date!==dateStr));
    setNoCalls(s=>{const n=new Set(s);n.delete(dateStr);return n});
    setHalfDays(hd=>{const n={...hd};delete n[dateStr];return n});
    setDateTypes(dt=>{const n={...dt};delete n[dateStr];return n});
  };

  const filteredEntries=useMemo(()=>{
    let e=entries;
    if(editFilter.date)e=e.filter(x=>x.date===editFilter.date);
    if(editFilter.project)e=e.filter(x=>x.project.toLowerCase().includes(editFilter.project.toLowerCase()));
    return e;
  },[entries,editFilter]);

  // ── Build backup string — includes __NO_CALLS__ sentinels ──
  const buildFinalBackup=()=>{
    const lines=[];
    // No-calls sentinels (sorted)
    [...noCalls].sort().forEach(d=>lines.push('['+d+'] __NO_CALLS__'));
    // Regular project entries
    entries.filter(e=>e.project||e.persons.length>0).forEach(e=>{
      let s='';
      if(e.date)s+='['+e.date+'] ';
      if(e.project){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
      else if(e.persons.length>0)s+=e.persons.join(', ');
      if(e.agenda)s+=' | Agenda: '+e.agenda;
      lines.push(s);
    });
    return lines.join('\n');
  };

  // ── Save with validation ──
  const handleSave=()=>{
    if(!name.trim())return;
    setSaveErr('');
    if(weekdays.length>0&&!allDaysDone){
      const missing=pendingDays.map(fmtDate).join(', ');
      setSaveErr('Each weekday needs project info or "No customer calls": '+missing);
      setTab('projects');
      return;
    }
    onSave({name:name.trim(),type:displayType,dates,backup:buildFinalBackup(),halfDays,dateTypes});
  };

  const lbl={fontSize:12,color:'var(--text2)',marginBottom:4,display:'block',fontWeight:500};
  const subLbl={fontSize:11,color:'var(--text3)',marginBottom:3,display:'block'};

  // Status dot for tab indicator
  const projectTabStatus=weekdays.length===0?'ok':allDaysDone?'ok':'warn';

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:660}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <h3 style={{fontSize:17,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3>
      <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
    </div>

    {editData&&<div style={{fontSize:12,color:'var(--text2)',marginBottom:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>Editing leave for <strong>{editData.name}</strong> — you can also edit previous project agenda below.</div>}
    <div style={{marginBottom:14,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',fontSize:14,fontWeight:600}}>{name||userName||'You'}</div>

    <label style={lbl}>Default Leave Type <span style={{fontSize:10.5,color:'var(--text3)',fontWeight:400}}>(applies to all dates — override per date below)</span></label>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
      {['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(<button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'var(--accent-light)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>{t}</button>))}
      {uniqueTypes.size>1&&<span style={{fontSize:11,color:'var(--amber)',marginLeft:4}}>⚠ Mixed — dates have different types</span>}
    </div>

    {/* Tab switcher with completion status */}
    <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)',marginBottom:14}}>
      {[
        {k:'dates',label:'📅 Leave Dates',badge:dates.length>0?dates.length:null,color:'var(--accent)'},
        {k:'projects',label:'📋 Projects & Backup',badge:weekdays.length>0?(allDaysDone?'✓':pendingDays.length+' pending'):null,color:allDaysDone?'var(--green)':'var(--amber)'}
      ].map(t=>(
        <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:'6px 10px',borderRadius:6,fontSize:12.5,fontWeight:500,border:'none',background:tab===t.k?'var(--accent)':'transparent',color:tab===t.k?'#fff':'var(--text2)',cursor:'pointer',transition:'all .15s',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
          {t.label}
          {t.badge!==null&&<span style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:999,background:tab===t.k?'rgba(255,255,255,.25)':t.color,color:tab===t.k?'#fff':'#fff',minWidth:18,textAlign:'center'}}>{t.badge}</span>}
        </button>
      ))}
    </div>

    {/* ══ TAB: DATES ══ */}
    {tab==='dates'&&<div>
      <div style={{marginBottom:10,padding:'12px',background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)'}}>
        <label style={{...lbl,marginBottom:8}}>Add Date Range</label>
        <div style={{display:'flex',gap:6,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>Start date</div>
            <input type="date" className={'input'+(rangeErr&&!rangeStart?' input-error':'')} value={rangeStart} onChange={e=>handleRangeStartChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:22,color:'var(--text3)',fontSize:13,flexShrink:0}}>→</div>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>End date{rangeStart&&<span style={{color:'var(--accent)'}}> (≥ {fmtDate(rangeStart)})</span>}</div>
            <input type="date" className={'input'+(rangeErr?' input-error':'')} value={rangeEnd} min={rangeStart||undefined} onChange={e=>handleRangeEndChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:20,flexShrink:0}}><button className="btn btn-sm btn-primary" onClick={applyRange} disabled={!rangeStart||!rangeEnd}>Add</button></div>
        </div>
        {rangeErr&&<div className="date-validation-hint">⚠ {rangeErr}</div>}
        {!rangeErr&&rangePreviewDays>0&&<div style={{fontSize:11,color:'var(--text2)',marginTop:5}}>{rangePreviewDays} days ({rangePreviewWeekdays} weekdays)</div>}
      </div>

      <div style={{display:'flex',gap:8,marginBottom:8}}>
        <input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}}/>
        <button className="btn btn-sm btn-secondary" onClick={()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}>+ Single</button>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:11.5,color:'var(--text2)',fontWeight:500}}>{dates.length} date{dates.length!==1?'s':''} · {weekdays.length} weekday{weekdays.length!==1?'s':''} · <span style={{color:'var(--accent)'}}>{countLeaveDays(dates,halfDays)} leave day{countLeaveDays(dates,halfDays)!==1?'s':''}</span></span>
        {dates.length>0&&<button className="btn btn-sm btn-danger" onClick={()=>{setDates([]);setEntries([]);setNoCalls(new Set());setHalfDays({});setDateTypes({})}} style={{fontSize:10,padding:'2px 8px'}}>Clear all</button>}
      </div>

      {dates.length===0
        ?<div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginBottom:10,padding:'8px 0'}}>No dates added yet</div>
        :<div style={{display:'flex',flexDirection:'column',gap:3,marginBottom:10}}>
          {/* Column headers */}
          <div style={{display:'grid',gridTemplateColumns:'90px 1fr 1fr 24px',gap:6,padding:'2px 6px'}}>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>Date</div>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>Leave Type</div>
            <div style={{fontSize:10,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>Half Day</div>
            <div/>
          </div>
          {dates.map(d=>{
            const halfVal=halfDays[d]||'full';
            const dt=dateTypes[d]||type;
            const typeColors={PTO:'var(--indigo)',Sick:'var(--red)','Business Travel':'var(--cyan)',Mixed:'var(--amber)',Other:'var(--pink)'};
            const typeBg={PTO:'var(--indigo-bg)',Sick:'var(--red-bg)','Business Travel':'rgba(12,133,153,.08)',Mixed:'var(--amber-bg)',Other:'rgba(194,37,92,.08)'};
            const isWd=isWeekday(d);
            return(<div key={d} style={{display:'grid',gridTemplateColumns:'90px 1fr 1fr 24px',gap:6,alignItems:'center',padding:'5px 6px',background:'var(--surface2)',borderRadius:7,border:'1px solid var(--border)'}}>
              {/* Date */}
              <div>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11.5,color:isToday(d)?'var(--red)':'var(--accent)',fontWeight:600}}>{fmtDate(d)}</span>
                {!isWd&&<span style={{fontSize:9,color:'var(--text3)',marginLeft:4}}>wknd</span>}
              </div>
              {/* Leave Type — pill selector */}
              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {[['PTO','PTO'],['Sick','Sick'],['BT','Business Travel'],['Mix','Mixed'],['Other','Other']].map(([label,val])=>{
                  const isActive=dt===val;
                  return(<button key={val} onClick={()=>setDateType(d,val)}
                    style={{padding:'2px 7px',borderRadius:999,fontSize:10,fontWeight:500,border:'1px solid',cursor:'pointer',transition:'all .1s',whiteSpace:'nowrap',
                      borderColor:isActive?typeColors[val]:'var(--border)',
                      background:isActive?typeBg[val]:'transparent',
                      color:isActive?typeColors[val]:'var(--text3)'}}>
                    {label}
                  </button>);
                })}
              </div>
              {/* Half Day — only for weekdays */}
              <div style={{display:'flex',gap:3}}>
                {isWd?['full','first','second'].map(v=>(
                  <button key={v} onClick={()=>setHalfDay(d,v)}
                    style={{padding:'2px 7px',borderRadius:6,fontSize:10,fontWeight:500,border:'1px solid',cursor:'pointer',transition:'all .1s',
                      borderColor:halfVal===v?'var(--accent)':'var(--border)',
                      background:halfVal===v?'var(--accent)':'transparent',
                      color:halfVal===v?'#fff':'var(--text3)'}}>
                    {v==='full'?'Full':v==='first'?'½ AM':'½ PM'}
                  </button>
                )):<span style={{fontSize:10,color:'var(--text3)',fontStyle:'italic'}}>—</span>}
              </div>
              {/* Delete */}
              <button onClick={()=>deleteDateEntry(d)}
                style={{width:22,height:22,borderRadius:4,border:'none',background:'transparent',color:'var(--text3)',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',padding:0}}
                title="Remove date">×</button>
            </div>);
          })}
          {Object.values(halfDays).some(v=>v&&v!=='full')&&<div style={{fontSize:11,color:'var(--amber)',padding:'2px 6px'}}>
            ⚠ Half-days count as 0.5. Total: <strong>{countLeaveDays(dates,halfDays)} leave days</strong>
          </div>}
        </div>}

      {weekdays.length>0&&<div style={{display:'flex',alignItems:'center',gap:6,fontSize:11}}>
        <span style={{color:'var(--green)'}}>✓ {weekdays.length} weekday{weekdays.length!==1?'s':''} selected</span>
        <button className="btn btn-sm btn-secondary" onClick={()=>setTab('projects')} style={{fontSize:11,padding:'2px 10px',marginLeft:4}}>Go to Projects →</button>
      </div>}
    </div>}

    {/* ══ TAB: PROJECTS ══ */}
    {tab==='projects'&&<div>
      {weekdays.length===0&&<div style={{padding:16,background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',textAlign:'center',marginBottom:12}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:4}}>No weekdays selected yet</div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:10}}>Add leave dates first, then assign projects per day.</div>
        <button className="btn btn-sm btn-secondary" onClick={()=>setTab('dates')}>← Go to Dates</button>
      </div>}

      {weekdays.length>0&&<div>
        {/* Mandatory-fill notice */}
        {!allDaysDone&&<div style={{padding:'10px 12px',background:'var(--amber-bg)',border:'1px solid rgba(230,119,0,.25)',borderRadius:8,marginBottom:12,fontSize:12,color:'var(--amber)',display:'flex',alignItems:'flex-start',gap:8}}>
          <span style={{fontSize:15,flexShrink:0}}>⚠</span>
          <div><strong>Required for all weekdays:</strong> Add at least one project entry, or check "No customer calls on this date" for each day before saving.</div>
        </div>}
        {allDaysDone&&<div style={{padding:'8px 12px',background:'var(--green-bg)',border:'1px solid rgba(43,138,62,.25)',borderRadius:8,marginBottom:12,fontSize:12,color:'var(--green)',display:'flex',alignItems:'center',gap:6}}>
          ✓ All {weekdays.length} weekday{weekdays.length!==1?'s':''} accounted for — ready to save.
        </div>}

        {/* Filter bar */}
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <select className="input" value={editFilter.date} onChange={e=>setEditFilter(f=>({...f,date:e.target.value}))} style={{flex:1,fontSize:12,padding:'5px 28px 5px 10px'}}>
            <option value="">All dates</option>
            {weekdays.map(d=><option key={d} value={d}>{fmtDate(d)} {dayStatus[d]==='no_calls'?'(no calls)':dayStatus[d]==='has_projects'?'✓':'⚠'}</option>)}
          </select>
          <input className="input" placeholder="Filter by project..." value={editFilter.project} onChange={e=>setEditFilter(f=>({...f,project:e.target.value}))} style={{flex:1,fontSize:12}}/>
          {(editFilter.date||editFilter.project)&&<button className="btn btn-sm btn-secondary" onClick={()=>setEditFilter({date:'',project:''})} style={{fontSize:11}}>Clear</button>}
        </div>

        {/* Previous entries reuse panel (shown when there's historical data and this is a new leave) */}
        {previousEntries.length>0&&!editFilter.date&&!editFilter.project&&<div style={{marginBottom:12,padding:'10px 12px',background:'var(--indigo-bg)',border:'1px solid rgba(92,71,224,.18)',borderRadius:10}}>
          <div style={{fontSize:11.5,fontWeight:600,color:'var(--indigo)',marginBottom:8}}>📂 Your previous project entries — click to reuse on a date</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {previousEntries.slice(0,8).map((p,pi)=>(
              <div key={pi} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'5px 10px',fontSize:11.5,cursor:'default',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontWeight:500,color:'var(--text)'}}>{p.project}</span>
                {p.persons.length>0&&<span style={{color:'var(--text3)'}}>→ {p.persons.join(', ')}</span>}
                {weekdays.filter(d=>dayStatus[d]==='pending').length>0&&<select
                  onChange={e=>{if(e.target.value){copyPrevEntryToDay(e.target.value,p);e.target.value=''}}}
                  style={{fontSize:10,padding:'2px 4px',borderRadius:5,border:'1px solid var(--border)',background:'var(--accent)',color:'#fff',cursor:'pointer'}}
                >
                  <option value="">+ Add to day</option>
                  {weekdays.filter(d=>dayStatus[d]==='pending').map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}
                </select>}
              </div>
            ))}
          </div>
        </div>}

        {/* One card per weekday */}
        {weekdays.filter(d=>!editFilter.date||d===editFilter.date).map(dayStr=>{
          const status=dayStatus[dayStr];
          const isNoCallsDay=noCalls.has(dayStr);
          const dayEntries=entries.map((e,i)=>({...e,_idx:i})).filter(e=>e.date===dayStr&&(!editFilter.project||e.project.toLowerCase().includes(editFilter.project.toLowerCase())));

          const statusColor=status==='no_calls'?'var(--cyan)':status==='has_projects'?'var(--green)':'var(--amber)';
          const statusIcon=status==='no_calls'?'📵':status==='has_projects'?'✓':'⚠';

          return(<div key={dayStr} className="day-entry-card" style={{borderColor:status==='pending'?'rgba(230,119,0,.35)':status==='has_projects'?'rgba(43,138,62,.3)':'rgba(12,133,153,.3)'}}>
            <div className="day-entry-header">
              <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}}>
                <span className="day-label">{fmtDate(dayStr)}</span>
                <span style={{fontSize:11,color:'var(--text3)'}}>{new Date(dayStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'})}</span>

              </div>

                <div style={{display:'flex',gap:8,marginBottom:6}}>
                  <div style={{flex:1}}>
                    <label style={subLbl}>Project Name <span style={{color:'var(--red)'}}>*</span></label>

                  </div>
                  <button className="btn-icon" onClick={()=>removeEntry(idx)} style={{width:26,height:26,color:'var(--red)',marginTop:17,flexShrink:0}}><Icon name="trash" size={12}/></button>
                </div>
                <label style={subLbl}>Backup Person(s)</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6,minHeight:26}}>
                  {entry.persons.map(p=>(<span key={p} className="chip chip-future" style={{fontSize:11}}>{p} <span style={{cursor:'pointer',marginLeft:2,opacity:.6}} onClick={()=>removePersonFromEntry(idx,p)}>×</span></span>))}
                  <button className="btn btn-sm btn-secondary" onClick={()=>updateEntry(idx,'showPicker',!entry.showPicker)} style={{fontSize:11,padding:'2px 8px',borderRadius:999}}><Icon name="plus" size={11}/> {entry.showPicker?'Close':'Add'}</button>
                </div>
                {entry.showPicker&&<div className="fade-in" style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:8,marginBottom:8}}>
                  <input className="input" placeholder="Search team members..." value={entry.pickerQ} onChange={e=>updateEntry(idx,'pickerQ',e.target.value)} style={{fontSize:12,marginBottom:6,padding:'5px 10px'}}/>
                  <div style={{maxHeight:100,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
                    {existingNames.filter(n=>!entry.persons.includes(n)&&(!entry.pickerQ||n.toLowerCase().includes(entry.pickerQ.toLowerCase()))).map(n=>(
                      <div key={n} onClick={()=>addPersonToEntry(idx,n)} style={{padding:'4px 8px',borderRadius:4,fontSize:12,cursor:'pointer'}} onMouseOver={e=>e.currentTarget.style.background='var(--accent-light)'} onMouseOut={e=>e.currentTarget.style.background='transparent'}>{n}</div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:6,marginTop:6,borderTop:'1px solid var(--border)',paddingTop:6}}>
                    <input className="input" placeholder="Or type new name..." value={entry.newPerson} onChange={e=>updateEntry(idx,'newPerson',e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNewPersonToEntry(idx)} style={{fontSize:12,padding:'4px 8px',flex:1}}/>
                    <button className="btn btn-sm btn-primary" onClick={()=>addNewPersonToEntry(idx)} style={{fontSize:11,padding:'3px 10px'}}>Add</button>
                  </div>

                <textarea className="input" placeholder="Meeting agenda, handoff notes, updates..." value={entry.agenda} onChange={e=>updateEntry(idx,'agenda',e.target.value)} style={{fontSize:12.5,minHeight:52,resize:'vertical',lineHeight:1.5}}/>
              </div>);
            })}

            {/* Always show "Add Project" button — even when no-calls is checked (for updates) */}
            <button className="btn btn-sm btn-secondary" onClick={()=>addEntryForDay(dayStr)} style={{fontSize:11,padding:'4px 10px',marginTop:8,width:'100%'}}>
              <Icon name="plus" size={11}/> {isNoCallsDay?'Add project update anyway':'Add Project'}
            </button>
          </div>);
        })}

        {/* Bottom hint: next pending day quick-jump */}
        {weekdays.filter(d=>dayStatus[d]==='pending').length>0&&!editFilter.date&&(
          <div style={{marginTop:10,padding:'10px 14px',background:'var(--amber-bg)',border:'1px solid rgba(230,119,0,.25)',borderRadius:8,fontSize:12,color:'var(--amber)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
            <span>⚠ {weekdays.filter(d=>dayStatus[d]==='pending').length} day{weekdays.filter(d=>dayStatus[d]==='pending').length!==1?'s':''} still need info</span>
            <button className="btn btn-sm" onClick={()=>setEditFilter(f=>({...f,date:weekdays.find(d=>dayStatus[d]==='pending')||''}))} style={{background:'var(--amber)',color:'#fff',border:'none',fontSize:11}}>
              Jump to next →
            </button>
          </div>
        )}
      </div>}
    </div>}

    {/* Footer */}
    {saveErr&&<div style={{padding:'8px 12px',background:'var(--red-bg)',border:'1px solid var(--red-border)',borderRadius:8,fontSize:12,color:'var(--red)',marginTop:10}}>⚠ {saveErr}</div>}
    <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'space-between',alignItems:'center'}}>
      <div style={{fontSize:11.5,color:'var(--text3)'}}>{dates.length} date{dates.length!==1?'s':''} · {countLeaveDays(dates,halfDays)} leave day{countLeaveDays(dates,halfDays)!==1?'s':''} · {noCalls.size} no-call · {entries.filter(e=>e.project||e.persons.length>0).length} entries</div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={handleSave} title={!allDaysDone&&weekdays.length>0?'Complete all weekdays first':''}>
          {editData?'Update':'Save'}
        </button>
      </div>
    </div>
  </div></div>);
}

-- Run this in Supabase → SQL Editor → paste → Run

ALTER TABLE lt_leaves DISABLE ROW LEVEL SECURITY;

-- Option B: keep RLS but allow anon access (use ONE of the two options above)
-- ALTER TABLE lt_leaves ENABLE ROW LEVEL SECURITY;
-- DROP POLICY IF EXISTS "allow_all" ON lt_leaves;
-- CREATE POLICY "allow_all" ON lt_leaves FOR ALL TO anon USING (true) WITH CHECK (true);`;

      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <a href={supabaseUrl} target="_blank" rel="noreferrer"

        <button className="btn btn-secondary" onClick={onClose}>Close</button>
        <button className="btn btn-primary" onClick={()=>{onClose();window.location.reload()}}>Refresh App</button>
      </div>

}

  // Build URL with SQL pre-filled for Supabase SQL editor
  const supabaseUrl='https://supabase.com/dashboard/project/wplarfdgdwhbbtjrgjrw/sql/new?query='+encodeURIComponent(sql);
  const copy=()=>{navigator.clipboard.writeText(sql).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500)})};

  if(done){
