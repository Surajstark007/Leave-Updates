// ─── HELPERS ───
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDate=s=>{if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmtDate=ds=>{const d=parseDate(ds);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'?'};
const fmtDateFull=ds=>{const d=parseDate(ds);return d?d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'?'};
const isToday=ds=>ds===todayStr();

const isWeekday=ds=>{const d=parseDate(ds);if(!d)return false;return d.getDay()!==0&&d.getDay()!==6};
function getWeekRange(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return[f(mon),f(sun)]}

function getWeekdaysInRange(start,end){return expandDateRange(start,end).filter(isWeekday)}
function groupConsecutiveDates(dates){
  const sorted=[...dates].sort();if(sorted.length===0)return[];
  const ranges=[];let rangeStart=sorted[0];let rangePrev=sorted[0];
  for(let i=1;i<sorted.length;i++){
    const prev=new Date(rangePrev+'T00:00:00');const cur=new Date(sorted[i]+'T00:00:00');
    let expected=new Date(prev);expected.setDate(expected.getDate()+1);
    while(expected.getDay()===0||expected.getDay()===6)expected.setDate(expected.getDate()+1);
    const diffDays=Math.round((cur-prev)/(1000*60*60*24));
    if(diffDays<=1||(cur.getTime()===expected.getTime())){rangePrev=sorted[i]}
    else{ranges.push({start:rangeStart,end:rangePrev});rangeStart=sorted[i];rangePrev=sorted[i]}
  }
  ranges.push({start:rangeStart,end:rangePrev});return ranges;
}
function getNextWorkingDay(dateStr){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d}

// ─── DATA PARSING ───
function parseDatesFromCell(raw){
  if(!raw||!raw.trim())return[];const dates=new Set();const year=new Date().getFullYear();
  [...raw.matchAll(/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g)].forEach(m=>dates.add(m[1]));
  let rm;
  const rp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s*[-\u2013]\s*!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=rp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const tp=/!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)\s+to\s+!\[\]\(slack_date:(\d{4}-\d{2}-\d{2})\)/g;
  while((rm=tp.exec(raw))!==null)expandDateRange(rm[1],rm[2]).forEach(d=>dates.add(d));
  const mm={january:'01',jan:'01',february:'02',feb:'02',march:'03',mar:'03',april:'04',apr:'04',may:'05',june:'06',jun:'06',july:'07',jul:'07',august:'08',aug:'08',september:'09',sep:'09',october:'10',oct:'10',november:'11',nov:'11',december:'12',dec:'12'};
  let cl=raw.replace(/!\[\]\(slack_date:\d{4}-\d{2}-\d{2}\)/g,'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\*\*/g,'');
  const mrp=/(\w+)\s+(\d{1,2})\s*(?:st|nd|rd|th)?\s*[-\u2013]\s*(?:(\w+)\s+)?(\d{1,2})(?:st|nd|rd|th)?/gi;
  while((rm=mrp.exec(cl))!==null){const m1=mm[rm[1].toLowerCase()];const m2=rm[3]?mm[rm[3].toLowerCase()]:m1;if(m1&&m2)expandDateRange(year+'-'+m1+'-'+String(rm[2]).padStart(2,'0'),year+'-'+m2+'-'+String(rm[4]).padStart(2,'0')).forEach(d=>dates.add(d))}
  const mdp=/\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sep|october|oct|november|nov|december|dec)\s+(\d{1,2})(?:st|nd|rd|th)?\b/gi;
  while((rm=mdp.exec(cl))!==null){const mn=mm[rm[1].toLowerCase()];if(mn)dates.add(year+'-'+mn+'-'+String(rm[2]).padStart(2,'0'))}
  const ur=/(\d{2})\/(\d{2})\/(\d{4})\s*to\s*(\d{2})\/(\d{2})\/(\d{4})/g;
  while((rm=ur.exec(cl))!==null)expandDateRange(rm[3]+'-'+rm[1]+'-'+rm[2],rm[6]+'-'+rm[4]+'-'+rm[5]).forEach(d=>dates.add(d));
  return[...dates].filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/)).sort();
}
function cleanBackup(raw){if(!raw)return'';return raw.replace(/<@(\w+)>/g,(_,u)=>SU[u]||u).replace(/<br\s*\/?>/gi,'\n').replace(/!\[\]\(@\w+\)/g,'').replace(/\*\*/g,'').replace(/\\/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim()}
function detectLeaveType(dc){if(!dc)return'PTO';const t=dc.toLowerCase();if(t.includes('sick')&&t.includes('planned'))return'Mixed';if(t.includes('sick'))return'Sick';if(t.includes('business travel'))return'Business Travel';return'PTO'}
function parseCanvasMarkdown(md){
  const lines=md.split('\n');const members=[];let hp=false;
  for(const line of lines){const tr=line.trim();if(!tr.startsWith('|'))continue;
    const cells=tr.split('|').map(c=>c.trim());if(cells[0]==='')cells.shift();if(cells[cells.length-1]==='')cells.pop();if(cells.length<2)continue;
    if(cells[0]==='Name'||cells[0].match(/^[\s-]+$/)){hp=true;continue}
    if(cells.every(c=>c.match(/^[\s-]*$/))){hp=true;continue}
    if(!hp&&cells[0].includes('---')){hp=true;continue}
    const name=cells[0].replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(!name)continue;
    const dateCell=cells[1]||'';const backupCell=cells[2]||'';
    const fd=parseDatesFromCell(dateCell).filter(isFuture).sort();
    const type=detectLeaveType(dateCell);const backup=cleanBackup(backupCell);

    if(ex){const mg=new Set([...ex.dates,...fd]);ex.dates=[...mg].sort();if(backup&&!ex.backup.includes(backup))ex.backup=ex.backup?ex.backup+'\n'+backup:backup;continue}
    members.push({name,dates:fd,backup,type,raw:dateCell});

function parseProjectEntries(backupStr){
  if(!backupStr)return[];
  return backupStr.split('\n').filter(l=>l.trim()).map(line=>{
    let project='',personStr='',agenda='',date='';
    const dateMatch=line.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*/);
    if(dateMatch){date=dateMatch[1];line=line.slice(dateMatch[0].length)}
    const pipeParts=line.split('|').map(s=>s.trim());
    const mainPart=pipeParts[0]||'';
    agenda=(pipeParts[1]||'').replace(/^Agenda:\s*/i,'');
    const dashIdx=mainPart.indexOf(' - ');
    if(dashIdx>-1){project=mainPart.substring(0,dashIdx).trim();personStr=mainPart.substring(dashIdx+3).trim()}
    else{const colonIdx=mainPart.indexOf(':');if(colonIdx>-1){project=mainPart.substring(0,colonIdx).trim();personStr=mainPart.substring(colonIdx+1).trim()}else personStr=mainPart}
    const persons=personStr?personStr.split(/\s*,\s*/).filter(Boolean):[];
    return{date,project,persons,agenda};
  }).filter(p=>p.project||p.persons.length>0);
}
function buildBackupString(entries){
  return entries.filter(e=>e.project||e.persons.length>0).map(e=>{
    let s='';
    if(e.date)s+='['+e.date+'] ';
    if(e.project){s+=e.project;if(e.persons.length>0)s+=' - '+e.persons.join(', ')}
    else if(e.persons.length>0)s+=e.persons.join(', ');
    if(e.agenda)s+=' | Agenda: '+e.agenda;
    return s;
  }).join('\n');
}

}

    return fetch(SB_URL+'/rest/v1/lt_leaves?id=eq.'+existingData[0].id,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({type:entry.type,dates:JSON.stringify(entry.dates),backup:entry.backup,updated_at:new Date().toISOString(),added_by:addedBy})});
  }
  return fetch(SB_URL+'/rest/v1/lt_leaves',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({name:entry.name,type:entry.type,dates:JSON.stringify(entry.dates),backup:entry.backup,added_by:addedBy})});
}
async function softDeleteLeave(name){
  return fetch(SB_URL+'/rest/v1/lt_leaves?name=ilike.'+encodeURIComponent(name)+'&deleted=eq.false',{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({deleted:true,updated_at:new Date().toISOString()})});
}
function mergeCanvasAndUserLeaves(canvasMembers,userLeaves){
  const merged=[...canvasMembers];const deletedNames=new Set();
  for(const ul of userLeaves){
    if(ul.deleted){deletedNames.add(ul.name.toLowerCase());continue}
    let dates=[];try{dates=typeof ul.dates==='string'?JSON.parse(ul.dates):ul.dates||[]}catch{dates=[]}
    const idx=merged.findIndex(m=>m.name.toLowerCase()===ul.name.toLowerCase());
    if(idx>=0){const existingDates=new Set(merged[idx].dates);dates.forEach(d=>existingDates.add(d));merged[idx]={...merged[idx],dates:[...existingDates].filter(d=>d>=todayStr()).sort(),backup:ul.backup||merged[idx].backup,type:ul.type||merged[idx].type}}
    else{merged.push({name:ul.name,dates:dates.filter(d=>d>=todayStr()).sort(),backup:ul.backup||'',type:ul.type||'PTO',raw:''})}
  }
  return merged.filter(m=>!deletedNames.has(m.name.toLowerCase()));
}
async function sbFetch(path,opts={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function logAction(email,name,action){return sbFetch('lt_user_logs',{method:'POST',body:JSON.stringify({email,name,action,last_activity:new Date().toISOString()})})}
async function findUser(email){const d=await sbFetch('lt_user_logs?email=eq.'+encodeURIComponent(email)+'&action=eq.register&order=created_at.desc&limit=1');return d&&d.length>0?d[0]:null}

function buildCsvContent(members){
  const csvEscape=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['Employee Name','Leave Type','Leave Date Range','Total Leave Days','Leave Dates (all)','Project Date','Project Name','Backup Owner(s)','Agenda / Notes']];
  for(const m of members){
    const ranges=groupConsecutiveDates(m.dates);
    const dateRangeStr=ranges.map(r=>r.start===r.end?fmtDate(r.start):fmtDate(r.start)+' – '+fmtDate(r.end)).join(' | ');
    const allDates=m.dates.map(fmtDate).join(', ');
    const projects=parseProjectEntries(m.backup||'');
    if(projects.length===0){
      rows.push([m.name,m.type,dateRangeStr,m.dates.length,allDates,'','','','']);
    } else {
      projects.forEach((p,pi)=>{
        rows.push([
          pi===0?m.name:'',pi===0?m.type:'',pi===0?dateRangeStr:'',pi===0?m.dates.length:'',pi===0?allDates:'',
          p.date?fmtDate(p.date):'',p.project||'',p.persons.join(', ')||'',p.agenda||''
        ]);
      });
    }
  }
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}

function downloadCsv(content,filename){
  const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

      {[{label:'Employees',val:members.length},{label:'Total Leave Days',val:members.reduce((a,m)=>a+m.dates.length,0)},{label:'On Leave Today',val:members.filter(m=>m.dates.some(isToday)).length}].map(s=>(

          <div style={{fontSize:22,fontWeight:700,color:'var(--accent)',fontFamily:"'JetBrains Mono',monospace"}}>{s.val}</div>
          <div style={{fontSize:10.5,color:'var(--text3)',marginTop:2}}>{s.label}</div>
        </div>

    <div style={{border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',maxHeight:380,overflowY:'auto'}}>
      <table>

            return(<tr key={i}>
              <td style={{fontWeight:600,fontSize:13}}>{m.name}</td>

            </tr>);
          })}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:10,fontSize:11,color:'var(--text3)',textAlign:'center'}}>
      CX Leave Tracker · {generatedAt}
    </div>
  </div></div>);
}

// ─── OOO MODAL ───
function getAutoReplyText(name,dates){
  const sorted=[...dates].sort();const ranges=groupConsecutiveDates(sorted);
  const latestRange=ranges[ranges.length-1];const returnDay=getNextWorkingDay(latestRange.end);
  const returnStr=returnDay.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
  let dateDesc='';
  if(ranges.length===1){const r=ranges[0];if(r.start===r.end)dateDesc='on '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});else dateDesc='from '+new Date(r.start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})+' to '+new Date(r.end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'})}
  else{const first=new Date(ranges[0].start+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});const last=new Date(ranges[ranges.length-1].end+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long'});dateDesc='from '+first+' to '+last}
  return`Hello,\n\nThank you for your email. I am out of office ${dateDesc} and will be back on ${returnStr}.\n\nI have limited access to my mail and will respond to your email as soon as possible upon my return.\n\nThank you for your understanding.\n\nBest regards,\n${name}`;
}
function OooActionsModal({name,dates,onClose}){
  const[copied,setCopied]=useState(false);const[opened,setOpened]=useState(false);
  const sorted=[...dates].sort();const ranges=groupConsecutiveDates(sorted);
  const returnDay=getNextWorkingDay(ranges[ranges.length-1].end);
  const returnStr=returnDay.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const startDateStr=new Date(sorted[0]+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const endDateStr=new Date(sorted[sorted.length-1]+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const autoReply=getAutoReplyText(name,dates);
  const handleCopy=async()=>{try{await navigator.clipboard.writeText(autoReply);setCopied(true);setTimeout(()=>setCopied(false),2500)}catch{const ta=document.createElement('textarea');ta.value=autoReply;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),2500)}};
  const handleOpen=()=>{window.open('https://outlook.office.com/mail/options/accounts/automaticReplies','_blank');setOpened(true)};
  const checkItem=(done,text)=>(<div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}><div style={{width:20,height:20,borderRadius:'50%',border:'2px solid',borderColor:done?'var(--green)':'var(--border)',background:done?'var(--green)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all .2s'}}>{done&&<span style={{color:'#fff',fontSize:11,fontWeight:700}}>✓</span>}</div><span style={{fontSize:12.5,color:'var(--text)',lineHeight:1.5}}>{text}</span></div>);
  const stepStyle={display:'flex',gap:12,padding:14,background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)',marginBottom:10};
  const numStyle={width:26,height:26,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0,marginTop:1};
  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:560}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><h3 style={{fontSize:17,fontWeight:600}}>Set Up Out of Office</h3><button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button></div>
    <div style={{padding:'10px 14px',background:'var(--accent-light)',border:'1px solid var(--accent-border)',borderRadius:8,marginBottom:14,fontSize:13}}><strong>{name}</strong> &nbsp;·&nbsp; {sorted.length} day{sorted.length>1?'s':''} &nbsp;·&nbsp; Returns <strong>{returnStr}</strong></div>
    <div style={stepStyle}><div style={numStyle}>1</div><div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Open Outlook Automatic Replies</div>
      <button className={'btn btn-sm '+(opened?'btn-secondary':'btn-primary')} onClick={handleOpen} style={{marginBottom:10}}>{opened?'Opened — switch to that tab':'Open Automatic Replies ↗'}</button>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'4px 12px'}}>
        {checkItem(false,<>Toggle <strong>Turn on automatic replies</strong> → <strong>On</strong></>)}
        {checkItem(false,<>Check <strong>"Send replies only during a time period"</strong></>)}
        {checkItem(false,<>Start: <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'var(--accent)'}}>{startDateStr}</span></>)}
        {checkItem(false,<>End: <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'var(--accent)'}}>{endDateStr}</span></>)}
        {checkItem(false,<>Paste message from Step 2 → <strong>Save</strong></>)}
      </div>
    </div></div>
    <div style={stepStyle}><div style={numStyle}>2</div><div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>Copy Auto-Reply Message</div>
      <div style={{background:'var(--input-bg)',border:'1px solid var(--border)',borderRadius:8,padding:10,fontSize:12,lineHeight:1.65,whiteSpace:'pre-wrap',color:'var(--text)',maxHeight:170,overflowY:'auto',marginBottom:8}}>{autoReply}</div>
      <button className={'btn btn-sm '+(copied?'btn-secondary':'btn-primary')} onClick={handleCopy}>{copied?'✓ Copied!':'Copy Message'}</button>
    </div></div>
    <div style={{display:'flex',justifyContent:'flex-end',marginTop:4}}><button className="btn btn-secondary" onClick={onClose}>Done</button></div>
  </div></div>);
}

function UserPickerModal({names,selected,onClose,onApply}){

// ─── ADD/EDIT LEAVE MODAL ───
function AddLeaveModal({onClose,onSave,existingNames,editData,userName}){
  const[name]=useState(editData?editData.name:(userName||''));
  const[type,setType]=useState(editData?editData.type:'PTO');
  const[dates,setDates]=useState(editData?[...editData.dates]:[]);
  const[rangeStart,setRangeStart]=useState('');
  const[rangeEnd,setRangeEnd]=useState('');
  const[dateInput,setDateInput]=useState('');
  const[rangeErr,setRangeErr]=useState('');
  const[tab,setTab]=useState('dates');
  const[editFilter,setEditFilter]=useState({date:'',project:''});

  const parseInitialEntries=()=>{
    if(!editData?.backup)return[];
    return parseProjectEntries(editData.backup).map(p=>({...p,newPerson:'',showPicker:false,pickerQ:''}));
  };
  const[entries,setEntries]=useState(parseInitialEntries);

  const weekdays=useMemo(()=>dates.filter(isWeekday).sort(),[dates]);

  // ── Date range validation ──
  const handleRangeStartChange=v=>{
    setRangeStart(v);setRangeErr('');
    // If end is already set and is before new start, clear it
    if(rangeEnd&&v&&rangeEnd<v){setRangeEnd('');setRangeErr('End date was before start — please re-select')}
  };
  const handleRangeEndChange=v=>{
    setRangeEnd(v);setRangeErr('');
    if(rangeStart&&v&&v<rangeStart){setRangeErr('End date must be on or after start date');setRangeEnd('')}
  };

  const applyRange=()=>{
    if(!rangeStart||!rangeEnd){setRangeErr('Select both start and end dates');return}
    if(rangeEnd<rangeStart){setRangeErr('End date must be on or after start date');return}
    const allInRange=expandDateRange(rangeStart,rangeEnd);
    const newDates=new Set(dates);allInRange.forEach(d=>newDates.add(d));
    setDates([...newDates].sort());setRangeStart('');setRangeEnd('');setRangeErr('');
  };

  const rangePreviewDays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?expandDateRange(rangeStart,rangeEnd).length:0;
  const rangePreviewWeekdays=rangeStart&&rangeEnd&&rangeEnd>=rangeStart?getWeekdaysInRange(rangeStart,rangeEnd).length:0;

  const updateEntry=(idx,field,val)=>setEntries(e=>e.map((x,i)=>i===idx?{...x,[field]:val}:x));
  const removeEntry=idx=>setEntries(e=>e.filter((_,i)=>i!==idx));
  const addPersonToEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx)return x;if(x.persons.includes(person))return x;return{...x,persons:[...x.persons,person],showPicker:false,pickerQ:''}}))};
  const removePersonFromEntry=(idx,person)=>{setEntries(e=>e.map((x,i)=>i===idx?{...x,persons:x.persons.filter(p=>p!==person)}:x))};
  const addNewPersonToEntry=(idx)=>{setEntries(e=>e.map((x,i)=>{if(i!==idx||!x.newPerson.trim())return x;const np=x.newPerson.trim();if(x.persons.includes(np))return{...x,newPerson:''};return{...x,persons:[...x.persons,np],newPerson:''}}))};
  const addEntryForDay=(dateStr)=>setEntries(e=>[...e,{date:dateStr,project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  const addBlankEntry=()=>setEntries(e=>[...e,{date:'',project:'',persons:[],newPerson:'',agenda:'',showPicker:false,pickerQ:''}]);
  const deleteDateEntry=(dateStr)=>{setDates(ds=>ds.filter(d=>d!==dateStr));setEntries(e=>e.filter(en=>en.date!==dateStr))};

  const filteredEntries=useMemo(()=>{
    let e=entries;
    if(editFilter.date)e=e.filter(x=>x.date===editFilter.date);
    if(editFilter.project)e=e.filter(x=>x.project.toLowerCase().includes(editFilter.project.toLowerCase()));
    return e;
  },[entries,editFilter]);

  const lbl={fontSize:12,color:'var(--text2)',marginBottom:4,display:'block',fontWeight:500};
  const subLbl={fontSize:11,color:'var(--text3)',marginBottom:3,display:'block'};

  return(<div className="overlay" onClick={onClose}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:640}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <h3 style={{fontSize:17,fontWeight:600}}>{editData?'Edit Leave':'Add Leave'}</h3>
      <button className="btn-icon" onClick={onClose}><Icon name="x" size={16}/></button>
    </div>

    {editData&&<div style={{fontSize:12,color:'var(--text2)',marginBottom:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>Editing leave for <strong>{editData.name}</strong></div>}
    <div style={{marginBottom:14,padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',fontSize:14,fontWeight:600}}>{name||userName||'You'}</div>

    <label style={lbl}>Leave Type</label>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
      {['PTO','Sick','Business Travel','Mixed','Other'].map(t=>(<button key={t} onClick={()=>setType(t)} style={{padding:'5px 14px',borderRadius:999,fontSize:12,fontWeight:500,border:'1px solid',borderColor:type===t?'var(--accent)':'var(--border)',background:type===t?'var(--accent-light)':'transparent',color:type===t?'var(--accent)':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>{t}</button>))}
    </div>

    <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)',marginBottom:14}}>
      {[{k:'dates',label:'📅 Leave Dates'+(dates.length>0?' ('+dates.length+')':'')},{k:'projects',label:'📋 Projects & Backup'+(entries.filter(e=>e.project||e.persons.length>0).length>0?' ('+entries.filter(e=>e.project||e.persons.length>0).length+')':'')}].map(t=>(
        <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:'6px 12px',borderRadius:6,fontSize:12.5,fontWeight:500,border:'none',background:tab===t.k?'var(--accent)':'transparent',color:tab===t.k?'#fff':'var(--text2)',cursor:'pointer',transition:'all .15s'}}>{t.label}</button>
      ))}
    </div>

    {tab==='dates'&&<div>
      {/* Date range picker with validation */}
      <div style={{marginBottom:10,padding:'12px',background:'var(--surface2)',borderRadius:10,border:'1px solid var(--border)'}}>
        <label style={{...lbl,marginBottom:8}}>Add Date Range</label>
        <div style={{display:'flex',gap:6,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>Start date</div>
            <input type="date" className={'input'+(rangeErr&&!rangeStart?' input-error':'')} value={rangeStart} onChange={e=>handleRangeStartChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:22,color:'var(--text3)',fontSize:13,flexShrink:0}}>→</div>
          <div style={{flex:1,minWidth:130}}>
            <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:3}}>End date {rangeStart&&<span style={{color:'var(--accent)'}}>(must be ≥ {fmtDate(rangeStart)})</span>}</div>
            <input type="date" className={'input'+(rangeErr?' input-error':'')} value={rangeEnd} min={rangeStart||undefined} onChange={e=>handleRangeEndChange(e.target.value)}/>
          </div>
          <div style={{paddingTop:20,flexShrink:0}}><button className="btn btn-sm btn-primary" onClick={applyRange} disabled={!rangeStart||!rangeEnd}>Add</button></div>
        </div>
        {rangeErr&&<div className="date-validation-hint">⚠ {rangeErr}</div>}
        {!rangeErr&&rangePreviewDays>0&&<div style={{fontSize:11,color:'var(--text2)',marginTop:5}}>{rangePreviewDays} days ({rangePreviewWeekdays} weekdays) will be added to your leave</div>}
      </div>

      <div style={{display:'flex',gap:8,marginBottom:8}}>
        <input type="date" className="input" value={dateInput} onChange={e=>setDateInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}}/>
        <button className="btn btn-sm btn-secondary" onClick={()=>{if(dateInput&&!dates.includes(dateInput)){setDates(d=>[...d,dateInput].sort());setDateInput('')}}}>+ Single</button>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:11.5,color:'var(--text2)',fontWeight:500}}>{dates.length} date{dates.length!==1?'s':''} · {weekdays.length} weekday{weekdays.length!==1?'s':''}</span>
        {dates.length>0&&<button className="btn btn-sm btn-danger" onClick={()=>setDates([])} style={{fontSize:10,padding:'2px 8px'}}>Clear all</button>}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6,minHeight:24}}>
        {dates.length===0?<span style={{fontSize:12,color:'var(--text3)',fontStyle:'italic'}}>No dates added yet</span>:dates.map(d=>(
          <span key={d} className={'chip '+(isToday(d)?'chip-today':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10.5}}>

    </div>}

    {tab==='projects'&&<div>

        <div style={{fontSize:12,color:'var(--text3)'}}>Add dates in the Leave Dates tab first.</div>

            <option value="">All dates</option>
            {weekdays.map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}

          <input className="input" placeholder="Filter by project..." value={editFilter.project} onChange={e=>setEditFilter(f=>({...f,project:e.target.value}))} style={{flex:1,fontSize:12}}/>
          {(editFilter.date||editFilter.project)&&<button className="btn btn-sm btn-secondary" onClick={()=>setEditFilter({date:'',project:''})} style={{fontSize:11}}>Clear</button>}

          return(<div key={dayStr} className="day-entry-card">
            <div className="day-entry-header">
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span className="day-label">{fmtDate(dayStr)}</span>
                <span style={{fontSize:11,color:'var(--text3)'}}>{new Date(dayStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'})}</span>
              </div>
              <button className="btn btn-sm btn-secondary" onClick={()=>addEntryForDay(dayStr)} style={{fontSize:11,padding:'2px 8px'}}><Icon name="plus" size={11}/> Add Project</button>
            </div>
            {relevantEntries.length===0&&<div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',padding:'2px 0'}}>No projects — click "Add Project"</div>}
            {relevantEntries.map(entry=>{

              return(<div key={idx} className="fade-in" style={{background:'var(--surface)',borderRadius:8,padding:10,marginTop:8,border:'1px solid var(--border)'}}>

                  <div style={{maxHeight:100,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
                    {existingNames.filter(n=>!entry.persons.includes(n)&&(!entry.pickerQ||n.toLowerCase().includes(entry.pickerQ.toLowerCase()))).map(n=>(
                      <div key={n} onClick={()=>addPersonToEntry(idx,n)} style={{padding:'4px 8px',borderRadius:4,fontSize:12,cursor:'pointer'}} onMouseOver={e=>e.currentTarget.style.background='var(--accent-light)'} onMouseOut={e=>e.currentTarget.style.background='transparent'}>{n}</div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:6,marginTop:6,borderTop:'1px solid var(--border)',paddingTop:6}}>
                    <input className="input" placeholder="Or type new name..." value={entry.newPerson} onChange={e=>updateEntry(idx,'newPerson',e.target.value)} onKeyDown={e=>e.key==='Enter'&&addNewPersonToEntry(idx)} style={{fontSize:12,padding:'4px 8px',flex:1}}/>
                    <button className="btn btn-sm btn-primary" onClick={()=>addNewPersonToEntry(idx)} style={{fontSize:11,padding:'3px 10px'}}>Add</button>
                  </div>
                </div>}
                <label style={subLbl}>Agenda / Notes</label>
                <input className="input" placeholder="Meeting agenda, handoff notes..." value={entry.agenda} onChange={e=>updateEntry(idx,'agenda',e.target.value)} style={{fontSize:13}}/>
              </div>);
            })}
          </div>);
        })}
        <div style={{marginTop:8,display:'flex',justifyContent:'center'}}>
          <button className="btn btn-sm btn-secondary" onClick={addBlankEntry} style={{fontSize:12}}><Icon name="plus" size={12}/> Add multi-day project entry</button>
        </div>
      </div>}
    </div>}

    <div style={{display:'flex',gap:8,marginTop:18,justifyContent:'space-between',alignItems:'center'}}>
      <span style={{fontSize:11.5,color:'var(--text3)'}}>{dates.length} date{dates.length!==1?'s':''} · {entries.filter(e=>e.project||e.persons.length>0).length} entries</span>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={()=>{if(!name.trim())return;onSave({name:name.trim(),type,dates,backup:buildBackupString(entries)})}}>{editData?'Update':'Save'}</button>
      </div>
    </div>
  </div></div>);
}

// ─── MAIN APP ───
function App(){
  const[theme,setTheme]=useState(()=>localStorage.getItem('cx_lt_theme')||'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('cx_lt_theme',theme)},[theme]);
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('cx_lt_session'))}catch{return null}});
  const[data,setData]=useState([]);
  const[lastSync,setLastSync]=useState('Loading...');
  const[view,setView]=useState('upcoming');const[weekDate,setWeekDate]=useState(new Date());
  const[typeFilter,setTypeFilter]=useState('All');const[search,setSearch]=useState('');
  const[selectedUsers,setSelectedUsers]=useState([]);
  const[showAddLeave,setShowAddLeave]=useState(false);const[showUserPicker,setShowUserPicker]=useState(false);
  const[toasts,setToasts]=useState([]);const[editingIdx,setEditingIdx]=useState(null);
  const[showOoo,setShowOoo]=useState(false);const[oooData,setOooData]=useState(null);
  const[showDeleteConfirm,setShowDeleteConfirm]=useState(null);
  const[showExport,setShowExport]=useState(null);  // single member export
  const[showBulkExport,setShowBulkExport]=useState(false);
  const[refreshing,setRefreshing]=useState(false);
  const toast=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)};

  const loadAllData=async()=>{
    let canvasMembers=[];
    try{const c=await readCache();if(c){canvasMembers=parseCanvasMarkdown(c.markdown);setLastSync(new Date(c.updated_at).toLocaleString())}}catch{}
    try{const ul=await fetchUserLeaves();const merged=mergeCanvasAndUserLeaves(canvasMembers,ul);setData(merged)}catch{setData(canvasMembers)}
  };
  useEffect(()=>{loadAllData()},[]);

  const handleRefresh=async()=>{
    setRefreshing(true);
    try{await loadAllData();toast('Refreshed','success')}
    catch(e){toast('Refresh failed: '+e.message,'error')}
    setRefreshing(false);
  };

  const allNames=useMemo(()=>data.map(m=>m.name).sort(),[data]);

  const filtered=useMemo(()=>{
    let r=data;
    if(view==='today')r=r.filter(m=>m.dates.some(isToday));
    else if(view==='upcoming')r=r.filter(m=>m.dates.length>0);
    else if(view==='week')r=r.filter(m=>m.dates.some(d=>inWeek(d,weekDate)));
    if(typeFilter!=='All')r=r.filter(m=>m.type===typeFilter);
    if(selectedUsers.length>0)r=r.filter(m=>selectedUsers.includes(m.name));
    if(search.trim()){const q=search.toLowerCase();r=r.filter(m=>m.name.toLowerCase().includes(q)||m.backup.toLowerCase().includes(q)||m.dates.some(d=>d.includes(q)))}
    return[...r].sort((a,b)=>{const aMe=user&&a.name.toLowerCase()===user.name.toLowerCase();const bMe=user&&b.name.toLowerCase()===user.name.toLowerCase();if(aMe&&!bMe)return-1;if(!aMe&&bMe)return 1;return a.name.localeCompare(b.name)});
  },[data,view,weekDate,typeFilter,selectedUsers,search,user]);

  const stats=useMemo(()=>({total:data.length,today:data.filter(m=>m.dates.some(isToday)).length,week:data.filter(m=>m.dates.some(d=>inWeek(d,new Date()))).length,upcoming:data.filter(m=>m.dates.length>0).length}),[data]);
  const clearFilters=()=>{setView('upcoming');setTypeFilter('All');setSearch('');setSelectedUsers([])};

  // Build human-readable filter description for bulk export
  const filterDesc=useMemo(()=>{
    const parts=[];
    if(view!=='upcoming')parts.push('View: '+view.charAt(0).toUpperCase()+view.slice(1));
    if(typeFilter!=='All')parts.push('Type: '+typeFilter);
    if(selectedUsers.length>0)parts.push('Members: '+selectedUsers.join(', '));
    if(search.trim())parts.push('Search: "'+search.trim()+'"');
    return parts.join(' · ');
  },[view,typeFilter,selectedUsers,search]);

  const hasFilters=!!(view!=='upcoming'||typeFilter!=='All'||selectedUsers.length>0||search.trim());

  const handleDeleteMember=idx=>setShowDeleteConfirm(idx);
  const confirmDelete=async()=>{
    const idx=showDeleteConfirm;const member=data[idx];
    setData(d=>d.filter((_,i)=>i!==idx));setShowDeleteConfirm(null);
    try{await softDeleteLeave(member.name);toast(member.name+' removed','success')}
    catch{toast('Removed locally (save failed)','error')}
  };

  const handleSaveLeave=async(entry)=>{
    const savedDates=entry.dates.filter(isFuture).sort();
    const wasEditing=editingIdx!==null;
    if(wasEditing){
      setData(d=>d.map((m,i)=>i===editingIdx?{...m,name:entry.name,type:entry.type,dates:savedDates,backup:entry.backup}:m));
      setEditingIdx(null);
      try{await upsertLeave({...entry,dates:savedDates},user?.email||'');toast('Updated & saved','success')}
      catch{toast('Updated locally (save failed)','error')}
    }else{
      const ei=data.findIndex(m=>m.name.toLowerCase()===entry.name.toLowerCase());
      if(ei>=0){setData(d=>d.map((m,i)=>{if(i!==ei)return m;const mg=new Set([...m.dates,...entry.dates]);return{...m,dates:[...mg].filter(isFuture).sort(),backup:entry.backup||m.backup,type:entry.type||m.type}}))}
      else{setData(d=>[...d,{name:entry.name,dates:savedDates,backup:entry.backup,type:entry.type,raw:''}])}
      try{await upsertLeave({...entry,dates:savedDates},user?.email||'');toast('Leave added & saved','success')}
      catch{toast('Added locally (save failed)','error')}
    }
    setShowAddLeave(false);
    if(savedDates.length>0){setTimeout(()=>{setOooData({name:entry.name,dates:savedDates});setShowOoo(true)},150)}
  };

  if(!user)return<LoginScreen onLogin={setUser}/>;
  const tbc={PTO:'badge-pto',Sick:'badge-sick',Mixed:'badge-mixed','Business Travel':'badge-bt',Other:'badge-other'};

  return(<div style={{minHeight:'100vh',background:'var(--bg)'}}>
    <ToastContainer toasts={toasts} remove={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>

    <header style={{position:'sticky',top:0,zIndex:50,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',background:'var(--header-bg)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--header-border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,color:'#fff',fontWeight:700}}>CX</div>
        <span style={{fontSize:17,fontWeight:700}}>Leave Tracker</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <button className="btn btn-secondary btn-sm" onClick={handleRefresh} disabled={refreshing}><span className={refreshing?'spin':''} style={{display:'inline-flex'}}><Icon name="refresh" size={14}/></span> {refreshing?'…':'Refresh'}</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditingIdx(null);setShowAddLeave(true)}}><Icon name="plus" size={14}/> Add My Leave</button>
        <button className="theme-toggle" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}/>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4,paddingLeft:8,borderLeft:'1px solid var(--border)'}}>
          <span style={{fontSize:12,color:'var(--text2)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name}</span>
          <button className="btn-icon" title="Logout" onClick={()=>{localStorage.removeItem('cx_lt_session');setUser(null)}} style={{width:28,height:28}}><Icon name="logout" size={14}/></button>
        </div>
      </div>
    </header>

    <main style={{maxWidth:1320,margin:'0 auto',padding:'18px 18px 40px'}}>
      <div className="stat-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[{key:'all',val:stats.total,label:'Total Members',color:'var(--accent)'},{key:'today',val:stats.today,label:'On Leave Today',color:'var(--red)'},{key:'week',val:stats.week,label:'This Week',color:'var(--amber)'},{key:'upcoming',val:stats.upcoming,label:'Upcoming Leaves',color:'var(--green)'}].map(s=>(<div key={s.key} className={'stat-card '+(view===s.key?'active':'')} onClick={()=>setView(s.key)}><div className="value" style={{color:s.color}}>{s.val}</div><div className="label">{s.label}</div></div>))}
      </div>

      <div className="card" style={{padding:12,marginBottom:14}}>
        <div className="filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:2,background:'var(--surface2)',borderRadius:8,padding:2,border:'1px solid var(--border)'}}>
            {['upcoming','today','week','all'].map(v=>(<button key={v} onClick={()=>setView(v)} style={{padding:'5px 12px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:view===v?'var(--accent)':'transparent',color:view===v?'#fff':'var(--text2)',cursor:'pointer'}}>{v==='all'?'All':v[0].toUpperCase()+v.slice(1)}</button>))}
          </div>
          {view==='week'&&<div style={{display:'flex',alignItems:'center',gap:4}}>
            <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,-1))} style={{width:26,height:26}}><Icon name="chevL" size={14}/></button>
            <span style={{fontSize:12,color:'var(--text2)',minWidth:110,textAlign:'center',fontFamily:"'JetBrains Mono',monospace"}}>{fmtDate(getWeekRange(weekDate)[0])+' – '+fmtDate(getWeekRange(weekDate)[1])}</span>
            <button className="btn-icon" onClick={()=>setWeekDate(d=>shiftWeek(d,1))} style={{width:26,height:26}}><Icon name="chevR" size={14}/></button>
            <button className="btn btn-sm btn-secondary" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setWeekDate(new Date())}>This week</button>
          </div>}
          <select className="input" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto',fontSize:12,padding:'5px 28px 5px 10px'}}>{['All','PTO','Sick','Mixed','Business Travel'].map(t=><option key={t}>{t}</option>)}</select>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowUserPicker(true)}><Icon name="users" size={13}/> {selectedUsers.length>0?selectedUsers.length+' selected':'Members'}</button>
          <div style={{position:'relative',flex:'1 1 140px',minWidth:130}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',display:'flex'}}><Icon name="search" size={14}/></span>
            <input className="input" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:32,fontSize:12}}/>
          </div>
          <button className="btn btn-sm btn-danger" onClick={clearFilters} style={{fontSize:11}}>Clear</button>
          {/* ── Bulk Export button ── */}
          <button
            className="btn btn-sm"
            onClick={()=>setShowBulkExport(true)}
            title={hasFilters?'Export filtered results ('+filtered.length+' rows)':'Export all ('+filtered.length+' rows)'}
            style={{background:'var(--green-bg)',color:'var(--green)',border:'1px solid rgba(43,138,62,.25)',whiteSpace:'nowrap'}}
          >
            <Icon name="download" size={13}/>
            {hasFilters?'Export filtered ('+filtered.length+')':'Export all ('+filtered.length+')'}
          </button>
        </div>
      </div>

      <div className="card responsive-table" style={{overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table><thead><tr>
            <th>Name</th><th>Type</th><th>Leave Dates</th><th>Days</th>
            <th className="desktop-only">Project</th><th className="desktop-only">Backup</th><th className="desktop-only">Agenda</th>
            <th style={{width:88}}>Actions</th>
          </tr></thead><tbody>
            {filtered.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:40,color:'var(--text3)'}}>No matching records</td></tr>:filtered.map((m,i)=>{
              const oi=data.indexOf(m);const dc=m.dates.length;
              const isMe=user&&m.name.toLowerCase()===user.name.toLowerCase();
              const projects=parseProjectEntries(m.backup||'');
              const rowSpan=Math.max(projects.length,1);
              return(<React.Fragment key={m.name+i}>
                <tr className="fade-in">
                  <td rowSpan={rowSpan} style={{fontWeight:600,whiteSpace:'nowrap',fontSize:13.5,verticalAlign:'top'}}>{m.name}{isMe&&<span style={{fontSize:10,color:'var(--accent)',marginLeft:4}}>(you)</span>}</td>
                  <td rowSpan={rowSpan} style={{verticalAlign:'top'}}><span className={'badge '+(tbc[m.type]||'badge-none')}>{m.type}</span></td>
                  <td rowSpan={rowSpan} style={{maxWidth:260,verticalAlign:'top'}}><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{dc===0?<span style={{color:'var(--text3)',fontSize:12}}>No upcoming</span>:m.dates.slice(0,10).map(d=>(<span key={d} className={'chip '+(isToday(d)?'chip-today pulse':'chip-future')} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10.5}}>{fmtDate(d)}</span>))}{dc>10&&<span className="chip chip-gray" style={{fontSize:10}}>+{dc-10}</span>}</div></td>
                  <td rowSpan={rowSpan} style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,fontSize:14,textAlign:'center',verticalAlign:'top'}}><span style={dc>5?{color:'var(--amber)',background:'var(--amber-bg)',padding:'2px 8px',borderRadius:6}:{}}>{dc}</span></td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{projects[0]?projects[0].project||'':''}</td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{projects[0]?projects[0].persons.join(', ')||'':''}</td>
                  <td className="desktop-only" style={{fontSize:12,color:'var(--text3)'}}>{projects[0]?projects[0].agenda||'':''}</td>
                  <td rowSpan={rowSpan} style={{verticalAlign:'top'}}>
                    <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                      {/* Per-row export (always visible) */}
                      <button className="btn-icon" onClick={()=>setShowExport(m)} title="Export this record" style={{width:28,height:28,color:'var(--indigo)'}}><Icon name="share" size={13}/></button>
                      {isMe&&<>
                        <button className="btn-icon" onClick={()=>{setEditingIdx(oi);setShowAddLeave(true)}} title="Edit" style={{width:28,height:28}}><Icon name="edit" size={13}/></button>
                        <button className="btn-icon" onClick={()=>handleDeleteMember(oi)} title="Delete" style={{width:28,height:28,color:'var(--red)'}}><Icon name="trash" size={13}/></button>
                      </>}
                    </div>
                  </td>
                </tr>
                {projects.slice(1).map((p,pi)=>(
                  <tr key={m.name+'-proj-'+pi} className="fade-in">
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{p.project||''}</td>
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text2)'}}>{p.persons.join(', ')||''}</td>
                    <td className="desktop-only" style={{fontSize:12,color:'var(--text3)'}}>{p.agenda||''}</td>
                  </tr>
                ))}
              </React.Fragment>);
            })}
          </tbody></table>
        </div>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text3)'}}>
          <span>Showing {filtered.length} of {data.length}{hasFilters&&<span style={{color:'var(--accent)',marginLeft:6}}>· Filtered</span>}</span>
          <span style={{fontFamily:"'JetBrains Mono',monospace"}}>Last sync: {lastSync}</span>
        </div>
      </div>
    </main>

    {showAddLeave&&<AddLeaveModal onClose={()=>{setShowAddLeave(false);setEditingIdx(null)}} onSave={handleSaveLeave} existingNames={allNames} editData={editingIdx!==null?data[editingIdx]:null} userName={user.name}/>}
    {showUserPicker&&<UserPickerModal names={allNames} selected={selectedUsers} onClose={()=>setShowUserPicker(false)} onApply={sel=>{setSelectedUsers(sel);setShowUserPicker(false)}}/>}
    {showOoo&&oooData&&<OooActionsModal name={oooData.name} dates={oooData.dates} onClose={()=>{setShowOoo(false);setOooData(null)}}/>}
    {showExport&&<ExportModal member={showExport} onClose={()=>setShowExport(null)}/>}
    {showBulkExport&&<BulkExportModal members={filtered} filterDesc={filterDesc} onClose={()=>setShowBulkExport(false)}/>}
    {showDeleteConfirm!==null&&data[showDeleteConfirm]&&<div className="overlay" onClick={()=>setShowDeleteConfirm(null)}><div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
      <h3 style={{fontSize:17,fontWeight:600,marginBottom:12,color:'var(--red)'}}>Delete Leave Record</h3>
      <p style={{fontSize:13.5,marginBottom:8}}>Remove <strong>{data[showDeleteConfirm].name}</strong>?</p>
      {data[showDeleteConfirm].dates.length>0&&<div style={{marginBottom:12}}>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:6}}>{data[showDeleteConfirm].dates.length} leave date{data[showDeleteConfirm].dates.length>1?'s':''} will be removed:</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{data[showDeleteConfirm].dates.slice(0,8).map(d=>(<span key={d} className="chip chip-future" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>{fmtDate(d)}</span>))}{data[showDeleteConfirm].dates.length>8&&<span className="chip chip-gray" style={{fontSize:10}}>+{data[showDeleteConfirm].dates.length-8} more</span>}</div>
      </div>}
      <p style={{fontSize:12,color:'var(--text3)',marginBottom:14}}>Saved to database — visible to all users.</p>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button className="btn btn-secondary" onClick={()=>setShowDeleteConfirm(null)}>Cancel</button>
        <button className="btn btn-danger" onClick={confirmDelete} style={{background:'var(--red)',color:'#fff',border:'none'}}>Delete</button>
      </div>
    </div></div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
